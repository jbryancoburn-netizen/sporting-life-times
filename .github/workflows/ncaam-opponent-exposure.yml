name: NCAA Opponent Exposure Audit
on:
  push:
    paths:
      - scripts/audit_ncaam_opponent_exposure.py
      - scripts/test_audit_ncaam_opponent_exposure.py
      - .github/workflows/ncaam-opponent-exposure.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_audit_ncaam_opponent_exposure.py -v
      - run: python scripts/audit_ncaam_opponent_exposure.py
      - uses: actions/upload-artifact@v4
        with:
          name: ncaam-opponent-exposure-audit
          path: data/ncaam-player-opponent-exposure-audit.json
