name: Publish The Sporting Life & Times (main)
on:
  push:
    branches: [main]
  # The built-in GITHUB_TOKEN pushes made by collector workflows do not
  # trigger another push workflow. Deploy independently of those commits.
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows:
      - Official NBA game-center refresh
      - NBA Elo verified final-game refresh
      - NBA top stories refresh
      - NBA injury and transaction wire
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the exact published files and individual leaders
        run: |
          test -s nba.html
          test -s nba-players.html
          test -s nba-intelligence.js
          grep -q 'NBA · Individual Player Leaders' nba-players.html
          grep -q 'Anthony Edwards' nba-players.html
          grep -q 'id="nba-individual-player-leaders"' nba.html
          grep -q 'NBA EDITION · SIGNATURE R4' nba.html
          grep -q 'nba-analysis-result' nba.html
          grep -q 'nba-boxscore-match' nba.html
          grep -q 'nba-forecast-match' nba.html
          grep -q 'nba-analysis-match' nba.html
          test -s nba-team-desk.html
          test -s nba-live-feed.js
          test -s nba-live-game.html
          grep -q 'Accessible newspaper links' nba.html
          grep -q 'edition-design.css?v=nba-contrast4' nba.html
          grep -q 'NBA contrast contract' nba.html
          grep -q 'NBA masthead/nav match actual white surface' nba.html
          grep -q 'class="nba-publication-title"' nba.html
          grep -q 'class="nba-publication-navigation"' nba.html
          grep -q 'Isolated NBA masthead' nba.html
          grep -q 'body.edition-interior.nba-edition nav.site-nav{background:#262b32!important' edition-design.css
          grep -q 'class="edition-interior nba-edition"' nba.html
          grep -q 'background-color:#ffffff!important' nba.html
          grep -q 'style="color:#17212b!important;-webkit-text-fill-color:#17212b!important' nba.html
          if grep -q 'body.edition-interior .site-nav a:hover,body.edition-interior .site-nav a:focus-visible{color:#242420' edition-design.css; then echo 'FAIL: shared stylesheet forces dark NBA navigation links' >&2; exit 1; fi
          grep -q 'Explicit contrast for every interactive region' nba-live-game.html
          test -s nba-live-game.js
          grep -q 'nba-live-game.js?v=3' nba-live-game.html
          grep -q 'nba-live-game.html?game=' nba-live-feed.js
          node --check nba-live-game.js
          grep -q 'id="live-leaders"' nba-live-game.html
          grep -q 'leadersPanel' nba-live-game.js
          grep -q 'NBA LIVE' nba.html
          python - <<'PY'
          from pathlib import Path
          html=Path('nba.html').read_text()
          live=html.index('id="nba-live-games"')
          collapsed=html.index('<details class="nba-secondary-data">')
          assert live < collapsed, 'Live games must not sit inside collapsed secondary data'
          assert live < html.index('class="edition-page-turner"'), 'Live scoreboard must be above paged newspaper controls'
          assert "'nba-live-games'" not in Path('nba-page-turner.js').read_text(), 'Live scoreboard must never be hidden by page turning'
          assert 'nba-live-game.html?game=' in Path('nba-live-feed.js').read_text()
          print('Live scoreboard exposed, linked to game details')
          PY
          test "$(grep -o 'id="nba-live-games"' nba.html | wc -l)" -eq 1
          grep -q 'nba-page-turner.js?v=7' nba.html
          grep -q 'nba-live-feed.js?v=4' nba.html
          node --check nba-live-feed.js
          test -s nba-team-desk.js
          grep -q 'nba-team-desk.js?v=4' nba-team-desk.html
          grep -q 'AROUND THE CLUB' nba-team-desk.html
          grep -q 'THE SCOREBOOK' nba-team-desk.html
          grep -q 'LATEST GAME' nba-team-desk.html
          grep -q 'TEAM LEADERS' nba-team-desk.html
          grep -q 'nba-scorebug.js' nba-team-desk.html
          grep -q 'Editorial architecture' nba-team-desk.html
          grep -q 'recent team-specific articles' nba-team-desk.js
          grep -q 'TEAM DESKS' nba.html
          node --check nba-team-desk.js
          test -s nba-game-center.html
          test -s nba-game-center.js
          grep -q 'nba-game-center.js?v=7' nba-game-center.html
          grep -q "esc(record)" nba-game-center.js
          grep -q 'Quarter by Quarter' nba-game-center.js
          grep -q 'Team Comparison' nba-game-center.js
          test -s nba-game-comparison.js
          grep -q 'nba-game-comparison.js?v=3' nba-game-center.html
          node --check nba-game-comparison.js
          node scripts/test-nba-comparison.mjs
          python - <<'PY'
          import json
          games=json.load(open('data/nba-game-center.json'))['games']
          assert any(g.get('period_scores') and g.get('team_comparison') for g in games), 'No enriched game statistics in archive'
          print('Game details present:',sum(bool(g.get('period_scores')) for g in games),'quarter-scoring entries')
          PY
          grep -q 'nba-analysis-team' nba-home.js
          test -s data/nba-top-stories.json
          node --check nba-home.js
          node --check nba-intelligence.js
          python - <<'PY'
          import json
          news=json.load(open('data/nba-top-stories.json'))
          headlines=news.get('articles',[])
          assert len(headlines)>=3, 'NBA Top Stories source is empty'
          assert all(a.get('title') and a.get('url','').startswith('https://') and a.get('category')=='NBA' for a in headlines)
          assert 'data/nba-top-stories.json' in open('nba-home.js').read(), 'NBA page does not load its own news feed'
          print('PASS: NBA Top Stories contains',len(headlines),'attributed stories')
          PY
      - name: Refuse NBA newspaper deployment when completed scores and Elo disagree
        run: |
          node scripts/audit-nba-elo.mjs
          node scripts/audit-nba-boxscore-elo.mjs
      - name: Stamp the exact Git commit into the published edition
        run: |
          printf '%s\n' "${GITHUB_SHA}" > pages-build-sha.txt
          test -s pages-build-sha.txt
      - name: Prepare static site and deployment diagnostics
        run: |
          touch .nojekyll
          cat > deployment-status.html <<EOF
          <!doctype html><html lang="en"><meta charset="utf-8"><title>Sporting Life & Times · Deployment Status</title><body><h1>Sporting Life & Times · Deployment Status</h1><p>Published source revision: ${GITHUB_SHA}</p><p><a href="nba-players.html">NBA individual player leaders</a> · <a href="nba.html">NBA newspaper</a></p></body></html>
          EOF
          test -s deployment-status.html
      - name: Diagnose Pages publishing configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /tmp/pages-config.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          echo "GitHub Pages settings HTTP status: $STATUS"
          if [ "$STATUS" = 200 ]; then
            python - <<'PY'
          import json
          with open('/tmp/pages-config.json') as f: p=json.load(f)
          print('Pages address:',p.get('html_url'))
          print('Build type:',p.get('build_type'))
          print('Publishing source:',p.get('source'))
          if p.get('build_type') not in ('workflow',None):
              print('WARNING: Pages appears to use branch publishing; select GitHub Actions in Settings > Pages.')
          PY
          elif [ "$STATUS" = 404 ]; then
            echo 'Pages is not enabled or cannot be read with this token; check Settings > Pages.' >&2
          else
            echo "Unable to inspect Pages settings (HTTP $STATUS); continuing to attempt publication." >&2
          fi
      - name: Ensure GitHub Actions is the Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /tmp/current-pages-config.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          if [ "$STATUS" = 200 ]; then
            TYPE="$(python -c "import json;print(json.load(open('/tmp/current-pages-config.json')).get('build_type','unknown'))")"
            echo "Existing GitHub Pages build type: $TYPE"
            if [ "$TYPE" != workflow ]; then
              echo "Pages is not configured for Actions deployment. Attempting to select workflow source."
              UPDATE_STATUS="$(curl -sS -X PUT -o /tmp/pages-update.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d '{"build_type":"workflow"}' "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
              echo "Pages configuration update status: $UPDATE_STATUS"
              if [ "$UPDATE_STATUS" != 204 ] && [ "$UPDATE_STATUS" != 200 ]; then
                echo "::error::GitHub Pages uses branch publishing, and the Actions token cannot switch it. Open Settings > Pages > Build and deployment > Source: GitHub Actions."
                cat /tmp/pages-update.json
                exit 1
              fi
            fi
          elif [ "$STATUS" = 404 ]; then
            echo "::error::GitHub Pages is not enabled or the Actions token cannot read its configuration. Enable GitHub Pages in repository Settings > Pages."
            exit 1
          else
            echo "::warning::GitHub Pages settings returned HTTP $STATUS; deployment will be attempted."
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload entire newspaper
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify new team desk is publicly served
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ROOT="${PAGES_URL%/}"
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 15 "$ROOT/nba-team-desk.html?team=IND" -o /tmp/nba-team-page.html && \
               curl -fsSL --max-time 15 "$ROOT/nba-team-desk.js?v=4" -o /tmp/nba-team-page.js && \
               grep -q 'THE SCOREBOOK' /tmp/nba-team-page.html && \
               grep -q 'nba-top-stories.json' /tmp/nba-team-page.js; then
              echo 'PASS: public NBA team desk and team news renderer accessible'
              exit 0
            fi
            sleep 10
          done
          echo 'FAIL: team desk files missing from publicly deployed newspaper' >&2
          exit 1
      - name: Verify the actual public NBA player-leaders page
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ROOT="${PAGES_URL%/}"
          TARGET="$ROOT/nba-players.html"
          EXPECTED_SHA="$GITHUB_SHA"
          echo "Verifying published NBA statistics at: $TARGET"
          for attempt in $(seq 1 12); do
            if ! curl --fail --location --silent --show-error --max-time 12 "$ROOT/pages-build-sha.txt" -o /tmp/live-pages-sha.txt; then
              echo "Publication marker missing: site is still serving the previous build" >&2
            elif [ "$(cat /tmp/live-pages-sha.txt)" != "$EXPECTED_SHA" ]; then
              echo "Published site is stale: expected $EXPECTED_SHA; received $(cat /tmp/live-pages-sha.txt)" >&2
            elif curl --fail --location --silent --show-error --max-time 12 "$TARGET" -o /tmp/published-nba-players.html; then
              if grep -q 'NBA · Individual Player Leaders' /tmp/published-nba-players.html && grep -q 'Anthony Edwards' /tmp/published-nba-players.html && grep -q 'Victor Wembanyama' /tmp/published-nba-players.html; then
                NBA_TARGET="${PAGES_URL%/}/nba.html"
                if ! curl --fail --location --silent --show-error --max-time 12 "$NBA_TARGET" -o /tmp/published-nba.html; then
                  echo "NBA front page is still unavailable" >&2
                elif grep -q 'id="nba-individual-player-leaders"' /tmp/published-nba.html && grep -q 'NBA EDITION · SIGNATURE R4' /tmp/published-nba.html && grep -q 'nba-analysis-result' /tmp/published-nba.html && grep -q 'nba-boxscore-match' /tmp/published-nba.html && grep -q 'nba-forecast-match' /tmp/published-nba.html && grep -q 'nba-analysis-match' /tmp/published-nba.html && curl --fail --location --silent --show-error --max-time 12 "$ROOT/nba-game-center.html" -o /tmp/live-game-center.html && grep -q 'nba-game-center.js?v=7' /tmp/live-game-center.html && curl --fail --location --silent --show-error --max-time 12 "$ROOT/nba-game-center.js?v=7" -o /tmp/live-game-center.js && grep -q 'esc(record)' /tmp/live-game-center.js && grep -q 'Quarter by Quarter' /tmp/live-game-center.js && grep -q 'Team Comparison' /tmp/live-game-center.js && grep -q 'nba-game-comparison.js?v=3' /tmp/live-game-center.html && curl --fail --location --silent --show-error --max-time 12 "$ROOT/nba-game-comparison.js?v=3" -o /tmp/live-game-comparison.js && grep -q 'function analyze' /tmp/live-game-comparison.js && curl --fail --location --silent --show-error --max-time 12 "$ROOT/data/nba-game-center.json" -o /tmp/live-game-center-data.json && python -c "import json;g=json.load(open('/tmp/live-game-center-data.json'))['games'];assert any(x.get('period_scores') and x.get('team_comparison') for x in g)"; then
                  echo "PASS: live NBA desk and individual player-leaders edition both match current source"
                  exit 0
                else
                  echo "The live NBA desk still serves old markup" >&2
                fi
              fi
            fi
            echo "Published site not current yet (attempt $attempt of 12)"
            sleep 10
          done
          echo 'FAIL: deployed Pages did not serve the correct player-leader tables' >&2
          exit 1
