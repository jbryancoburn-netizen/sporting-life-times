name: Publish The Sporting Life & Times (main)
on:
  # Immediate push-based site releases run in publish-newspaper.yml. This
  # richer NBA-certified publisher stays scheduled and collector-triggered.
  # The independent NBA integrity gate must not block HTML/CSS-only pushes.
  # The built-in GITHUB_TOKEN pushes made by collector workflows do not
  # trigger another push workflow. Deploy independently of those commits.
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_run:
    workflows:
      - Official NBA game-center refresh
      - NBA Elo verified final-game refresh
      - NBA top stories refresh
      - NBA injury and transaction wire
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Refresh NBA headlines in the actual Pages artifact
        run: |
          # Collector commits do not themselves trigger push workflows with GITHUB_TOKEN.
          # Rebuild NBA headlines within this independent Pages deployment, so the
          # published page is not stranded on last night's committed snapshot.
          if python3 scripts/collect-nba-stories.py; then
            python3 scripts/test-nba-news-editorial.py
          else
            echo "::warning::NBA news sources unavailable; retaining last verified stories"
          fi
      - name: Validate every browser JavaScript file and inline script
        run: |
          set -euo pipefail
          for script in *.js; do node --check "$script"; done
          python3 scripts/check_inline_javascript.py
      - name: Verify newspaper structural regressions
        run: node --test tests/newspaper-structure.test.cjs
      - name: Check new NBA edition, active links and data integrity
        run: |
          set -euo pipefail
          node --test tests/nba-edition.test.cjs tests/newspaper-structure.test.cjs
          python3 - <<'PY'
          from pathlib import Path
          pages=['nba.html','nba-standings.html','nba-conference.html','nba-playoffs.html','nba-rankings.html','nba-players.html','nba-matchups.html','nba-team-desk.html']
          for path in pages:
              html=Path(path).read_text()
              assert 'mbb-newspaper.css' in html and 'nba-newspaper.css' in html
              assert 'nba-newspaper.js' in html
              assert 'class="nba-newspaper"' in html
              assert 'nba-page-turner.js' not in html
              assert '<nav class="nav" aria-label="NBA newspaper navigation">' in html
          for path in ['nba-game-center.html','nba-live-game.html']:
              html=Path(path).read_text()
              assert 'nba-detail-nav.js' in html and 'nba-newspaper.css' in html
          js=Path('nba-newspaper.js').read_text()
          for key in ['data/nba-2026-27-current-provisional.json','data/nba-game-center.json','data/nba-player-leaders.json','data/nba-top-stories.json','data/nba-upcoming-schedule.json']:
              assert key in js
          print('NBA main pages, permanent navigation, detail-page shell, and source feeds verified.')
          PY
          node --check nba-newspaper.js
          node --check nba-detail-nav.js
          node --check nba-game-center.js
          node --check nba-live-game.js
          node scripts/test-nba-comparison.mjs
      - name: Refuse NBA newspaper deployment when completed scores and Elo disagree
        run: |
          node scripts/audit-nba-elo.mjs
          node scripts/audit-nba-boxscore-elo.mjs
      - name: Stamp the exact Git commit into the published edition
        run: |
          printf '%s\n' "${GITHUB_SHA}" > pages-build-sha.txt
          test -s pages-build-sha.txt
      - name: Prepare static site and deployment diagnostics
        run: |
          touch .nojekyll
          cat > deployment-status.html <<EOF
          <!doctype html><html lang="en"><meta charset="utf-8"><title>Sporting Life & Times · Deployment Status</title><body><h1>Sporting Life & Times · Deployment Status</h1><p>Published source revision: ${GITHUB_SHA}</p><p><a href="nba-players.html">NBA individual player leaders</a> · <a href="nba.html">NBA newspaper</a></p></body></html>
          EOF
          test -s deployment-status.html
      - name: Diagnose Pages publishing configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /tmp/pages-config.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          echo "GitHub Pages settings HTTP status: $STATUS"
          if [ "$STATUS" = 200 ]; then
            python - <<'PY'
          import json
          with open('/tmp/pages-config.json') as f: p=json.load(f)
          print('Pages address:',p.get('html_url'))
          print('Build type:',p.get('build_type'))
          print('Publishing source:',p.get('source'))
          if p.get('build_type') not in ('workflow',None):
              print('WARNING: Pages appears to use branch publishing; select GitHub Actions in Settings > Pages.')
          PY
          elif [ "$STATUS" = 404 ]; then
            echo 'Pages is not enabled or cannot be read with this token; check Settings > Pages.' >&2
          else
            echo "Unable to inspect Pages settings (HTTP $STATUS); continuing to attempt publication." >&2
          fi
      - name: Ensure GitHub Actions is the Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /tmp/current-pages-config.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          if [ "$STATUS" = 200 ]; then
            TYPE="$(python -c "import json;print(json.load(open('/tmp/current-pages-config.json')).get('build_type','unknown'))")"
            echo "Existing GitHub Pages build type: $TYPE"
            if [ "$TYPE" != workflow ]; then
              echo "Pages is not configured for Actions deployment. Attempting to select workflow source."
              UPDATE_STATUS="$(curl -sS -X PUT -o /tmp/pages-update.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d '{"build_type":"workflow"}' "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
              echo "Pages configuration update status: $UPDATE_STATUS"
              if [ "$UPDATE_STATUS" != 204 ] && [ "$UPDATE_STATUS" != 200 ]; then
                echo "::error::GitHub Pages uses branch publishing, and the Actions token cannot switch it. Open Settings > Pages > Build and deployment > Source: GitHub Actions."
                cat /tmp/pages-update.json
                exit 1
              fi
            fi
          elif [ "$STATUS" = 404 ]; then
            echo "::error::GitHub Pages is not enabled or the Actions token cannot read its configuration. Enable GitHub Pages in repository Settings > Pages."
            exit 1
          else
            echo "::warning::GitHub Pages settings returned HTTP $STATUS; deployment will be attempted."
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stamp reader access time on every newspaper page
        run: |
          python3 scripts/inject-access-clock.py
          node --check site-access-clock.js
          python3 - <<'PY'
          from pathlib import Path
          pages=[p for p in Path('.').glob('*.html') if '</body>' in p.read_text().lower()]
          missing=[p.name for p in pages if 'site-access-clock.js?v=' not in p.read_text()]
          assert not missing, f'Pages without reader timestamp: {missing}'
          print(f'PASS: all {len(pages)} newspaper pages display access clock')
          PY
      - name: Apply shared college soccer crest treatment to every sport page
        run: |
          python3 scripts/inject-team-crests.py
          python3 scripts/inject-team-crests.py --check
          node --check shared-team-crests.js
          test -s shared-team-crests.css
      - name: Upload entire newspaper
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public MBB-style NBA edition, linked desks and revision
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ROOT="$(printf '%s' "$PAGES_URL" | sed 's:/$::')"
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 15 "$ROOT/pages-build-sha.txt?sha=$GITHUB_SHA" -o /tmp/nba-public-sha.txt && \
               curl -fsSL --max-time 15 "$ROOT/nba.html?sha=$GITHUB_SHA" -o /tmp/nba-public.html && \
               curl -fsSL --max-time 15 "$ROOT/nba-newspaper.js?sha=$GITHUB_SHA" -o /tmp/nba-public-renderer.js; then
              if grep -qx "$GITHUB_SHA" /tmp/nba-public-sha.txt && \
                 grep -q 'mbb-newspaper.css' /tmp/nba-public.html && \
                 grep -q 'aria-label="NBA newspaper navigation"' /tmp/nba-public.html && \
                 ! grep -q 'nba-page-turner.js' /tmp/nba-public.html && \
                 grep -q 'data/nba-game-center.json' /tmp/nba-public-renderer.js; then
                echo 'PASS: MBB-style NBA edition matches deployed Git SHA'
                break
              fi
            fi
            if [ "$attempt" -eq 12 ]; then echo 'FAIL: public NBA edition not deployed' >&2; exit 1; fi
            sleep 10
          done
          for file in nba-standings.html nba-conference.html nba-playoffs.html nba-rankings.html nba-players.html nba-matchups.html nba-team-desk.html nba-game-center.html nba-live-game.html; do
            curl -fsSL --max-time 15 "$ROOT/$file?sha=$GITHUB_SHA" -o /tmp/nba-detail.html
            grep -q 'nba-newspaper.css' /tmp/nba-detail.html || { echo "FAIL: $file not rebuilt" >&2; exit 1; }
          done
          echo 'PASS: all NBA news, standings, playoff, Elo, player, franchise and game pages are served'
      - name: Confirm published NBA news and completed-game player statistics
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ROOT="$(printf '%s' "$PAGES_URL" | sed 's:/$::')"
          curl -fsSL --max-time 25 "$ROOT/data/nba-top-stories.json?sha=$GITHUB_SHA" -o /tmp/published-nba-news.json
          python3 scripts/verify-nba-news-artifact.py /tmp/published-nba-news.json
          curl -fsSL --max-time 25 "$ROOT/data/nba-player-leaders.json?sha=$GITHUB_SHA" -o /tmp/nba-public-players.json
          curl -fsSL --max-time 25 "$ROOT/data/nba-game-center.json?sha=$GITHUB_SHA" -o /tmp/nba-public-games.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/nba-public-players.json'))
          g=json.load(open('/tmp/nba-public-games.json'))
          assert p.get('season')=='2026-27'
          assert len(p.get('rows',[]))>=5 and len(p.get('season_totals',[]))>=10
          assert any(x.get('period_scores') and x.get('team_comparison') for x in g.get('games',[]))
          print('PASS: published NBA player leaders, rich box scores, and news verified')
          PY
      - name: Certify all 30 published NBA records and Elo ratings
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            if node scripts/verify-nba-public-sync.mjs "$(printf '%s' "$PAGES_URL" | sed 's:/$::')"; then
              echo 'PASS: public NBA standings and Elo match the verified finals'
              exit 0
            fi
            sleep 10
          done
          echo 'FAIL: live NBA records or Elo differ from current verified finals' >&2
          exit 1
