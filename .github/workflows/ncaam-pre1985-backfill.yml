name: Backfill NCAA 1949–1984 documented game scores
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ncaam-pre1985-backfill.yml'
      - 'scripts/import_ncaam_pre1985_unc_duke.py'
      - 'scripts/test_ncaam_pre1985_import.py'
permissions:
  contents: write
concurrency:
  group: ncaam-pre1985-source
  cancel-in-progress: false
jobs:
  historical-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify historical fixture importer before any source downloads
        run: python scripts/test_ncaam_pre1985_import.py
      - name: Download original historical UNC and Duke data archives
        run: |
          mkdir -p historical-normalized
          curl -fL --retry 3 --connect-timeout 15 'https://raw.githubusercontent.com/joongsup/uncmbb/master/data/unc.rda' -o historical-normalized/unc.rda
          curl -fL --retry 3 --connect-timeout 15 'https://raw.githubusercontent.com/joongsup/uncmbb/master/data/duke.rda' -o historical-normalized/duke.rda
          test -s historical-normalized/unc.rda
          test -s historical-normalized/duke.rda
          sha256sum historical-normalized/unc.rda historical-normalized/duke.rda | tee historical-normalized/source-checksums.txt
      - name: Export historical fixtures from original R data archives
        run: |
          Rscript - <<'RS'
          required <- c('Season','Game_Date','Opponent_School','Tm','Opp')
          rows <- list()
          for (n in c('unc','duke')) {
            e <- new.env(parent=globalenv())
            imported <- load(paste0('historical-normalized/',n,'.rda'),envir=e)
            if (!(n %in% imported) || !exists(n,envir=e,inherits=FALSE)) stop(paste('Missing archive object',n))
            v <- get(n,envir=e,inherits=FALSE)
            if (!is.data.frame(v) || !all(required %in% names(v))) stop(paste('Invalid historical archive schema',n))
            v$Source_Team <- if (n=='unc') 'North Carolina' else 'Duke'
            if (nrow(v)<800) stop(paste('Unexpectedly small historical archive',n,nrow(v)))
            rows[[n]] <- v[,c(required,'Source_Team')]
          }
          cat('Historical source row counts:',vapply(rows,nrow,integer(1)),'\\n')
          write.csv(do.call(rbind,rows),'historical-normalized/unc-duke-historical-fixtures.csv',row.names=FALSE,na='')
          RS
      - name: Test national multi-source ingest
        run: python scripts/test_ncaam_pre1985_national.py
      - name: Normalize and audit national-coverage evidence from documented archives
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          src=Path('historical-normalized/unc-duke-historical-fixtures.csv')
          dst=Path('historical-normalized/unc-duke-for-national-audit.csv')
          with src.open(newline='',encoding='utf-8-sig') as infile,dst.open('w',newline='') as outfile:
              reader=csv.DictReader(infile)
              writer=csv.DictWriter(outfile,fieldnames=['season','date','homeTeam','awayTeam','homePoints','awayPoints'])
              writer.writeheader()
              for row in reader:
                  writer.writerow({'season':row['Season'],'date':row['Game_Date'],
                      'homeTeam':row['Source_Team'],'awayTeam':row['Opponent_School'],
                      'homePoints':row['Tm'],'awayPoints':row['Opp']})
          PY
          python scripts/import_ncaam_pre1985_national.py \
            --input historical-normalized/unc-duke-for-national-audit.csv \
            --output data/ncaam-pre1985-national-coverage.json \
            --fixtures-output historical-normalized/ncaam-pre1985-national-verified.csv
          python - <<'PY'
          import json
          d=json.load(open('data/ncaam-pre1985-national-coverage.json'))
          assert d['games_verified']>=1800,d['games_verified']
          assert d['seasons_targeted']==35
          assert all(not s['eligible_full_national_elo'] for s in d['seasons'])
          PY
      - name: Validate and replay pre-1985 school fixture evidence
        run: |
          python scripts/import_ncaam_pre1985_unc_duke.py --input historical-normalized/unc-duke-historical-fixtures.csv
          python - <<'PY'
          import json
          d=json.load(open('data/ncaam-pre1985-unc-duke-replay.json'))
          assert d['verified_imported_rows']>=500
          assert d['seasons_present']>=30\n          assert d['season_coverage'][0]['season']==1950\n          assert d['season_coverage'][-1]['season']==1984
          assert d['seasons_present']==35
          assert d['verified_imported_rows']>=1800
          assert d['not_a_national_rankings_history']
          assert d['status']=='PARTIAL_1949_1984_SCHOOL_SAMPLE_NOT_FULL_NCAA_ELO'
          PY
      - name: Publish partial historical research with provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ncaam-pre1985-unc-duke-replay.json data/ncaam-pre1985-national-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: document and replay 1949-1984 partial historical game evidence'
            git pull --rebase
            git push
          fi
      - name: Write acquisition result marker
        if: always()
        env:
          PRE1985_JOB_STATUS: ${{ job.status }}
          PRE1985_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p historical-report
          python - <<'PY'
          import json,os
          from pathlib import Path
          result=Path('data/ncaam-pre1985-unc-duke-replay.json')
          d={'workflow_status':os.getenv('PRE1985_JOB_STATUS'),'run_id':os.getenv('PRE1985_RUN_ID'),'replay_published_candidate':result.exists()}
          if result.exists():
            report=json.loads(result.read_text())
            d.update({'verified_imported_rows':report['verified_imported_rows'],'seasons_present':report['seasons_present'],'observed_date_range':report['observed_date_range']})
          Path('historical-report/ncaam-pre1985-run-status.json').write_text(json.dumps(d,indent=2)+'\\n')
          print(json.dumps(d,indent=2))
          PY
      - name: Diagnose failed historical acquisition
        if: failure()
        run: |
          echo 'Pre-1985 acquisition did not pass. Check installation, source object counts and importer test.'
          ls -lah historical-normalized/ data/ncaam-pre1985-unc-duke-replay.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncaa-pre1985-historical-source
          path: |
            historical-normalized/unc-duke-historical-fixtures.csv
            data/ncaam-pre1985-unc-duke-replay.json
            data/ncaam-pre1985-national-coverage.json
            historical-normalized/ncaam-pre1985-national-verified.csv
            historical-report/ncaam-pre1985-run-status.json
          if-no-files-found: warn
