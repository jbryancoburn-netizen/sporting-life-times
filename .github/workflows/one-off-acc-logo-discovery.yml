name: Discover ACC historical 1980s logo sources (one-off)
on:
  push:
    branches:
      - feat/acc-1980s-18-school-logo-audit-20261114
    paths:
      - scripts/discover_acc_1980s_sources.py
      - .github/workflows/one-off-acc-logo-discovery.yml
permissions:
  contents: write
jobs:
  archive-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive parser
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Locate year-dated historical logos for all 18 schools
        run: python scripts/discover_acc_1980s_sources.py
      - name: Commit source review catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/acc-1980s-source-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Catalog dated vintage ACC marks and 1980s mascot candidates'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
