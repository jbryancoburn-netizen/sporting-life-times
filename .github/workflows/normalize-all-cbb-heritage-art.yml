name: Normalize local CBB archival source artwork (one-time branch)
on:
  pull_request:
    paths:
      - 'scripts/normalize-all-cbb-heritage-art.py'
      - '.github/workflows/normalize-all-cbb-heritage-art.yml'
jobs:
  normalize-and-commit:
    if: github.head_ref == 'audit-normalize-all-cbb-heritage-art-20261115' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize archive at SOURCE, preserving original crests
        run: |
          git fetch origin main --depth=1\n          python -m pip install Pillow==11.3.0
          python scripts/normalize-all-cbb-heritage-art.py
      - name: Commit normalized PNGs and optical audit
        run: |
          git add assets/cbb-*/ data/cbb-heritage-optical-audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Normalize all undersized archived CBB source logos"
            git push origin HEAD:${{ github.head_ref }}
          fi
