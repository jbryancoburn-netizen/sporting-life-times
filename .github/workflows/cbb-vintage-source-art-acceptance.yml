name: CBB vintage source art focused acceptance
on:
  pull_request:
    paths:
      - 'tests/cbb-retro-power-logos.test.cjs'
      - '.github/workflows/cbb-vintage-source-art-acceptance.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all 86 audited crests and corrected source files
        run: node --test tests/cbb-retro-power-logos.test.cjs
      - name: Validate authoritative logo JS
        run: node --check mbb-logo-system.js
