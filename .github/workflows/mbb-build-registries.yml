name: MBB centralized logo and arena registries
on:
  push:
    paths:
      - '.github/workflows/mbb-build-registries.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/mbb_build_registries.py
      - name: Publish registries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-logo-registry.json data/mbb-arena-registry.json data/mbb-registry-build-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish MBB shared logo identity and arena registries"
            git pull --rebase origin main
            git push
          fi
