name: Import 1985-present men's basketball archive
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_mbb_history_1985.py'
      - '.github/workflows/mbb-historical-import.yml'
  schedule:
    - cron: '29 7 1 * *'
permissions:
  contents: write
concurrency:
  group: mbb-historical-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import historical regular-season and NCAA tournament scores
        run: python scripts/import_mbb_history_1985.py
      - name: Publish verified coverage and team files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-head-to-head-1985/
          if ! git diff --cached --quiet; then
            git commit -m "Import 1985-onward men's historical matchup results"
            git push
          fi
