name: Publish newspaper to GitHub Pages
on:
  push:
    branches: [main]
    # Publish site presentation changes immediately. Data collectors are covered
    # by the ten-minute schedule and can explicitly dispatch this workflow.
    # Avoid a full Pages deployment for unrelated research, tests, or metadata.
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'assets/**'
      - '.github/workflows/publish-newspaper.yml'
      - 'scripts/inject-team-crests.py'
      - 'scripts/stage_pages_artifact.py'
      - 'data/nba-*.json'
      - 'data/epl-*.json'
      - 'data/mbb-schedules-2026-27/*.json'
      - 'data/mbb-external-top25.json'
      - 'data/cbb-national-news.json'
      - 'scripts/verify_cbb_news.py'
      - 'tests/cbb-front-news.test.cjs'
      # Direct source or verified rating updates should publish immediately.
      # GitHub Actions-origin commits use workflow_dispatch from the Elo job.
      - 'data/mbb-live.json'
      - 'data/mbb-out-of-division-opponent-logos.json'
      - 'data/cbb-season-logo-audit.json'
      - 'data/mbb-exhibition-finals-2026-27.json'
      - 'tests/cbb-courtside.test.cjs'
      - 'tests/victorian-live-court.test.mjs'
      - 'tests/victorian-live-retro.test.mjs'
      - 'tests/victorian-live-logos.test.mjs'
      - 'tests/victorian-live-game-refresh.test.mjs'
      - 'tests/nba-game-calendar.test.cjs'
      - 'data/cbb-radio-sources.json'
      - 'data/ncaam-2026-27-retro-primary.json'
      - 'data/ncaam-2026-27-upcoming-forecasts.json'
      - 'data/ncaaw-2026-27-retro-primary.json'
      - 'data/ncaam-2026-27-national-polls.json'
      - 'data/ncaaw-2026-27-national-polls.json'
      - 'data/d2-men-2026-27.json'
      - 'data/d2-women-2026-27.json'
  workflow_dispatch:
  workflow_run:
    workflows:
      - EPL verified results and independent Elo
      - NBA Elo verified final-game refresh
      - Official NBA game-center refresh
      - NBA full 30-team roster refresh
      - DII basketball — independent men and women editions
      - MBB Exhibition Scores
      - College basketball national news refresh
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  # Serialize this fast publisher with publish-pages.yml; Pages rejects concurrent deployments.
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    # Do not redeploy when an upstream publisher fails or is cancelled.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # Always publish latest verified data, not an outdated queued event SHA.
      - name: Verify homepage is Sports Desks
        run: |
          test -f index.html
          grep -q 'Sports Desks' index.html
          test -f sports.html
      - name: Validate locally cached NBA crests for all thirty teams
        continue-on-error: true
        run: python3 scripts/check-nba-local-logos.py
      - name: Enforce locked NBA single-ring logo contract
        continue-on-error: true
        run: python3 scripts/check-nba-logo-contract.py
      - name: Certify rebuilt NCAA game slate source and layout contracts
        run: node tests/ncaam-slate.test.cjs
      # Safety net: GitHub's best-effort scheduled jobs can miss game windows.
      # Rebuild the two gender-specific result streams INSIDE this Pages artifact
      # without modifying or committing the independent source publisher history.
      - name: Catch up men's completed games and school calendars for this reader edition
        shell: bash
        run: |
          if (
            python3 scripts/collect-mbb-retro-finals.py &&
            node scripts/publish-mbb-retro-primary.js &&
            python3 scripts/collect-mbb-non-di-finals.py &&
            node scripts/build-mbb-overall-records.mjs &&
            python3 scripts/sync_cbb_final_calendars.py --gender men
          ); then
            echo "Men's RETRO and 365 school calendars reconciled in Pages artifact."
          else
            git restore -- data/mbb-retro-live-finals.json data/ncaam-2026-27-retro-primary.json data/mbb-non-di-verified-finals-2026-27.json data/mbb-overall-records-2026-27.json data/mbb-schedules-2026-27/
            echo "::warning::Men's result source unavailable; preserving last repository-certified data."
          fi
      - name: Catch up women's completed games and school calendars for this reader edition
        shell: bash
        run: |
          if (
            python3 scripts/wbb-season.py live &&
            node scripts/publish-wbb-retro.js &&
            python3 scripts/sync_cbb_final_calendars.py --gender women
          ); then
            echo "Women's 363-team RETRO and final-score calendars reconciled in Pages artifact."
          else
            git restore -- data/ncaaw-2026-27-teams.json data/ncaaw-2026-27-verified-games.json data/ncaaw-2026-27-games.json data/ncaaw-2026-27-retro-primary.json data/ncaaw-schedules-2026-27.json data/wbb-final-calendar-reconciliation-audit.json
            echo "::warning::Women's result source unavailable; preserving last repository-certified data."
          fi
      # A rolling schedule collector can replace the central forecast file with
      # probability-only source rows. Rebuild margin and probability together
      # from the exact RETRO ratings snapshot in this deployed artifact.
      - name: Rebuild independent MBB forecasts before publication gate
        run: python3 scripts/rebuild_mbb_unified_forecasts.py
      - name: Certify RETRO forecasts cover live Division I fixtures
        run: node tests/mbb-retro-forecast-coverage.test.cjs
      - name: Protect Courtside sourced scorebugs and independent USRS
        run: node tests/cbb-courtside.test.cjs
      - name: Verify mobile team game cards, midnight final, and verified RETRO values
        run: node tests/mbb-calendar-finals.test.cjs
      - name: Verify radio stays opt-in, unrecorded and broadcaster-approved
        run: node tests/cbb-radio-companion.test.cjs
      - name: Block publication of broken NBA live-score JavaScript
        run: |
          node --check nba-live-feed.js
          node --check nba-newspaper.js
          node --test tests/nba-division-ledger.test.cjs
          node --test tests/nba-game-calendar.test.cjs
      - name: Verify regulation NCAA and NBA live-game court geometry
        run: node tests/victorian-live-court.test.mjs
      - name: Verify source-locked Victorian live RETRO projections
        run: node tests/victorian-live-retro.test.mjs
      - name: Verify Game Center canonical basketball logo contracts
        run: node tests/victorian-live-logos.test.mjs
      - name: Verify live Game Center source fallbacks and score changes
        run: node tests/victorian-live-game-refresh.test.mjs
      - name: Validate all browser JavaScript before deployment
        continue-on-error: true
        run: |
          set -euo pipefail
          for script in *.js; do node --check "$script"; done
          python3 scripts/check_inline_javascript.py
          node --test tests/nba-edition.test.cjs tests/newspaper-structure.test.cjs
          node --test tests/ncaam-rivalry-archive.test.cjs
          node scripts/audit-dual-ring-colors.cjs
          node scripts/audit-mbb-logo-system.cjs
          node tests/mbb-rankings-runtime.test.cjs
          node tests/mbb-poll-logos.test.cjs
      # The dedicated newspaper regression workflow runs full Playwright tests.
      # Keep routine publication fast and independent of browser installation.
      # Safety fallback: scheduled NBA news collection may be delayed by Actions load.
      # Refresh the Pages artifact independently, without touching other sports or
      # committing generated files. Keep the previously attributed feed on failures.
      - name: Refresh NBA headlines inside the deployable Pages artifact
        continue-on-error: true
        run: |
          set -euo pipefail
          if python3 scripts/collect-nba-stories.py && python3 scripts/test-nba-news-editorial.py; then
            python3 - <<'PY'
          from pathlib import Path
          import json,datetime
          data=json.loads(Path('data/nba-top-stories.json').read_text())
          updated=datetime.datetime.fromisoformat(data['updated_at'].replace('Z','+00:00'))
          age=(datetime.datetime.now(datetime.timezone.utc)-updated).total_seconds()
          assert 0 <= age < 1200, 'Collected NBA news is unexpectedly stale'
          assert len(data['articles'])>=3, 'NBA headline feed is incomplete'
          print('Rebuilt NBA headlines within Pages artifact:',len(data['articles']),'as of',updated.isoformat())
          PY
          else
            git restore -- data/nba-top-stories.json
            echo "::warning::NBA source collection failed; retaining last-attributed feed with its original timestamp"
          fi
      - name: Check installed authentic EuroLeague team marks
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/euroleague-logos')
          files=list(p.glob('*.png')) if p.exists() else []
          if files:
            assert len(files)==20,f'Expected 20 genuine EuroLeague logos, got {len(files)}'
            print('Official self-hosted EuroLeague logos:',len(files))
          else: print('One-time official crest caching job has not completed yet')
          PY
      - name: Apply shared college soccer crest treatment to every sport page
        continue-on-error: true
        run: |
          python3 scripts/inject-team-crests.py
          python3 scripts/inject-team-crests.py --check
          node --check shared-team-crests.js
          test -s shared-team-crests.css
      - name: Protect NFL two-ring badges from site-wide logo injection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages=('nfl.html','nfl-standings.html','nfl-rankings.html','nfl-players.html',
                 'nfl-schedule.html','nfl-game-center.html','nfl-team.html',
                 'nfl-game.html','nfl-playoffs.html')
          for name in pages:
              src=Path(name).read_text(encoding='utf-8')
              assert 'shared-team-crests.js' not in src and 'shared-team-crests.css' not in src, name+' has a THIRD logo ring'
              assert 'nfl-badge-v3.css' in src and 'nfl-edition-v3.js' in src, name+' lacks canonical NFL badge'
          print('PASS: 9 NFL pages have no generic injected third ring')
          PY
          node --check nfl-edition-v3.js
      - name: Validate college football JavaScript before publication
        continue-on-error: true
        run: |
          set -euo pipefail
          node --check cfb-newspaper.js
          node --check cfb-directory.js
          node --check cfb-elo.js
          node --check cfb-team.js
          grep -q 'cfb-directory.js' college-football.html
          grep -q 'cfb-newspaper.js' college-football.html
      - name: Refresh EuroLeague live scores in the Pages artifact
        if: ${{ false }} # Dedicated league workflows own data collection; never block Pages publishing.
        continue-on-error: true
        run: |
          python3 scripts/euroleague_live_fast.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/euroleague-live.json').read_text())
          print('Deployed EuroLeague scoreboard:',d.get('checked_at'),d.get('live_scores_refreshed'),'live score checks')
          PY
      - name: Update EuroLeague Elo, standings and projections for completed game windows
        if: ${{ false }} # Dedicated league workflows own data collection; never block Pages publishing.
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import datetime,json,pathlib,subprocess
          root=pathlib.Path('data')
          live=json.loads((root/'euroleague-live.json').read_text())
          model=json.loads((root/'euroleague-model.json').read_text())
          known={str(g['id']) for g in model.get('recent_results',[])}
          now=datetime.datetime.now(datetime.timezone.utc)
          candidates=[]
          for game in live.get('games',[]):
              if str(game.get('id')) in known:continue
              if game.get('status')=='final':
                  candidates.append(str(game['id']))
                  continue
              try:
                  tip=datetime.datetime.fromisoformat(game['date'].replace('Z','+00:00'))
              except (KeyError,ValueError,TypeError):continue
              if game.get('status') in ('live','awaiting_final') and 90<=(now-tip).total_seconds()/60<=480:
                  candidates.append(str(game['id']))
          if candidates:
              print('Rechecking official finals for Elo:',', '.join(candidates),flush=True)
              subprocess.run(['python3','scripts/euroleague_model.py'],check=True)
              subprocess.run(['python3','scripts/euroleague_release_gate.py'],check=True)
              subprocess.run(['python3','scripts/euroleague_live_fast.py'],check=True)
          else:
              print('EuroLeague: no newly finished game windows; keeping verified ratings.',flush=True)
          PY
      - name: Persist validated EuroLeague scores and model back to main
        if: ${{ false }} # Dedicated league workflows own data collection; never block Pages publishing.
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/euroleague_release_gate.py
          if [ -n "$(git status --porcelain -- data/euroleague-live.json data/euroleague-model.json)" ]; then
            git config user.name "sporting-life-times-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/euroleague-live.json data/euroleague-model.json
            git commit -m "Persist verified EuroLeague scoreboard and Elo from Pages publication"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          else
            echo "EuroLeague snapshot already saved in main"
          fi
      # Pages also runs on a five-minute clock. Reconcile finals here when
      # the source publisher's scheduled job is delayed or dropped.
      - name: Catch up NBA finals, RETRO and player stats inside Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          if (
            python3 scripts/collect-nba-schedule.py --fast &&
            node scripts/update-nba-elo.mjs &&
            node scripts/build-nba-elo-shadow.mjs --write &&
            node scripts/reconcile-nba-schedule.mjs &&
            node scripts/audit-nba-elo.mjs
          ); then
            if ! python3 scripts/collect_nba_game_center.py; then echo "::warning::Official NBA box scores unavailable; using ESPN"; fi
            if ! python3 scripts/backfill-nba-espn.py; then echo "::warning::Player box scores pending"; fi
            if ! python3 scripts/enrich-nba-game-details.py; then echo "::warning::Some NBA details pending"; fi
            if (
              python3 scripts/collect-nba-player-leaders.py &&
              node scripts/build-nba-possession-inputs.mjs &&
              node scripts/audit-nba-boxscore-elo.mjs
            ); then
              python3 scripts/audit-nba-stat-coverage.py || echo "::warning::NBA player-stat coverage is incomplete"
            else
              git restore -- data/nba-game-center.json data/nba-player-leaders.json data/nba-possession-inputs.json data/nba-stat-coverage-audit.json
              echo "::warning::NBA stats publication failed; preserving last verified player archive"
            fi
            echo "NBA Pages: verified finals, RETRO, standings and available stats reconciled"
          else
            git restore -- data/nba-2026-27-current-provisional.json data/nba-elo-reconciliation.json data/nba-elo-shadow-2026-27.json data/nba-upcoming-schedule.json
            echo "::warning::NBA final-score source unavailable; retain last audited snapshot"
          fi
      - uses: actions/configure-pages@v5
      - name: Validate women's individual team-page publication inputs
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s ncaaw-team.html
          node --check college-basketball-gender.js
          grep -q "ncaaw-team.html?team=" cbb-shared-navigation.js
          grep -q "wbb-team-newspaper.js" ncaaw-team.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          teams=json.loads(Path('data/ncaaw-2026-27-teams.json').read_text())['teams']
          calendars=json.loads(Path('data/ncaaw-schedules-2026-27.json').read_text())['teams']
          ids={str(t['team_id']) for t in teams}
          assert len(ids)==363 and '84' in ids
          assert ids <= set(calendars), 'Missing one or more women team schedule records'
          print("Women's page inputs: all 363 IDs and Indiana schedule present")
          PY
      - name: Refresh the CBB national wire if the scheduled collector fell behind
        run: |
          if ! python3 scripts/verify_cbb_news.py --max-age 60; then
            if ! python3 scripts/refresh_cbb_national_news.py || ! python3 scripts/verify_cbb_news.py; then
              git restore -- data/cbb-national-news.json
              echo "::warning::CBB news source unavailable; preserving the last attributed edition"
            fi
          fi
          node tests/cbb-front-news.test.cjs
      # The long MBB newsroom collector is scheduled only every 15 minutes,
      # and GitHub can delay cron jobs. Refresh current scores in the deployed
      # Pages edition independently so an old pregame or halftime score is not
      # republished simply because a static-data deployment succeeded.
      - name: Refresh men's live scores immediately before Pages artifact
        run: |
          python3 -m unittest discover -s tests -p test_mbb_fast_scores.py -v
          if python3 scripts/refresh_mbb_live_scores.py; then
            echo "PASS: latest national scoreboard incorporated in this Pages artifact."
          else
            echo "::warning::Live ESPN scoreboard unavailable; this edition contains last-known scores."
          fi
      - name: Stage reader-facing newspaper without unused development and research payloads
        run: python3 scripts/stage_pages_artifact.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _pages_site
          # Re-running a workflow must not leave two artifacts named github-pages.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 1200000
      - name: Verify Victorian Game Center is publicly deployed
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os,time,urllib.request
          from pathlib import Path
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          files=['live-game.html','slt-victorian-live.js','slt-victorian-live.css']
          expected={p:(Path('_pages_site')/p).read_bytes() for p in files}
          failure=''
          for attempt in range(1,9):
              stale=[]
              for filename in files:
                  url=base+filename+'?edition='+os.environ.get('GITHUB_SHA','')+'-'+str(attempt)
                  try:
                      req=urllib.request.Request(url,headers={
                          'User-Agent':'SLT-GameCenter-Public-Verification/1.0',
                          'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=20) as response:
                          public=response.read()
                          if response.status!=200 or public!=expected[filename]:
                              stale.append(filename+': HTTP '+str(response.status)+
                                  ', different content ('+str(len(public))+' bytes)')
                  except Exception as e:
                      stale.append(filename+': '+type(e).__name__+': '+str(e))
              if not stale:
                  print('PASS: public Pages matches all three staged Victorian Game Center assets')
                  break
              failure='; '.join(stale)
              print('Victorian Game Center publication check',attempt,'/8:',failure)
              if attempt<8:time.sleep(10)
          else:
              raise SystemExit('FAIL: Victorian Game Center public assets not deployed: '+failure)
          PY
      - name: Verify live MBB scores actually reached the public newspaper
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json,os,time,urllib.request
          from pathlib import Path
          from zoneinfo import ZoneInfo
          eastern=ZoneInfo('America/New_York')
          day=dt.datetime.now(eastern).date()
          def current(g):
              try:
                  return dt.datetime.fromisoformat(g['date'].replace('Z','+00:00')).astimezone(eastern).date()==day
              except (ValueError,KeyError,TypeError):
                  return False
          def record(g):
              return (str(g.get('state')),tuple((str(t.get('id')),str(t.get('score'))) for t in g.get('teams',[])))
          local=json.loads(Path('data/mbb-live.json').read_text())
          today_games={str(g['id']):record(g) for g in local.get('games',[])
                       if current(g) and g.get('state') in ('pre','in','post')}
          active_finals={eid:row for eid,row in today_games.items()
                         if row[0] in ('in','post')}
          # In the morning there may be no live/final games yet. Verify the
          # scheduled slate instead of declaring a healthy deployment failed.
          # If today is an off-day, check the complete published snapshot.
          required=active_finals or today_games
          all_dates=not bool(required)
          if all_dates:
              required={str(g['id']):record(g) for g in local.get('games',[])
                        if g.get('state') in ('pre','in','post')}
          if not required:
              raise SystemExit('MBB source snapshot has no games to verify')
          source_stamp=dt.datetime.fromisoformat(
              local['scores_updated_at'].replace('Z','+00:00')).astimezone(dt.timezone.utc)
          print('Verifying',len(required),'MBB', 'live/final' if active_finals else
                'scheduled/off-day', 'records against public Pages')
          url=os.environ['PAGE_URL'].rstrip('/')+'/data/mbb-live.json'
          error='not yet attempted'
          for attempt in range(10):
              try:
                  req=urllib.request.Request(url+'?verify_mbb='+str(time.time_ns()),
                                            headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      public=json.load(response)
                  actual={str(g['id']):record(g) for g in public.get('games',[])
                          if all_dates or current(g)}
                  stale=[]
                  public_stamp=dt.datetime.fromisoformat(
                      public['scores_updated_at'].replace('Z','+00:00')).astimezone(dt.timezone.utc)
                  if public_stamp<source_stamp:
                      stale.append('scores_updated_at')
                  for eid,(phase,teams) in required.items():
                      new=actual.get(eid)
                      if not new or len(new[1])!=len(teams) or tuple(x[0] for x in new[1])!=tuple(x[0] for x in teams):
                          stale.append(eid);continue
                      if (phase=='post' and (new[0]!='post' or new[1]!=teams)) or (
                          phase=='in' and new[0]=='pre'):
                          stale.append(eid);continue
                      if phase=='in' and new[0]=='in' and any(int(a[1])<int(b[1]) for a,b in zip(new[1],teams)):
                          stale.append(eid)
                  if not stale:
                      print('PASS: public Pages has matching or newer MBB game data for',len(required),'verified records')
                      break
                  error='Public scores stale for event IDs: '+','.join(stale[:20])
              except Exception as exc:
                  error=repr(exc)
              print('MBB public verification attempt',attempt+1,':',error)
              if attempt<9:time.sleep(7)
          else:
              raise SystemExit('Public MBB score publication failed: '+error)
          PY
      - name: Verify public NFL finals, player statistics and current browser scripts
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          from pathlib import Path
          site = os.environ["PAGE_URL"].rstrip("/") + "/"
          wanted = json.loads(Path("data/nfl-2026-edition.json").read_text())
          boxes = json.loads(Path("data/nfl-2026-boxscores.json").read_text())
          pages = ("nfl-standings.html", "nfl-team.html", "nfl-players.html", "nfl-game.html")
          def fetch(path, n):
              req = urllib.request.Request(
                  site + path + "?nfl_verify=" + os.environ.get("GITHUB_RUN_ID", "") + "-" + str(n),
                  headers={"Cache-Control": "no-cache", "Pragma": "no-cache"})
              with urllib.request.urlopen(req, timeout=25) as response:
                  return response.read()
          error = "not attempted"
          for n in range(8):
              try:
                  actual = json.loads(fetch("data/nfl-2026-edition.json", n))
                  assert actual.get("season") == 2026 and len(actual.get("games", [])) == 272
                  assert len(actual.get("teams", [])) == 32
                  assert actual["coverage"]["finals"] >= wanted["coverage"]["finals"], "NFL final records stale"
                  assert actual["coverage"]["boxscores"] >= wanted["coverage"]["boxscores"], "NFL player stats stale"
                  expected_finals = {g["id"]:g for g in wanted["games"] if g["state"] == "post"}
                  deployed_finals = {g["id"]:g for g in actual["games"] if g["state"] == "post"}
                  for eid, g in expected_finals.items():
                      live = deployed_finals.get(eid)
                      assert live, "Missing NFL final " + eid
                      assert all(live[side]["score"] == g[side]["score"] for side in ("away","home")), "NFL score stale " + eid
                  if actual["coverage"]["finals"] == wanted["coverage"]["finals"]:
                      assert actual["teams"] == wanted["teams"], "NFL standings or team stats differ"
                      assert actual["leaders"] == wanted["leaders"], "NFL player leaders differ"
                  published_boxes = json.loads(fetch("data/nfl-2026-boxscores.json", n))
                  assert set(boxes["games"]).issubset(published_boxes["games"]), "Missing NFL box scores"
                  for page in pages:
                      html = fetch(page, n).decode("utf-8")
                      local = Path(page).read_text()
                      version = re.search('src="nfl-edition-v3.js[?]v=([^"]+)"', local)
                      assert version and version.group(0) in html, "Old NFL script on " + page
                  script = fetch("nfl-edition-v3.js", n).decode("utf-8")
                  assert "async function refreshSeason()" in script, "Outdated NFL statistics renderer"
                  print("PASS PUBLIC NFL:",actual["coverage"]["finals"],"finals;",
                        actual["coverage"]["boxscores"],"boxes; all four pages and records verified.")
                  break
              except Exception as exc:
                  error = str(exc)
                  print("NFL public verification attempt",n+1,"failed:",error)
                  if n < 7: time.sleep(7)
          else:
              raise SystemExit("Public NFL data does not match repository: " + error)
          PY
