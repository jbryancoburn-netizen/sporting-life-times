name: Publish newspaper to GitHub Pages
on:
  push:
    branches: [main]
    # Publish site presentation changes immediately. Data collectors are covered
    # by the ten-minute schedule and can explicitly dispatch this workflow.
    # Avoid a full Pages deployment for unrelated research, tests, or metadata.
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'assets/**'
      - '.github/workflows/publish-newspaper.yml'
  workflow_dispatch:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  # Serialize this fast publisher with publish-pages.yml; Pages rejects concurrent deployments.
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify homepage is Sports Desks
        run: |
          test -f index.html
          grep -q 'Sports Desks' index.html
          test -f sports.html
      - name: Validate locally cached NBA crests for all thirty teams
        run: python3 scripts/check-nba-local-logos.py
      - name: Enforce locked NBA single-ring logo contract
        run: python3 scripts/check-nba-logo-contract.py
      - name: Validate all browser JavaScript before deployment
        run: |
          set -euo pipefail
          for script in *.js; do node --check "$script"; done
          python3 scripts/check_inline_javascript.py
          node --test tests/nba-edition.test.cjs tests/newspaper-structure.test.cjs
          node --test tests/ncaam-rivalry-archive.test.cjs
      # The dedicated newspaper regression workflow runs full Playwright tests.
      # Keep routine publication fast and independent of browser installation.
      - name: Refresh NBA headlines inside the deployable Pages artifact
        run: |
          set -euo pipefail
          if python3 scripts/collect-nba-stories.py && python3 scripts/test-nba-news-editorial.py; then
            python3 - <<'PY'
          from pathlib import Path
          import json,datetime
          data=json.loads(Path('data/nba-top-stories.json').read_text())
          updated=datetime.datetime.fromisoformat(data['updated_at'].replace('Z','+00:00'))
          age=(datetime.datetime.now(datetime.timezone.utc)-updated).total_seconds()
          assert 0 <= age < 1200, 'Collected NBA news is unexpectedly stale'
          assert len(data['articles'])>=3, 'NBA headline feed is incomplete'
          print('Rebuilt NBA headlines within Pages artifact:',len(data['articles']),'as of',updated.isoformat())
          PY
          else
            echo "::warning::NBA source collection failed; retaining last-attributed feed with its original timestamp"
          fi
      - name: Check installed authentic EuroLeague team marks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/euroleague-logos')
          files=list(p.glob('*.png')) if p.exists() else []
          if files:
            assert len(files)==20,f'Expected 20 genuine EuroLeague logos, got {len(files)}'
            print('Official self-hosted EuroLeague logos:',len(files))
          else: print('One-time official crest caching job has not completed yet')
          PY
      - name: Apply shared college soccer crest treatment to every sport page
        run: |
          python3 scripts/inject-team-crests.py
          python3 scripts/inject-team-crests.py --check
          node --check shared-team-crests.js
          test -s shared-team-crests.css
      - name: Validate college football JavaScript before publication
        run: |
          set -euo pipefail
          node --check cfb-newspaper.js
          node --check cfb-directory.js
          node --check cfb-elo.js
          node --check cfb-team.js
          grep -q 'cfb-directory.js' college-football.html
          grep -q 'cfb-newspaper.js' college-football.html
      - name: Refresh EuroLeague live scores in the Pages artifact
        continue-on-error: true
        run: |
          python3 scripts/euroleague_live_fast.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/euroleague-live.json').read_text())
          print('Deployed EuroLeague scoreboard:',d.get('checked_at'),d.get('live_scores_refreshed'),'live score checks')
          PY
      - name: Update EuroLeague Elo, standings and projections for completed game windows
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import datetime,json,pathlib,subprocess
          root=pathlib.Path('data')
          live=json.loads((root/'euroleague-live.json').read_text())
          model=json.loads((root/'euroleague-model.json').read_text())
          known={str(g['id']) for g in model.get('recent_results',[])}
          now=datetime.datetime.now(datetime.timezone.utc)
          candidates=[]
          for game in live.get('games',[]):
              if str(game.get('id')) in known:continue
              if game.get('status')=='final':
                  candidates.append(str(game['id']))
                  continue
              try:
                  tip=datetime.datetime.fromisoformat(game['date'].replace('Z','+00:00'))
              except (KeyError,ValueError,TypeError):continue
              if game.get('status') in ('live','awaiting_final') and 90<=(now-tip).total_seconds()/60<=480:
                  candidates.append(str(game['id']))
          if candidates:
              print('Rechecking official finals for Elo:',', '.join(candidates),flush=True)
              subprocess.run(['python3','scripts/euroleague_model.py'],check=True)
              subprocess.run(['python3','scripts/euroleague_release_gate.py'],check=True)
              subprocess.run(['python3','scripts/euroleague_live_fast.py'],check=True)
          else:
              print('EuroLeague: no newly finished game windows; keeping verified ratings.',flush=True)
          PY
      - name: Persist validated EuroLeague scores and model back to main
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/euroleague_release_gate.py
          if [ -n "$(git status --porcelain -- data/euroleague-live.json data/euroleague-model.json)" ]; then
            git config user.name "sporting-life-times-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/euroleague-live.json data/euroleague-model.json
            git commit -m "Persist verified EuroLeague scoreboard and Elo from Pages publication"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          else
            echo "EuroLeague snapshot already saved in main"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify college football newspaper on public Pages
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${PAGE_URL%/}"
          for file in college-football.html cfb-newspaper.js cfb-directory.js cfb-elo.js cfb-team.html cfb-team.js cfb-newspaper.css; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --max-time 30 "$ROOT/$file?release=${GITHUB_SHA}" -o "/tmp/cfb-${file//\//_}"
            test -s "/tmp/cfb-${file//\//_}"
            echo "PASS public CFB asset: $file"
          done
          grep -q 'The College Football Edition' /tmp/cfb-college-football.html
          grep -q 'cfb-directory.js' /tmp/cfb-college-football.html
          grep -q 'cfb-team.html' /tmp/cfb-cfb-directory.js
          grep -q 'Season Record' /tmp/cfb-cfb-team.html
          echo "PASS: public college football newspaper and linked assets are deployed"
      - name: Verify refreshed NBA headlines actually reached public Pages
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${PAGE_URL%/}"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 20 "$ROOT/data/nba-top-stories.json?news_release=${GITHUB_RUN_ID}-${attempt}" -o /tmp/nba-stories-public.json; then
              if python3 - <<'PY'
          import json,datetime
          from pathlib import Path
          local=json.loads(Path('data/nba-top-stories.json').read_text())
          public=json.loads(Path('/tmp/nba-stories-public.json').read_text())
          assert public['updated_at']==local['updated_at'], 'Public NBA headlines differ from the just-deployed artifact'
          assert len(public.get('articles',[]))>=3, 'Public NBA headlines are missing'
          dt=datetime.datetime.fromisoformat(public['updated_at'].replace('Z','+00:00'))
          age=(datetime.datetime.now(datetime.timezone.utc)-dt).total_seconds()
          assert -300 <= age < 2700, f'Public NBA headline feed is stale: {age/60:.0f} min'
          print('PASS: public NBA headlines match deployment; freshness',round(age/60),'minutes')
          PY
              then
                exit 0
              fi
            fi
            echo "::notice::NBA public feed not updated yet (attempt $attempt/8)"
            sleep 8
          done
          echo "::error::NBA public feed is stale or differs from the published artifact"
          exit 1

