name: Publish newspaper to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: newspaper-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify homepage is Sports Desks
        run: |
          test -f index.html
          grep -q 'Sports Desks' index.html
          test -f sports.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deploy
        uses: actions/deploy-pages@v4
