name: Publish newspaper to GitHub Pages
on:
  push:
    branches: [main]
    # Publish site presentation changes immediately. Data collectors are covered
    # by the ten-minute schedule and can explicitly dispatch this workflow.
    # Avoid a full Pages deployment for unrelated research, tests, or metadata.
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'assets/**'
      - '.github/workflows/publish-newspaper.yml'
      - 'scripts/inject-team-crests.py'
      - 'data/nba-*.json'
      - 'data/mbb-schedules-2026-27/*.json'
  workflow_dispatch:
  workflow_run:
    workflows:
      - NBA Elo verified final-game refresh
      - Official NBA game-center refresh
      - NBA full 30-team roster refresh
    types: [completed]
    branches: [main]
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  # Serialize this fast publisher with publish-pages.yml; Pages rejects concurrent deployments.
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify homepage is Sports Desks
        run: |
          test -f index.html
          grep -q 'Sports Desks' index.html
          test -f sports.html
      - name: Validate locally cached NBA crests for all thirty teams
        run: python3 scripts/check-nba-local-logos.py
      - name: Enforce locked NBA single-ring logo contract
        run: python3 scripts/check-nba-logo-contract.py
      - name: Validate all browser JavaScript before deployment
        run: |
          set -euo pipefail
          for script in *.js; do node --check "$script"; done
          python3 scripts/check_inline_javascript.py
          node --test tests/nba-edition.test.cjs tests/newspaper-structure.test.cjs
          node --test tests/ncaam-rivalry-archive.test.cjs
          node scripts/audit-dual-ring-colors.cjs
          node scripts/audit-mbb-logo-system.cjs
          node tests/mbb-rankings-runtime.test.cjs
          node tests/mbb-poll-logos.test.cjs
      # The dedicated newspaper regression workflow runs full Playwright tests.
      # Keep routine publication fast and independent of browser installation.
      - name: Refresh NBA headlines inside the deployable Pages artifact
        run: |
          set -euo pipefail
          if python3 scripts/collect-nba-stories.py && python3 scripts/test-nba-news-editorial.py; then
            python3 - <<'PY'
          from pathlib import Path
          import json,datetime
          data=json.loads(Path('data/nba-top-stories.json').read_text())
          updated=datetime.datetime.fromisoformat(data['updated_at'].replace('Z','+00:00'))
          age=(datetime.datetime.now(datetime.timezone.utc)-updated).total_seconds()
          assert 0 <= age < 1200, 'Collected NBA news is unexpectedly stale'
          assert len(data['articles'])>=3, 'NBA headline feed is incomplete'
          print('Rebuilt NBA headlines within Pages artifact:',len(data['articles']),'as of',updated.isoformat())
          PY
          else
            echo "::warning::NBA source collection failed; retaining last-attributed feed with its original timestamp"
          fi
      - name: Check installed authentic EuroLeague team marks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/euroleague-logos')
          files=list(p.glob('*.png')) if p.exists() else []
          if files:
            assert len(files)==20,f'Expected 20 genuine EuroLeague logos, got {len(files)}'
            print('Official self-hosted EuroLeague logos:',len(files))
          else: print('One-time official crest caching job has not completed yet')
          PY
      - name: Apply shared college soccer crest treatment to every sport page
        run: |
          python3 scripts/inject-team-crests.py
          python3 scripts/inject-team-crests.py --check
          node --check shared-team-crests.js
          test -s shared-team-crests.css
      - name: Validate college football JavaScript before publication
        run: |
          set -euo pipefail
          node --check cfb-newspaper.js
          node --check cfb-directory.js
          node --check cfb-elo.js
          node --check cfb-team.js
          grep -q 'cfb-directory.js' college-football.html
          grep -q 'cfb-newspaper.js' college-football.html
      - name: Refresh EuroLeague live scores in the Pages artifact
        continue-on-error: true
        run: |
          python3 scripts/euroleague_live_fast.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/euroleague-live.json').read_text())
          print('Deployed EuroLeague scoreboard:',d.get('checked_at'),d.get('live_scores_refreshed'),'live score checks')
          PY
      - name: Update EuroLeague Elo, standings and projections for completed game windows
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import datetime,json,pathlib,subprocess
          root=pathlib.Path('data')
          live=json.loads((root/'euroleague-live.json').read_text())
          model=json.loads((root/'euroleague-model.json').read_text())
          known={str(g['id']) for g in model.get('recent_results',[])}
          now=datetime.datetime.now(datetime.timezone.utc)
          candidates=[]
          for game in live.get('games',[]):
              if str(game.get('id')) in known:continue
              if game.get('status')=='final':
                  candidates.append(str(game['id']))
                  continue
              try:
                  tip=datetime.datetime.fromisoformat(game['date'].replace('Z','+00:00'))
              except (KeyError,ValueError,TypeError):continue
              if game.get('status') in ('live','awaiting_final') and 90<=(now-tip).total_seconds()/60<=480:
                  candidates.append(str(game['id']))
          if candidates:
              print('Rechecking official finals for Elo:',', '.join(candidates),flush=True)
              subprocess.run(['python3','scripts/euroleague_model.py'],check=True)
              subprocess.run(['python3','scripts/euroleague_release_gate.py'],check=True)
              subprocess.run(['python3','scripts/euroleague_live_fast.py'],check=True)
          else:
              print('EuroLeague: no newly finished game windows; keeping verified ratings.',flush=True)
          PY
      - name: Persist validated EuroLeague scores and model back to main
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/euroleague_release_gate.py
          if [ -n "$(git status --porcelain -- data/euroleague-live.json data/euroleague-model.json)" ]; then
            git config user.name "sporting-life-times-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/euroleague-live.json data/euroleague-model.json
            git commit -m "Persist verified EuroLeague scoreboard and Elo from Pages publication"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          else
            echo "EuroLeague snapshot already saved in main"
          fi
      - name: Reconcile NBA finals and rebuild 1500-start power rankings inside the published edition
        run: |
          set -euo pipefail
          if node scripts/update-nba-elo.mjs; then
            node scripts/build-nba-elo-shadow.mjs --write
            node scripts/build-nba-elo-shadow.mjs
            node scripts/audit-nba-elo.mjs
            node scripts/audit-nba-boxscore-elo.mjs
            echo "NBA published Elo model: 30 teams, season starts at 1500"
          else
            echo "::warning::NBA scoreboard unavailable; publishing only the previously verified 1500-start Elo snapshot"
            git restore -- data/nba-2026-27-current-provisional.json data/nba-elo-reconciliation.json
            node scripts/build-nba-elo-shadow.mjs
          fi
      - uses: actions/configure-pages@v5
      - name: Validate women's individual team-page publication inputs
        run: |
          set -euo pipefail
          test -s ncaaw-team.html
          node --check college-basketball-gender.js
          grep -q "ncaaw-team.html?team=" college-basketball-gender.js
          grep -q "data/ncaaw-schedules-2026-27.json" ncaaw-team.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          teams=json.loads(Path('data/ncaaw-2026-27-teams.json').read_text())['teams']
          calendars=json.loads(Path('data/ncaaw-schedules-2026-27.json').read_text())['teams']
          ids={str(t['team_id']) for t in teams}
          assert len(ids)==363 and '84' in ids
          assert ids <= set(calendars), 'Missing one or more women team schedule records'
          print('Women's page inputs: all 363 IDs and Indiana schedule present')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify women's team pages and links on actual public Pages
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${PAGE_URL%/}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 25 "$ROOT/ncaaw-team.html?team=84&release=${GITHUB_SHA}-$attempt" -o /tmp/public-ncaaw-team.html \
              && curl -fsSL --max-time 25 "$ROOT/college-basketball-gender.js?release=${GITHUB_SHA}-$attempt" -o /tmp/public-wbb-gender.js \
              && curl -fsSL --max-time 25 "$ROOT/ncaam.html?gender=women&release=${GITHUB_SHA}-$attempt" -o /tmp/public-wbb-front.html \
              && grep -q 'data/ncaaw-schedules-2026-27.json' /tmp/public-ncaaw-team.html \
              && grep -q "ncaaw-team.html?team=" /tmp/public-wbb-gender.js \
              && grep -q 'college-basketball-gender.js' /tmp/public-wbb-front.html; then
              echo "PASS: public Indiana women's team page, team links, and front page"
              exit 0
            fi
            sleep 12
          done
          echo "::error::Women's basketball team pages or links absent from public Pages"
          exit 1
      - name: Verify college football newspaper on public Pages
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${PAGE_URL%/}"
          for file in college-football.html cfb-newspaper.js cfb-directory.js cfb-elo.js cfb-team.html cfb-team.js cfb-team.css cfb-newspaper.css; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --max-time 30 "$ROOT/$file?release=${GITHUB_SHA}" -o "/tmp/cfb-${file//\//_}"
            test -s "/tmp/cfb-${file//\//_}"
            echo "PASS public CFB asset: $file"
          done
          grep -q 'The College Football Edition' /tmp/cfb-college-football.html
          grep -q 'cfb-directory.js' /tmp/cfb-college-football.html
          grep -q 'cfb-team.html' /tmp/cfb-cfb-directory.js
          grep -q '2026 Searchable Roster' /tmp/cfb-cfb-team.html
          grep -q 'Schedule &amp; Results' /tmp/cfb-cfb-team.html
          grep -q 'cfb-team.css' /tmp/cfb-cfb-team.html
          grep -q 'team-masthead' /tmp/cfb-cfb-team.css
          echo "PASS: public college football newspaper and linked assets are deployed"
      - name: Verify refreshed NBA headlines actually reached public Pages
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${PAGE_URL%/}"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 20 "$ROOT/data/nba-top-stories.json?news_release=${GITHUB_RUN_ID}-${attempt}" -o /tmp/nba-stories-public.json; then
              if python3 - <<'PY'
          import json,datetime
          from pathlib import Path
          local=json.loads(Path('data/nba-top-stories.json').read_text())
          public=json.loads(Path('/tmp/nba-stories-public.json').read_text())
          assert public['updated_at']==local['updated_at'], 'Public NBA headlines differ from the just-deployed artifact'
          assert len(public.get('articles',[]))>=3, 'Public NBA headlines are missing'
          dt=datetime.datetime.fromisoformat(public['updated_at'].replace('Z','+00:00'))
          age=(datetime.datetime.now(datetime.timezone.utc)-dt).total_seconds()
          assert -300 <= age < 2700, f'Public NBA headline feed is stale: {age/60:.0f} min'
          print('PASS: public NBA headlines match deployment; freshness',round(age/60),'minutes')
          PY
              then
                exit 0
              fi
            fi
            echo "::notice::NBA public feed not updated yet (attempt $attempt/8)"
            sleep 8
          done
          echo "::error::NBA public feed is stale or differs from the published artifact"
          exit 1

      - name: Verify published NBA 30-team rosters and sole 1500-start Elo
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${PAGE_URL%/}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 25 "$ROOT/data/nba-team-rosters-2026-27.json?roster_release=${GITHUB_RUN_ID}-${attempt}" -o /tmp/public-nba-rosters.json &&
               curl -fsSL --max-time 25 "$ROOT/data/nba-elo-shadow-2026-27.json?elo_release=${GITHUB_RUN_ID}-${attempt}" -o /tmp/public-nba-elo.json &&
               curl -fsSL --max-time 25 "$ROOT/nba-team-desk.html?roster_release=${GITHUB_RUN_ID}-${attempt}" -o /tmp/public-nba-team.html &&
               curl -fsSL --max-time 25 "$ROOT/nba-team-roster.js?roster_release=${GITHUB_RUN_ID}-${attempt}" -o /tmp/public-nba-roster.js; then
              if python3 - <<'PY'
          import json
          from pathlib import Path
          local_roster=json.loads(Path('data/nba-team-rosters-2026-27.json').read_text())
          public_roster=json.loads(Path('/tmp/public-nba-rosters.json').read_text())
          local_elo=json.loads(Path('data/nba-elo-shadow-2026-27.json').read_text())
          public_elo=json.loads(Path('/tmp/public-nba-elo.json').read_text())
          assert len(public_roster['teams'])==30, 'Not all NBA teams have published rosters'
          assert public_roster['updated_at']==local_roster['updated_at'], 'Public NBA rosters lag deployment'
          for code,team in public_roster['teams'].items():
              assert 10<=len(team['players'])<=35, f'{code} incomplete roster'
          assert public_elo['games_played']==local_elo['games_played'], 'Public NBA Elo game count is stale'
          assert public_elo['rankings']==local_elo['rankings'], 'Public NBA Elo rankings differ from deployment'
          assert public_elo['parameters']['season_start_elo']==1500, 'NBA published model must reset to 1500'
          assert len(public_elo['rankings'])==30
          assert 'nba-team-roster.js' in Path('/tmp/public-nba-team.html').read_text(), 'Team pages lack sourced roster renderer'
          assert 'Current Team Roster' in Path('/tmp/public-nba-roster.js').read_text(), 'Roster UI not present'
          print('PASS public NBA: 30 current rosters and same 1500-reset power rankings as deployed artifact')
          PY
              then exit 0; fi
            fi
            sleep 7
          done
          echo "::error::Public NBA rosters or 1500-start Elo do not match newly published edition"
          exit 1

      - name: Verify published 365-school MBB RETRO rankings and team rosters
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${PAGE_URL%/}"
          for retry in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 "$ROOT/data/ncaam-2026-27-retro-primary.json?rev=${GITHUB_RUN_ID}-$retry" -o /tmp/public-mbb-retro.json &&
               curl -fsSL --max-time 20 "$ROOT/ncaam-elo.html?rev=${GITHUB_RUN_ID}-$retry" -o /tmp/public-mbb-rankings.html &&
               curl -fsSL --max-time 20 "$ROOT/ncaam-team.html?rev=${GITHUB_RUN_ID}-$retry" -o /tmp/public-mbb-team.html &&
               curl -fsSL --max-time 20 "$ROOT/mbb-current-roster.js?rev=${GITHUB_RUN_ID}-$retry" -o /tmp/public-mbb-roster.js &&
               curl -fsSL --max-time 20 "$ROOT/data/mbb-rosters-2026-27/84.json?rev=${GITHUB_RUN_ID}-$retry" -o /tmp/public-mbb-indiana-roster.json; then
              if python3 - <<'PY'
          import json
          from pathlib import Path
          local=json.loads(Path('data/ncaam-2026-27-retro-primary.json').read_text())
          public=json.loads(Path('/tmp/public-mbb-retro.json').read_text())
          assert len(public['rankings'])==365, 'MBB missing Division I ratings'
          assert public['starting_elo']==1500 and all(x['base_elo']==1500 for x in public['rankings'])
          assert public['games_played']==len(public['events'])
          assert public['rankings']==local['rankings'], 'Public MBB RETRO does not match deployable data'
          assert 'mbb-elo-primary.js' in Path('/tmp/public-mbb-rankings.html').read_text(), 'Legacy MBB Elo page served'
          assert 'mbb-current-roster.js' in Path('/tmp/public-mbb-team.html').read_text(), 'Current team roster not linked'
          assert 'data/mbb-rosters-2026-27/' in Path('/tmp/public-mbb-roster.js').read_text(), 'Team roster data lookup absent'
          roster=json.loads(Path('/tmp/public-mbb-indiana-roster.json').read_text())
          assert roster['team_id']=='ncaa:609574' and len(roster['players'])>=10
          print('PASS: public Pages serves 365 clean-slate RETRO ratings and searchable current rosters')
          PY
              then exit 0; fi
            fi
            sleep 6
          done
          echo "::error::The public MBB rankings or roster pages do not match this Pages deployment" >&2
          exit 1

      - name: Verify published shared college basketball logo system
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${PAGE_URL%/}"
          for i in 1 2 3 4 5; do
            ok=1
            for file in mbb-logo-system.js mbb-logo-system.css ncaam-elo.html ncaam-team.html ncaam-conference.html ncaam-predictor.html ncaam-rivalry.html; do
              curl -fsSL --max-time 20 "$ROOT/$file?crest_release=${GITHUB_RUN_ID}-$i" -o "/tmp/cbb-crest-${file//\//_}" || ok=0
            done
            if [[ "$ok" == 1 ]]; then
              if python3 - <<'PY'
          from pathlib import Path
          read=lambda p: Path('/tmp/cbb-crest-'+p).read_text()
          logo=read('mbb-logo-system.js')
          css=read('mbb-logo-system.css')
          assert 'data/mbb-logo-registry.json' in logo
          assert 'window.MBBLogos.fail(this)' in logo
          assert 'object-fit:contain!important' in css
          assert 'border-radius:50%!important' in css
          assert '.mbb-mark--art-embedded_roundel' in css and '.mbb-mark--art-flat' in css, 'Artwork-aware MBB renderer not published'
          for page in ('ncaam-elo.html','ncaam-team.html','ncaam-conference.html','ncaam-predictor.html','ncaam-rivalry.html'):
              html=read(page)
              assert 'mbb-logo-system.css' in html, page
              assert 'slt-dual-ring.js' not in html and 'slt-dual-ring.css' not in html, f'{page}: redundant dual-ring system still published'
              assert 'shared-team-crests.js' not in html and 'shared-team-crests.css' not in html, f'{page}: global crest wrapper still published'
              loc=html.index('mbb-logo-system.js')
              assert loc>=0
              for consumer in ('mbb-elo-primary.js','mbb-newspaper.js','mbb-team-calendar-boot.js','ncaam-predictor.js','ncaam-rivalry.js'):
                  n=html.find(consumer)
                  assert n<0 or loc<n, f'{page}: logo renderer not loaded before {consumer}'
          print('PASS public Pages: shared 365-team logo renderer, circular layout, proper script order across five key editions')
          PY
              then exit 0; fi
            fi
            sleep 6
          done
          echo "::error::Public college basketball shared logo system missing or out-of-order" >&2
          exit 1
