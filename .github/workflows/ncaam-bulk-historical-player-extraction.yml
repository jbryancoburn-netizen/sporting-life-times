name: NCAA historical player-level extraction
on:
  push:
    paths:
      - 'scripts/extract_ncaam_bulk_historical_player_rosters.py'
      - 'scripts/test_ncaam_bulk_historical_roster_extraction.py'
      - '.github/workflows/ncaam-bulk-historical-player-extraction.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncaam-historical-player-extraction
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        batch: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_ncaam_bulk_historical_roster_extraction.py -v
      - run: python scripts/extract_ncaam_bulk_historical_player_rosters.py --batch ${{ matrix.batch }} --workers 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-player-names-${{ matrix.batch }}
          path: data/ncaam-historical-roster-extraction/batch-*.json
      - name: Commit extracted school roster names
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaam-historical-roster-extraction/batch-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish NCAA player-level historical roster extraction batch ${{ matrix.batch }} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
