name: EuroLeague offline tests
on:
  push:
    paths:
      - 'scripts/euroleague_model.py'
      - 'scripts/euroleague_backtest.py'
      - 'scripts/test_euroleague_model.py'
      - '.github/workflows/euroleague-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python model and evaluation scripts
        run: python -m compileall -q scripts/euroleague_model.py scripts/euroleague_backtest.py scripts/test_euroleague_model.py
      - name: Execute deterministic EuroLeague regression tests
        run: python -m unittest discover -s scripts -p 'test_euroleague_model.py' -v
