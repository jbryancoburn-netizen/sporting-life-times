name: MBB apply verified official game cards
on:
  push:
    paths:
      - '.github/workflows/mbb-apply-official-cards.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: START=0 END=100 python scripts/mbb_official_layout_apply.py
      - run: python scripts/mbb_live_quality_audit.py
      - name: Publish validated corrections and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-schedules-2026-27/ data/mbb-alternate-layout-applied.json data/mbb-live-quality-audit-2026-27.json
          git commit -m "Apply official schedule card classifications and publish audit" || exit 0
          for n in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1
