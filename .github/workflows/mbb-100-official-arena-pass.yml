name: MBB official arena 100-school batch
on:
  push:
    paths:
      - '.github/workflows/mbb-100-official-arena-pass.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  arenas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scripts/mbb_100_official_arena_pass.py
      - name: Publish verified schools and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-arena-registry.json data/mbb-100-official-arena-pass.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish 100-school official athletics arena verification"
            git pull --rebase origin main
            git push
          fi
