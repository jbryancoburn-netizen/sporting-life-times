name: MBB official school 100-field recovery (one time)
on:
  push:
    paths:
      - '.github/workflows/mbb-official-100-field-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scripts/mbb_official_100_field_recovery.py
      - run: python scripts/mbb_live_quality_audit.py
      - run: python scripts/mbb_build_university_master.py
      - name: Publish school-sourced corrections and site master files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-schedules-2026-27/ data/mbb-official-100-field-recovery.json data/mbb-live-quality-audit-2026-27.json data/mbb-university-master-2026-27.csv data/mbb-university-master-2026-27.json
          git commit -m "Publish 100-school official venue time broadcast recovery and rebuilt master" || exit 0
          for n in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1
