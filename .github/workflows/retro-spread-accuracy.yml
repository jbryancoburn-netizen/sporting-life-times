name: RETRO Spread Accuracy (isolated)
on:
  push:
    branches: [main]
    paths:
      - 'data/ncaam-2026-27-retro-primary.json'
      - 'data/ncaam-2026-27-upcoming-forecasts.json'
      - 'data/retro-pregame-archive-2026-27.json'
      - 'data/mbb-retro-pregame-spreads-2026-27.json'
      - '.github/workflows/retro-spread-accuracy.yml'
      - 'scripts/retro_regularization_forward.py'
      - 'scripts/retro_spread_accuracy.py'
      - 'scripts/verify_retro_spread_coverage.py'
  schedule:
    - cron: '8,18,28,38,48,58 * * * *'
  workflow_run:
    workflows:
      - Publish MBB RETRO Primary
      - MBB RETRO single-model 100 forecast capture
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: retro-spread-accuracy-main
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze scheduled pregame spreads and score verified finals
        run: |
          python3 -m py_compile scripts/retro_spread_accuracy.py scripts/retro_regularization_forward.py
          python3 scripts/retro_spread_accuracy.py
          python3 scripts/retro_regularization_forward.py
          python3 scripts/verify_retro_spread_coverage.py
      - name: Reconcile and commit only updated audit outputs
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RETRO Forecast Auditor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another publisher may have committed new final scores while this job ran.
          # Rebuild against the newest main snapshot instead of rebasing generated JSON.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 -m py_compile scripts/retro_spread_accuracy.py scripts/retro_regularization_forward.py
            python3 scripts/retro_spread_accuracy.py
            python3 scripts/retro_regularization_forward.py
            python3 scripts/verify_retro_spread_coverage.py
            git add data/retro-pregame-archive-2026-27.json data/retro-spread-accuracy-2026-27.json data/retro-regularization-forward-2026-27.json data/retro-regularization-forward-score-2026-27.json
            if git diff --cached --quiet; then
              echo "No new predictions or scores"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "data: update immutable RETRO spread audit"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Upstream main changed while auditing; rebuilding from newest snapshot"
            sleep 2
          done
          echo "::error::Could not publish accuracy update after four fresh rebuilds" >&2
          exit 1
      - name: Publish refreshed accuracy to the public newspaper
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-newspaper.yml --ref main
