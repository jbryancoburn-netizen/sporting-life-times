name: Verify and cache original 1980s Big Ten logos
on:
  push:
    branches: [feat/cbb-large-local-1980s-big-ten-20261113]
    paths:
      - scripts/cache-cbb-big-ten-1980s.py
      - .github/workflows/cbb-big-ten-1980s-cache.yml
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: cbb-historical-big-ten-asset-cache
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install archive parsing and artwork validation tools
        run: python -m pip install --quiet pillow beautifulsoup4 requests
      - name: Verify all ten historical school identities and artwork source eras
        run: python -u scripts/cache-cbb-big-ten-1980s.py
      - name: Store actual 1980s artwork in this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cbb-big-ten-1980s/ data/cbb-big-ten-1980s.json
          test "$(find assets/cbb-big-ten-1980s -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 10
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cache ten verified 1980s Big Ten school logos locally"
          for attempt in 1 2 3 4 5; do
            git fetch origin feat/cbb-large-local-1980s-big-ten-20261113
            git rebase origin/feat/cbb-large-local-1980s-big-ten-20261113
            if git push origin HEAD:feat/cbb-large-local-1980s-big-ten-20261113; then exit 0; fi
          done
          exit 1
