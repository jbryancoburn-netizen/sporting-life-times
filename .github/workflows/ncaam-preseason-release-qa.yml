name: NCAA preseason published release QA
on:
  push:
    paths:
      - 'data/ncaam-2026-27-preseason-roster-informed.json'
      - 'data/ncaam-2026-27-preseason-release-qa.json'
      - 'scripts/verify_ncaam_preseason_release_qa.py'
      - '.github/workflows/ncaam-preseason-release-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_ncaam_preseason_release_qa.py
