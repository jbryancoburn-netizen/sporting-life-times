name: NCAA D1 men's source archive smoke test
on:
  push:
    paths:
      - 'scripts/archive_ncaam_ncaa_scores.py'
      - 'scripts/normalize_ncaam_archive.py'
      - 'scripts/test_normalize_ncaam_archive.py'
      - '.github/workflows/ncaam-source-archive.yml'
  workflow_dispatch:
    inputs:
      start:
        description: First calendar day (YYYY-MM-DD)
        required: true
        default: '2026-03-01'
      end:
        description: Last calendar day (YYYY-MM-DD; no more than 15 days)
        required: true
        default: '2026-03-02'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate extraction and rating math
        run: |
          python -m unittest discover -s scripts -p 'test_ncaam_elo.py' -v
          python -m unittest discover -s scripts -p 'test_normalize_ncaam_archive.py' -v
      - name: Collect NCAA-origin daily source archive
        run: |
          python scripts/archive_ncaam_ncaa_scores.py \
            --start "${{ inputs.start || '2026-03-01' }}" --end "${{ inputs.end || '2026-03-01' }}" \
            --root staging/ncaam-source-archive
      - name: Normalize verified finals to candidate CSV and audit report
        if: success()
        run: |
          python scripts/normalize_ncaam_archive.py \
            --root staging/ncaam-source-archive \
            --out staging/ncaam-final-candidates.csv \
            --registry staging/ncaam-team-candidates.json \
            --report staging/ncaam-coverage-report.json
      - name: Preserve evidence and reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-men-d1-source-audit
          path: staging/
          if-no-files-found: warn
          retention-days: 14
