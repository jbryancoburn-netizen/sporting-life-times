name: Women's NCAA Historical Results and Home-Court Study
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wbb-history-calibration.yml'
permissions:
  contents: write
concurrency:
  group: wbb-historical-study
  cancel-in-progress: false
jobs:
  import-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify scripts are valid Python
        run: python -m py_compile scripts/wbb-season.py scripts/wbb-calibration.py
      - name: Retrieve five post-2021 women's D-I historical seasons
        run: |
          python scripts/wbb-season.py history 2022
          python scripts/wbb-season.py history 2023
          python scripts/wbb-season.py history 2024
          python scripts/wbb-season.py history 2025
          python scripts/wbb-season.py history 2026
      - name: Calibrate and hold out 2025-26
        run: python scripts/wbb-calibration.py
      - name: Recompute the 2026-27 women's model with tested home edge if available
        run: |
          if [ -f data/ncaaw-2026-27-teams.json ] && [ -f data/ncaaw-2026-27-verified-games.json ]; then
            node scripts/publish-wbb-retro.js
          fi
      - name: Persist only historical women's research and ratings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wbb-2021-2022-results.json data/wbb-2022-2023-results.json data/wbb-2023-2024-results.json data/wbb-2024-2025-results.json data/wbb-2025-2026-results.json data/ncaaw-retro-parameters.json
          if [ -f data/ncaaw-2026-27-retro-primary.json ]; then git add data/ncaaw-2026-27-retro-primary.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish five-season women's basketball historical data and home-edge research"
          for n in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep 2
          done
          exit 1
