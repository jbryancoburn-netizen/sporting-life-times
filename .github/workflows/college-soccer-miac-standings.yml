name: Refresh MIAC Soccer Standings
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_college_soccer_miac_standings.py'
      - 'scripts/test_college_soccer_miac_standings.py'
      - '.github/workflows/college-soccer-miac-standings.yml'

permissions:
  contents: write

concurrency:
  group: update-miac-official-standings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official table parser
        run: python -m pip install beautifulsoup4
      - name: Test complete, missing and conflicting MIAC record parsing
        run: python -m unittest discover -s scripts -p test_college_soccer_miac_standings.py -v
      - name: Fetch current MIAC conference standings
        run: python scripts/update_college_soccer_miac_standings.py
      - name: Validate published 11-team snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/college-soccer-miac-standings.json').read_text())
          rows=data['rows']
          assert len(rows)==11
          assert len({r['team_id'] for r in rows})==11
          assert all(isinstance(r['conference_points'],int) for r in rows)
          print('PASS: complete MIAC standings snapshot')
          PY
      - name: Publish only validated new conference records
        run: |
          if git diff --quiet -- data/college-soccer-miac-standings.json; then
            echo "Official standings unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/college-soccer-miac-standings.json
          git commit -m "Update verified MIAC men's soccer standings"
          git pull --rebase origin main
          git push origin HEAD:main
