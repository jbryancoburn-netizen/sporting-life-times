name: DIII school schedules — official-source verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_d3_official_schedules.py'
      - '.github/workflows/d3-official-schedules.yml'
  schedule:
    - cron: '19 8,20 * * *'
permissions:
  contents: write
concurrency:
  group: d3-official-school-fixtures
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official schedule HTML parser
        run: python -m pip install --quiet beautifulsoup4
      - name: Test strict schedule extraction, aliases and verification
        run: |
          python -m py_compile scripts/build_d3_official_schedules.py
          python scripts/build_d3_official_schedules.py --test
      - name: Fetch official DIII men's and women's school schedules
        run: python scripts/build_d3_official_schedules.py --workers 30
      - name: Validate source-linked fixture publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for gender in ('men','women'):
              d=json.loads(Path(f'data/d3-{gender}-2026-27.json').read_text())
              f=json.loads(Path(f'data/d3-{gender}-official-fixtures-2026-27.json').read_text())
              assert f['gender']==gender and f['division']=='d3' and f['season']=='2026-27'
              ids={t['ncaa_org_id'] for t in d['teams'] if t.get('d3_confirmed') and t.get('membership_year')==2027}
              assert f['verified_source_calendars']>=1
              # Every year-specific NCAA sport sponsor must have an auditable
              # success, missing-site, or failed-source outcome.
              assert f['school_calendars_checked']==len(ids)
              assert f['ncaa_confirmed_programs']==len(ids)
              assert f['verified_source_calendars']+f['school_calendars_missing']==len(ids)
              assert len(f['source_audit'])==len(ids)
              assert len({a['owner_org_id'] for a in f['source_audit']})==len(ids)
              assert sum(f['source_status_counts'].values())==len(ids)
              assert f['no_athletics_host']>=0
              assert len(f['fixtures'])==f['fixture_count']
              keys=set()
              for game in f['fixtures']:
                  assert game['status']=='scheduled' and game['source_url'].startswith('https://')
                  assert {game['away_org_id'],game['home_org_id']}<=ids
                  assert len(game['official_schedule_sources'])>=1
                  assert not any(x in game for x in ('away_score','home_score','pred_home_pct'))
                  key=(game['date'],frozenset((game['away_org_id'],game['home_org_id'])))
                  assert key not in keys,('duplicate match',game['id'])
                  keys.add(key)
              print(gender,f['fixture_count'],'school-sourced fixtures;',
                    f['reciprocal_fixtures'],'reciprocal;',len(f['conflicts']),'conflicts')
          PY
      - name: Commit source-backed DIII fixtures only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/d3-men-official-fixtures-2026-27.json data/d3-women-official-fixtures-2026-27.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish NCAA member-wide DIII university schedule audit and fixtures"
          for n in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            # The rebase conflict side named "theirs" is this run's
            # already validated DIII-only fixture snapshot. Preserve
            # unrelated upstream changes, replay only our audited files.
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "Concurrent schedule update; preserving existing published data"
              exit 1
            fi
            sleep $((n * 2))
          done
          exit 1
