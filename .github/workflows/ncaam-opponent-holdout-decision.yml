name: NCAA opponent holdout decision integrity
on:
  push:
    paths:
      - 'data/ncaam-opponent-quality-backtest.json'
      - 'data/ncaam-2026-27-opponent-quality-holdout-decision.json'
      - 'scripts/verify_ncaam_opponent_quality_holdout_decision.py'
      - '.github/workflows/ncaam-opponent-holdout-decision.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_ncaam_opponent_quality_holdout_decision.py
