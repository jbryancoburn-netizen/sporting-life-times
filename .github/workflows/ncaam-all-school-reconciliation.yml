name: NCAA all-school historical player reconciliation
on:
  push:
    paths:
      - 'scripts/reconcile_ncaam_bulk_historical_players.py'
      - 'data/ncaam-historical-roster-extraction/batch-*.json'
      - '.github/workflows/ncaam-all-school-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/reconcile_ncaam_bulk_historical_players.py
      - run: |
          python - <<'PY'
          import json
          d=json.load(open('data/ncaam-historical-bulk-player-reconciliation.json'))
          assert d['historical_pages']==792
          assert d['filtered_name_mentions']<=d['raw_name_mentions']
          assert d['production_promotion_approved'] is False
          print('PASS: all four batches reconciled without claiming preseason verification')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ncaa-historical-player-reconciliation
          path: data/ncaam-historical-bulk-player-reconciliation.json
      - name: Publish reconciled player evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaam-historical-bulk-player-reconciliation.json
          git commit -m "Publish NCAA all-school historical player reconciliation [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
