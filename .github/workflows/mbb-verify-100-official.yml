name: MBB verify 100 official school schedules
on:
  push:
    paths:
      - '.github/workflows/mbb-verify-100-official.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mbb-official-first-100
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scripts/mbb_official_first_100_verification.py
      - name: Publish verified schedule data and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-schedules-2026-27/ data/mbb-official-first-100-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify first 100 college basketball schedules from athletics websites"
            git pull --rebase origin main
            git push
          fi
