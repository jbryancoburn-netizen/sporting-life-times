name: NCAA Soccer Team UI Checks
on:
  push:
    branches: [main]
    paths:
      - 'college-soccer-teams.js'
      - 'college-soccer-teams.css'
      - 'college-soccer-team.html'
      - 'college-soccer.html'
      - 'data/college-soccer-team-schedules.json'
      - 'data/college-soccer-team-branding.json'
      - 'data/college-soccer-miaa-standings.json'
      - 'data/college-soccer-conferences.json'
      - '.github/workflows/college-soccer-team-ui-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript parsing
        run: node --check college-soccer-teams.js
      - name: Check team page asset references and official records
        run: |
          node <<'JS'
          const fs=require('fs');
          const assert=require('assert/strict');
          const pages=['college-soccer-team.html','college-soccer.html'];
          for(const p of pages){
            const html=fs.readFileSync(p,'utf8');
            assert.match(html,/college-soccer-teams\.js\?v=home21/);
            assert.match(html,/college-soccer-teams\.css\?v=home21/);
            assert.match(html,/id="college-team-search"/);
            assert.match(html,/id="college-team-profile"/);
          }
          const schedule=JSON.parse(fs.readFileSync('data/college-soccer-team-schedules.json'));
          const trine=schedule.teams['men-d3:trine'].games;
          const rank=JSON.parse(fs.readFileSync('data/college-soccer-elo.json'));
          const trineTeam=rank.cohorts['men-d3'].find(t=>t.team_id==='trine');
          assert(trineTeam && trine.length>=14);
          const final=trine.filter(g=>g.status==='final');
          assert(final.every(g=>Number.isInteger(g.goals_for)&&Number.isInteger(g.goals_against)));
          assert(final.every(g=>g.date && g.opponent));
          const official=JSON.parse(fs.readFileSync('data/college-soccer-miaa-standings.json'));
          assert.equal(official.rows.length,8,'Expected all eight MIAA teams');
          const expected=new Set(['calvin','kalamazoo','albion','hope','adrian','alma','trine','olivet']);
          assert.equal(new Set(official.rows.map(x=>x.team_id)).size,8);
          for(const row of official.rows){
            assert(expected.has(row.team_id));
            assert.match(row.conference_record,/^\\d+-\\d+(?:-\\d+)?$/);
            assert.equal(row.conference_games,row.conference_record.split('-').map(Number).reduce((a,b)=>a+b,0));
            assert(Number.isInteger(row.conference_points));
          }
          assert(official.checked_date,'Official snapshot requires an explicit source date');
          const branding=JSON.parse(fs.readFileSync('data/college-soccer-team-branding.json'));
          assert.equal(branding.teams['men-d3:trine'].city,'Angola');
          assert(branding.teams['men-d3:trine'].logo_url.startsWith('https://'));
          for(const marker of ['team-result-timeline','team-splits','team-visual-report','team-hero-logo-bg','team-porch-grid']){
            assert(fs.readFileSync('college-soccer-teams.js','utf8').includes(marker),marker+' missing');
          }
          console.log('Team UI references, graphs and Trine source-backed records validated.');
          JS
