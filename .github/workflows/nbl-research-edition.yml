name: NBL research newspaper edition
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    paths:
      - 'nbl-team.html'
      - 'nbl-team.js'
      - 'nbl-schedule-data.js'
      - 'scripts/publish_nbl_standings.py'
      - 'scripts/publish_nbl_player_stats.py'
      - 'scripts/publish_nbl_research_elo.py'
      - 'tests/test_nbl_research_ratings.py'
      - 'tests/test_nbl_full_season.py'
      - 'scripts/check_nbl_edition_consistency.py'
      - '.github/workflows/nbl-research-edition.yml'
permissions:
  contents: write
concurrency:
  group: nbl-data-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate NBL generation and consistency logic
        run: |
          python -m unittest discover -s tests -p 'test_nbl*.py' -v
      - name: Build source-derived regular season ledger and standings
        run: python scripts/publish_nbl_standings.py
      - name: Replay independent research Elo
        run: python scripts/publish_nbl_research_elo.py
      - name: Require same ten clubs, same final cutoff and research-only status
        run: |
          python scripts/check_nbl_edition_consistency.py --elo data/nbl-elo-research.json --standings data/nbl-standings.json
      - name: Refuse prediction promotion
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/nbl-elo-research.json'))
          assert d['production_approved'] is False
          assert d['prediction_certified'] is False
          assert d['status']=='RESEARCH_ONLY_UNCERTIFIED'
          PY
      - name: Collect available sourced NBL player box scores
        run: python scripts/publish_nbl_player_stats.py
      - name: Reconcile player point totals against final results
        run: python scripts/check_nbl_player_boxes.py
      - name: Publish verified-consistent newspaper snapshot only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nbl-standings.json data/nbl-research-current-ledger.json data/nbl-elo-research.json data/nbl-player-boxscores.json
          if git diff --cached --quiet; then
            echo "No changed NBL data files"
            exit 0
          fi
          git commit -m "Publish source-derived NBL standings and research Elo [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            # The repository has simultaneous league workflows. Retry only
            # non-fast-forward push races; never force-push generated data.
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "NBL snapshot published"
              exit 0
            fi
            echo "Concurrent update changed main (attempt $attempt); retrying"
            sleep "$((attempt * 2))"
          done
          echo "Failed to publish NBL snapshot after retry budget"
          exit 1
