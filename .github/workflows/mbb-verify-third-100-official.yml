name: MBB verify third 100 official school schedules
on:
  push:
    paths:
      - '.github/workflows/mbb-verify-third-100-official.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scripts/mbb_official_third_100_verification.py
      - name: Publish verified records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-schedules-2026-27/ data/mbb-official-third-100-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify third 100 school schedules using official athletics sites"
            git pull --rebase origin main
            git push
          fi
