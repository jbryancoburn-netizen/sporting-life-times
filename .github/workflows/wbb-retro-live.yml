name: Women's College Basketball Independent RETRO
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/wbb-retro-live.yml'
      - 'scripts/wbb-season.py'
      - 'scripts/publish-wbb-retro.js'
      - 'tests/test_wbb_live_pipeline.py'
      - 'scripts/check_wbb_workflow_isolation.py'
      - 'scripts/sync_cbb_final_calendars.py'
      - 'scripts/apply_wbb_official_replacements.py'
      - 'data/wbb-official-fixture-replacements-2026-27.json'
      - 'wbb-game-results.js'
      - 'wbb-team-newspaper.js'
      - 'tests/wbb-team-results.test.cjs'
  push:
    paths:
      - '.github/workflows/wbb-retro-live.yml'
      - 'scripts/wbb-season.py'
      - 'scripts/publish-wbb-retro.js'
      - 'tests/test_wbb_live_pipeline.py'
      - 'scripts/check_wbb_workflow_isolation.py'
      - 'scripts/sync_cbb_final_calendars.py'
      - 'wbb-game-results.js'
      - 'tests/wbb-team-results.test.cjs'
  schedule:
    # Primary game windows: every 5 minutes from early afternoon to late night
    # across daylight-saving changes (UTC 17:00-06:59).
    - cron: '*/5 17-23,0-6 * * *'
    # Early starts, overseas fixtures, and the last late-night finals:
    # half-hour cadence outside the busiest basketball window.
    - cron: '7,37 7-8,11-16 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: wbb-retro-publish
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject cross-sport trigger regression
        run: python scripts/check_wbb_workflow_isolation.py
      - name: Validate women-only ingester and regression suite
        run: |
          python -m py_compile scripts/wbb-season.py
          python -m unittest discover -s tests -p 'test_wbb_live_pipeline.py' -v
  publish:
    # NEVER let a feature-branch push or PR publish its unmerged SHA to main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject cross-sport trigger regression before publishing
        run: python scripts/check_wbb_workflow_isolation.py
      - name: Validate women-only pipeline before fetching
        run: |
          python -m py_compile scripts/wbb-season.py
          node --check scripts/publish-wbb-retro.js
      - name: Test women-only refresh safety (no network)
        run: |
          python -m unittest discover -s tests -p 'test_wbb_live_pipeline.py' -v
          node --test tests/wbb-team-results.test.cjs
      - name: Fetch women's Division I roster and ESPN finals
        run: python scripts/wbb-season.py live
      - name: Recalculate 1500-start women-only RETRO
        run: node scripts/publish-wbb-retro.js
      - name: Merge verified women's finals into each individual women's calendar
        run: python3 scripts/sync_cbb_final_calendars.py --gender women
      - name: Save published women's results without touching men's data
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaaw-2026-27-teams.json data/ncaaw-2026-27-verified-games.json data/ncaaw-2026-27-games.json data/ncaaw-2026-27-retro-primary.json data/ncaaw-schedules-2026-27.json data/wbb-final-calendar-reconciliation-audit.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish verified women's NCAA basketball games and RETRO"
          for n in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep 2
          done
          exit 1
      - name: Deploy changed women-only RETRO to the live newspaper
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-newspaper.yml --ref main
