name: Women's Division I Full Team Calendars
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wbb-team-schedules.yml'
      - 'scripts/wbb-reconcile-schedule-evidence.py'
  schedule:
    # One weekly source refresh; avoid expensive repeating full-team polls.
    - cron: '27 11 * * 2'
permissions:
  contents: write
  actions: write
concurrency:
  group: wbb-team-calendars
  cancel-in-progress: false
jobs:
  build:
    # Do not publish an unmerged feature branch to main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate calendar importer
        run: python -m py_compile scripts/wbb-team-schedules.py
      - name: Validate women's conference group importer
        run: python -m py_compile scripts/wbb-conferences.py
      - name: Verify women's 2026-27 conference membership by group
        run: python scripts/wbb-conferences.py || echo 'Women-specific conference audit unavailable; publish schedules with provisional labels'
      - name: Retrieve all 363 women's basketball team calendars
        run: python scripts/wbb-team-schedules.py
      - name: Merge and audit uniquely matched broadcast evidence
        run: python scripts/wbb-reconcile-schedule-evidence.py
      - name: Preserve verified women's final scores after the full calendar rebuild
        run: python3 scripts/sync_cbb_final_calendars.py --gender women
      - name: Publish calendars and source gaps
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaaw-schedules-2026-27.json data/ncaaw-schedules-2026-27-audit.json data/wbb-final-calendar-reconciliation-audit.json
          if [ -f data/ncaaw-2026-27-conferences.json ]; then git add data/ncaaw-2026-27-conferences.json; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh women’s D-I team calendars and venue/broadcast coverage"
          for n in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            # In a rebase, 'ours' is the up-to-date main branch. Never let a
            # slow full-calendar rebuild overwrite newer verified final scores.
            git rebase -X ours origin/main || { git rebase --abort || true; exit 1; }
            # Reapply finals from the refreshed verified ledger after rebasing.
            # This also restores the latest per-team final reconciliation audit.
            python3 scripts/sync_cbb_final_calendars.py --gender women
            git add data/ncaaw-schedules-2026-27.json data/wbb-final-calendar-reconciliation-audit.json
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            sleep 2
          done
          exit 1

      - name: Publish changed women's team calendars to the public newspaper
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-newspaper.yml --ref main
