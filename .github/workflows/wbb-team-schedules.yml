name: Women's Division I Full Team Calendars
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wbb-team-schedules.yml'
  schedule:
    # One weekly source refresh; avoid expensive repeating full-team polls.
    - cron: '27 11 * * 2'
permissions:
  contents: write
concurrency:
  group: wbb-team-calendars
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate calendar importer
        run: python -m py_compile scripts/wbb-team-schedules.py
      - name: Validate women's conference group importer
        run: python -m py_compile scripts/wbb-conferences.py
      - name: Verify women's 2026-27 conference membership by group
        run: python scripts/wbb-conferences.py
      - name: Retrieve all 363 women's basketball team calendars
        run: python scripts/wbb-team-schedules.py
      - name: Publish calendars and source gaps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaaw-schedules-2026-27.json data/ncaaw-schedules-2026-27-audit.json data/ncaaw-2026-27-conferences.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh women’s D-I team calendars and venue/broadcast coverage"
          for n in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep 2
          done
          exit 1
