name: MBB league-wide quality gate
on:
  push:
    paths:
      - '.github/workflows/mbb-quality-gate.yml'
      - 'scripts/mbb_school_verification_ledger.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/mbb_quality_gate.py
      - run: python scripts/mbb_school_verification_ledger.py
      - name: Publish quality report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-quality-gate-2026-27.json data/mbb-school-verification-ledger.json data/mbb-quality-summary-2026-27.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish full-league MBB schedule quality gate results"
            git pull --rebase origin main
            git push
          fi
