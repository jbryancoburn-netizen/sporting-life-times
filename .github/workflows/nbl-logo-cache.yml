name: Cache NBL team logos
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/cache_nbl_logos.py
      - .github/workflows/nbl-logo-cache.yml
permissions:
  contents: write
concurrency:
  group: nbl-logo-cache
  cancel-in-progress: false
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve all ten original team crests
        run: python scripts/cache_nbl_logos.py
      - name: Commit verified local logo assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nbl-logos/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish cached official NBL club identities [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
