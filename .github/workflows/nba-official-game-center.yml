name: Official NBA game-center refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-official-game-center.yml'
      - 'scripts/collect_nba_game_center.py'
      - 'scripts/backfill-nba-boxscores.py'
      - 'scripts/backfill-nba-espn.py'
      - 'scripts/collect-nba-schedule.py'
      - 'scripts/enrich-nba-game-details.py'
      - 'scripts/collect-nba-player-leaders.py'
      - 'scripts/build-nba-possession-inputs.mjs'
      - 'scripts/test-nba-ingestion.py'
      - 'scripts/test-nba-espn-backfill.py'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-nba-game-center
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collection code before using NBA feed
        run: python -m py_compile scripts/collect_nba_game_center.py scripts/backfill-nba-boxscores.py scripts/backfill-nba-espn.py scripts/collect-nba-player-leaders.py scripts/collect-nba-schedule.py
      - name: Test NBA ingestion with synthetic fixtures and empty-feed rejection
        run: |
          python scripts/test-nba-ingestion.py
          python scripts/test-nba-espn-backfill.py
      - name: Backfill missed completed NBA player box scores from official schedule
        continue-on-error: true
        run: python scripts/backfill-nba-boxscores.py
      - name: Collect NBA official daily scoreboard and box scores
        continue-on-error: true
        run: python scripts/collect_nba_game_center.py
      - name: Validate NBA collection modules
        run: python -m py_compile scripts/collect_nba_game_center.py scripts/backfill-nba-boxscores.py scripts/collect-nba-player-leaders.py
      - name: Backfill ESPN game summaries when official NBA CDN misses box scores
        continue-on-error: true
        run: python scripts/backfill-nba-espn.py
      - name: Enrich completed games with quarter scores and team comparisons
        continue-on-error: true
        run: python scripts/enrich-nba-game-details.py
      - name: Collect next seven days and live NBA scores
        continue-on-error: true
        run: python scripts/collect-nba-schedule.py
      - name: Collect published NBA player leader statistics
        run: python scripts/collect-nba-player-leaders.py
      - name: Build Rabby verified possession inputs independently of Elo
        run: node scripts/build-nba-possession-inputs.mjs
      - name: Validate NBA schedule and forecasts against Elo
        run: |
          node --check nba-rabby-forecast.js
          node --check nba-rabby-possession.js
          node --check nba-intelligence.js
          python -c "import json; d=json.load(open('data/nba-player-leaders.json')); assert d['sample_only'] and len(d['rows']) > 0"
          node scripts/audit-nba-elo.mjs
          python -c "import json; d=json.load(open('data/nba-game-center.json')); assert d['coverage']['boxscores_with_players'] > 0 and len(d['games']) > 0"
      - name: Commit verified official NBA game center
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba-game-center.json data/nba-possession-inputs.json data/nba-player-leaders.json
          if test -f data/nba-upcoming-schedule.json; then git add data/nba-upcoming-schedule.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh official NBA score and schedule archive"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || exit 1
            sleep 2
          done
          echo "Could not publish the NBA archive after three synchronized attempts" >&2
          exit 1
