name: Official NBA game-center refresh
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-nba-game-center
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect NBA official daily scoreboard and box scores
        run: python scripts/collect_nba_game_center.py
      - name: Backfill missed completed NBA player box scores from official schedule
        run: python scripts/backfill-nba-boxscores.py
      - name: Collect published NBA player leader statistics
        run: python scripts/collect-nba-player-leaders.py
      - name: Build Rabby verified possession inputs independently of Elo
        run: node scripts/build-nba-possession-inputs.mjs
      - name: Validate NBA schedule and forecasts against Elo
        run: |
          node --check nba-rabby-forecast.js
          node --check nba-rabby-possession.js
          node scripts/audit-nba-elo.mjs
          python -c "import json; d=json.load(open('data/nba-game-center.json')); assert isinstance(d['games'],list)"
      - name: Commit verified official NBA game center
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba-game-center.json data/nba-possession-inputs.json data/nba-player-leaders.json 2>/dev/null || git add data/nba-game-center.json data/nba-possession-inputs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh official NBA score and schedule archive"
          git push
