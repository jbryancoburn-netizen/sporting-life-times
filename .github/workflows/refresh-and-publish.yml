name: Refresh news and publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sporting-life-times-pages
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore original PDF masthead
        run: |
          python -m pip install --quiet pymupdf
          python scripts/extract_masthead.py
      - name: Test multi-source engine
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Collect RSS headlines
        run: python scripts/collect_feeds.py
      - name: Validate sports data source registry
        run: python scripts/check_sources.py
      - name: Collect verified scoreboards
        run: python scripts/collect_scores.py
      - name: Collect official MLB and NHL scores
        run: python scripts/collect_official_scores.py
      - name: Collect official college athletics schedules
        run: python scripts/collect_college_schedules.py
      - name: Merge official and backup scoreboards
        run: python scripts/collect_multisource.py
      - name: Probe Statcast schema (non-fatal)
        run: python scripts/collect_statcast.py
      - name: Publish provider health and conflict audit
        run: python scripts/publish_source_health.py
      - name: Commit refreshed feed data
        run: |
          if ! git diff --quiet -- articles.json scoreboards.json official_scoreboards.json multi_scoreboards.json statcast_health.json college_schedules.json data/source-health.json || [ -n "$(git ls-files --others --exclude-standard assets/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add articles.json scoreboards.json official_scoreboards.json multi_scoreboards.json statcast_health.json college_schedules.json data/source-health.json assets/original-print-masthead.png
            git commit -m "Refresh Sporting Wire and verified scoreboards"
            git push
          fi
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: refresh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
