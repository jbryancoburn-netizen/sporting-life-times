name: Newspaper regression tests
on:
  pull_request:
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'tests/*.test.cjs'
      - 'scripts/check_inline_javascript.py'
      - '.github/workflows/regression-tests.yml'
  workflow_dispatch:
concurrency:
  group: newspaper-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editorial-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate JavaScript syntax
        run: |
          for script in *.js; do node --check "$script"; done
          python3 scripts/check_inline_javascript.py
          node --check editorial-policy.js
          node --check department-stories.js
          node --check edition-pages.js
          node --check app.js
          node --input-type=module --check < ncaam-elo-page.js
      - name: Test newspaper systems
        run: node --test tests/*.test.cjs
      - name: Validate USRS publication safety gate
        run: python3 -m unittest discover -s scripts -p 'test_publish_usrs.py' -v
