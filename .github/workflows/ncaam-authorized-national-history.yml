name: Reconcile authorized national historical NCAA schedules
on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Relative path to an approved source manifest already in this repository
        required: true
        default: 'historical-report/ncaam-approved-source-manifest.json'
  push:
    paths:
      - 'scripts/reconcile_ncaam_authorized_historical_sources.py'
      - 'scripts/test_ncaam_authorized_historical_sources.py'
      - '.github/workflows/ncaam-authorized-national-history.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate license, fixture deduplication and missing seasons
        run: python scripts/test_ncaam_authorized_historical_sources.py
      - name: Ingest authorized historical export, when provided
        env:
          HISTORICAL_MANIFEST: ${{ inputs.manifest_path }}
        run: |
          if [ -z "$HISTORICAL_MANIFEST" ] || [ ! -f "$HISTORICAL_MANIFEST" ]; then
            echo "No approved historical source manifest supplied; fixture tests passed, but no historical game import is claimed."
            exit 0
          fi
          python scripts/reconcile_ncaam_authorized_historical_sources.py --manifest "$HISTORICAL_MANIFEST"
      - name: Publish evidence only, never certified national Elo
        run: |
          test -f data/ncaam-pre1985-approved-national-inventory.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ncaam-pre1985-approved-national-inventory.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish approved historical schedule coverage audit'
            git pull --rebase
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-national-reconciliation
          path: |
            data/ncaam-pre1985-approved-national-inventory.json
            historical-normalized/pre1985-approved/verified-national-fixtures.csv
          if-no-files-found: warn
