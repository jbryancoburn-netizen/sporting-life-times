name: Assemble Big East 1980s historical logo gallery
on:
  push:
    branches:
      - feat/big-east-1980s-11-school-logo-audit-20261114
    paths:
      - scripts/build_big_east_1980s_gallery.py
      - .github/workflows/build-big-east-1980s-gallery.yml
permissions:
  contents: write
jobs:
  big-east-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Build eleven 512px original-era historical badges with ring-clearance checks
        run: python scripts/build_big_east_1980s_gallery.py
      - name: Audit local gallery completeness and historical provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          r=json.loads(Path('data/cbb-big-east-1980s-source-manifest.json').read_text())
          h=Path('cbb-big-east-1980s-preview.html').read_text()
          assert len(r['schools'])==11 and len({s['espn_id'] for s in r['schools']})==11
          assert sum(s['in_big_east_1980s'] for s in r['schools'])==6
          assert r['production_deployment'] is False
          assert h.count('<article class="school">')==11
          assert 'content.sportslogos.net' not in h
          for x in r['schools']:
           image=Path(x['local_path']).read_bytes()
           assert image[:8]==bytes.fromhex('89504e470d0a1a0a')
           assert hashlib.sha256(image).hexdigest()==x['local_sha256']
           assert x['geometry']['gap_to_238px_ring']>=18
           assert x['image_url'].startswith('https://content.sportslogos.net/logos/')
          print('CERTIFIED 11 local original-era Big East images, source hashes and ring safety')
          PY
      - name: Commit 11 visual assets and review gallery only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_big_east_1980s_gallery.py cbb-big-east-1980s-preview.html data/cbb-big-east-1980s-source-manifest.json assets/cbb-big-east-1980s
          git commit -m 'Add sourced 11-school Big East historical crest review gallery'
          git push
