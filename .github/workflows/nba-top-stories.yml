name: NBA top stories refresh
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-nba-stories.py'
      - 'scripts/test-nba-news-editorial.py'
      - '.github/workflows/nba-top-stories.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: nba-top-stories-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate NBA collector
        run: python -m py_compile scripts/collect-nba-stories.py
      - name: Refresh attributed headlines
        run: |
          for attempt in 1 2 3; do
            if python scripts/collect-nba-stories.py; then exit 0; fi
            echo "NBA collector attempt $attempt failed" >&2
            sleep $((attempt * 12))
          done
          exit 1
      - name: Verify editorial filtering on refreshed headlines
        run: python scripts/test-nba-news-editorial.py
      - name: Validate published stories
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/nba-top-stories.json'))
          a=d.get('articles',[])
          assert len(a)>=3, 'Refusing empty or undersized NBA top stories'
          assert all(x['category']=='NBA' and x['url'].startswith('https://') and x.get('published_at') for x in a)
          print('Validated',len(a),'NBA articles')
          PY
      - name: Commit NBA news without overwriting other sports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba-top-stories.json
          if git diff --cached --quiet; then echo 'NEWS_CHANGED=false' >> "$GITHUB_ENV"; exit 0; fi
          echo 'NEWS_CHANGED=true' >> "$GITHUB_ENV"
          git commit -m "Refresh attributed NBA top stories"
          for attempt in 1 2 6; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep 2
          done
          exit 1
      - name: Trigger newspaper publishing immediately after new news
        if: env.NEWS_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # workflow_dispatch is allowed from GITHUB_TOKEN (push alone is not).
          gh workflow run publish-pages.yml --ref main
          echo 'Requested Pages deployment for the refreshed NBA news feed.'
