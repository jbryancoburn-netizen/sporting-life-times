name: NFL live game-day scoreboard and in-game stats
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_nfl_live.py'
      - 'scripts/nfl_finalization_guard.py'
      - 'scripts/test_nfl_finalization_guard.py'
      - '.github/workflows/nfl-gameday-live.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: nfl-2026-verified-publication
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch independently sourced current NFL scoreboard and live statistics
        run: python scripts/update_nfl_live.py
      - name: Validate live feed without changing historical Elo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/nfl-live.json').read_text())
          assert d['season']==2026 and d['games'] and d['coverage']['games']==len(d['games'])
          assert len({g['id'] for g in d['games']})==len(d['games'])
          assert all(g['away']['id']!=g['home']['id'] for g in d['games'])
          assert d['coverage']['active']==sum(g['state']=='in' for g in d['games'])
          print('NFL live scoreboard integrity PASSED')
          PY
      - name: Reconcile completed games across the NFL newspaper
        id: reconcile
        run: |
          python scripts/test_nfl_finalization_guard.py
          if python scripts/nfl_finalization_guard.py needs-refresh; then
            echo "finalization_required=true" >> "$GITHUB_OUTPUT"
            python scripts/build_nfl_edition.py --fast
          else
            echo "finalization_required=false" >> "$GITHUB_OUTPUT"
            echo "Published season records already include all nearby finals"
          fi
          python scripts/nfl_finalization_guard.py verify
      - name: Publish live scores and certified final-game season statistics
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl-live.json data/nfl-2026-edition.json data/nfl-2026-boxscores.json data/nfl-2026-rosters.json
          if git diff --cached --quiet; then echo "published=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Refresh sourced NFL in-game scoreboard and stats"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then echo "published=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_nfl_live.py
            if python scripts/nfl_finalization_guard.py needs-refresh; then
              python scripts/build_nfl_edition.py --fast
            fi
            python scripts/nfl_finalization_guard.py verify
            git add data/nfl-live.json data/nfl-2026-edition.json data/nfl-2026-boxscores.json data/nfl-2026-rosters.json
            if git diff --cached --quiet; then echo "published=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            git commit -m "Refresh reconciled NFL live scoreboard"
            sleep 2
          done
          exit 1
      - name: Deploy updated Pages edition after verified NFL finals
        if: steps.reconcile.outputs.finalization_required == 'true' && steps.publish.outputs.published == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish-newspaper.yml',
              ref: 'main',
            });
