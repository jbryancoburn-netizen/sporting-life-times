name: Refresh MBB third-party Top 25
on:
  workflow_dispatch:
  schedule:
    - cron: '21 11 * * *'
permissions:
  contents: write
jobs:
  top25:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/mbb_external_top25.py
      - name: Publish source-verified rankings only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mbb-external-top25.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Daily update of verified external MBB Top 25'
          git pull --rebase origin main
          git push origin HEAD:main
