name: MBB quality gate compact summary
on:
  push:
    paths:
      - '.github/workflows/mbb-quality-summary.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/mbb_quality_gate.py
      - name: Publish the quality summary and full detail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-quality-gate-2026-27.json data/mbb-quality-summary-2026-27.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish readable MBB quality audit summary"
            git pull --rebase origin main
            git push
          fi
