name: G6 weekly championship register
on:
  schedule:
    - cron: '15 12 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: g6-weekly-register
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for independent snapshot
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Capture verified live G6 field and odds
        run: node scripts/capture-g6-race.cjs
      - name: Commit only the historical G6 register when changed
        run: |
          if git diff --quiet -- data/g6-race-history.json; then
            echo "No new weekly edition"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/g6-race-history.json
          git commit -m "Archive weekly G6 championship race"
          git push
