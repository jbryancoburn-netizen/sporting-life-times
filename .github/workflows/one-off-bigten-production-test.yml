name: Verify 18 production Big Ten heritage crests (one-off)
on:
  push:
    branches:
      - feat/production-cbb-big-ten-heritage-20261114
    paths:
      - tests/cbb-big-ten-heritage-production.test.cjs
      - .github/workflows/one-off-bigten-production-test.yml
permissions:
  contents: read
jobs:
  check-logos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live logo systems and both gender rankings
        run: |
          node --check mbb-logo-system.js
          node --check wbb-rankings.js
          node --test tests/cbb-big-ten-heritage-production.test.cjs
      - name: Run existing 365-school identity and visual contracts
        run: |
          if [ -f tests/mbb-logo-system.test.cjs ]; then node --test tests/mbb-logo-system.test.cjs; fi
          if [ -f tests/cbb-logo-audit.test.cjs ]; then node --test tests/cbb-logo-audit.test.cjs; fi
          if [ -f tests/mbb-cbb-crest-365.test.cjs ]; then node --test tests/mbb-cbb-crest-365.test.cjs; fi
