name: NCAA false-transfer official corrections
on:
  push:
    paths:
      - 'scripts/test_ncaam_unlinked_official_corrections.py'
      - 'data/ncaam-2026-27-unlinked-official-corrections-batch-01.json'
      - 'data/ncaam-2026-27-unlinked-2014-recovery-queue.json'
      - '.github/workflows/ncaam-unlinked-official-corrections.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_ncaam_unlinked_official_corrections.py
