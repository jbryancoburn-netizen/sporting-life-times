name: Prepare transparent professional basketball club marks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize-pro-basketball-logos.py'
      - '.github/workflows/normalize-pro-basketball-logos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install logo image library
        run: python -m pip install --disable-pip-version-check --quiet pillow
      - name: Normalize all 30 team marks
        run: python scripts/normalize-pro-basketball-logos.py
      - name: Commit only normalized image art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pro-basketball-logos/
          if git diff --cached --quiet; then
            echo "All artwork already normalized"
          else
            git commit -m "Generate 30 transparent pro basketball crest assets"
            git push origin HEAD:main
          fi
