name: CBB final-score publication watchdog
on:
  pull_request:
    paths:
      - '.github/workflows/cbb-final-publication-watchdog.yml'
      - 'scripts/check_cbb_finals_health.py'
      - 'tests/test_cbb_calendar_identity.py'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cbb-final-publication-watchdog.yml'
      - 'scripts/check_cbb_finals_health.py'
      - 'tests/test_cbb_calendar_identity.py'
  workflow_run:
    workflows:
      - MBB newspaper refresh and publish
      - Publish MBB RETRO Primary
    types: [completed]
    branches: [main]
  schedule:
    # Independent of men's and women's publisher schedules, including overnight.
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: cbb-final-publication-watchdog
  cancel-in-progress: false
jobs:
  test_calendar_identity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject score/date coincidences with wrong college basketball identities
        run: python3 -m unittest discover -s tests -p test_cbb_calendar_identity.py -v
  check:
    needs: test_calendar_identity
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently compare ESPN finals, published RETRO and live website
        id: freshness
        run: python3 scripts/check_cbb_finals_health.py
      - name: Recover stale published men's live scoreboard
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/slt-mbb-stale
          import datetime as dt,json
          from pathlib import Path
          feed=json.loads(Path('data/mbb-live.json').read_text())
          try:
              stamp=dt.datetime.fromisoformat(feed.get('scores_updated_at') or '')
              age=dt.datetime.now(dt.timezone.utc)-stamp.astimezone(dt.timezone.utc)
              print('true' if age>dt.timedelta(minutes=12) else 'false')
          except (ValueError,TypeError,AttributeError):
              print('true')
          PY
          if [[ "$(cat /tmp/slt-mbb-stale)" == "true" ]]; then
            active="$(gh run list --workflow mbb-newspaper.yml --branch main --limit 12 --json status --jq 'any(.[]; .status != "completed")')"
            if [[ "$active" == "false" ]]; then
              gh workflow run mbb-newspaper.yml --ref main
            fi
          fi
      - name: Recover missing men's finals and team schedules
        if: ${{ always() && steps.freshness.outputs.refresh_men == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active="$(gh run list --workflow mbb-retro-primary.yml --branch main --limit 12 --json status --jq 'any(.[]; .status != "completed")')"
          if [[ "$active" == "false" ]]; then
            gh workflow run mbb-retro-primary.yml --ref main
          fi
      - name: Recover missing women's finals and team schedules
        if: ${{ always() && steps.freshness.outputs.refresh_women == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active="$(gh run list --workflow wbb-retro-live.yml --branch main --limit 12 --json status --jq 'any(.[]; .status != "completed")')"
          if [[ "$active" == "false" ]]; then
            gh workflow run wbb-retro-live.yml --ref main
          fi
      - name: Recover a lagging public Pages deployment
        if: ${{ always() && steps.freshness.outputs.deploy == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active="$(gh run list --workflow publish-newspaper.yml --branch main --limit 12 --json status --jq 'any(.[]; .status != "completed")')"
          if [[ "$active" == "false" ]]; then
            gh workflow run publish-newspaper.yml --ref main
          fi
      - name: Never report success when overdue finals or Pages data are stale
        if: steps.freshness.outputs.stale == 'true'
        run: |
          echo "::error::CBB final scores or public RETRO files remain stale. Recovery workflows requested."
          exit 1
