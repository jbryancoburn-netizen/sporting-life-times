name: Publish NBL player box scores
on:
  workflow_dispatch:
  schedule:
    - cron: '46 */3 * * *'
  push:
    paths:
      - scripts/publish_nbl_player_stats.py
permissions:
  contents: write
concurrency:
  group: nbl-boxscores
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect per-game player stats
        run: python scripts/publish_nbl_player_stats.py
      - name: Commit available box scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nbl-player-boxscores.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh NBL player box scores"
          git pull --rebase origin main
          git push origin HEAD:main
