name: Build historical 16-school SEC logo audit
on:
  push:
    branches: [feat/sec-1980s-16-school-logo-audit-20261114]
    paths:
      - 'scripts/build_sec_1980s_gallery.py'
      - '.github/workflows/build-sec-1980s-gallery.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/build_sec_1980s_gallery.py
      - name: Verify 16 local SEC assets and audit page
        run: |
          python - <<'PY'
          import json,pathlib,struct
          m=json.loads(pathlib.Path('data/cbb-sec-1980s-source-manifest.json').read_text())
          assert len(m['schools'])==16 and len({x['espn_id'] for x in m['schools']})==16
          assert sum(x['in_sec_1980s'] for x in m['schools'])==10
          page=pathlib.Path('cbb-sec-1980s-preview.html').read_text()
          assert page.count('<article class="school">')==16
          assert 'https://content.sportslogos.net' not in page
          for r in m['schools']:
              b=pathlib.Path(r['local_path']).read_bytes()
              assert b[:8]==bytes.fromhex('89504e470d0a1a0a')
              assert struct.unpack('>II',b[16:24])==(512,512)
              assert r['geometry']['gap_to_238px_ring']>=18
          print('All 16 SEC local historical assets validated')
          PY
      - name: Commit vintage local PNG gallery to preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cbb-sec-1980s cbb-sec-1980s-preview.html data/cbb-sec-1980s-source-manifest.json
          git commit -m 'Generate 16 original-era SEC college crests as locally hosted audit gallery'
          git push
