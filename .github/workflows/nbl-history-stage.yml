name: NBL historical result staging
on:
  push:
    paths:
      - 'scripts/stage_nbl_history.py'
      - 'scripts/audit_nbl_candidates.py'
      - 'scripts/backtest_nbl_elo.py'
      - 'scripts/nbl_three_season_eval.py'
      - 'scripts/select_nbl_elo.py'
      - 'scripts/nbl_release_decision.py'
      - 'scripts/crosscheck_nbl26_archive.py'
      - 'scripts/nbl_parameter_screen.py'
      - '.github/workflows/nbl-history-stage.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: read
jobs:
  stage-nbl-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test historical staging semantics
        run: python -m unittest discover -s tests -p test_nbl_staging.py -v
      - name: Stage 2024-25 historical warm-up season
        run: python scripts/stage_nbl_history.py --start 2024-09-19 --end 2025-03-31 --output /tmp/nbl-history/2024-25-candidates.json
      - name: Stage complete 2025-26 season candidate finals
        run: python scripts/stage_nbl_history.py --start 2025-09-01 --end 2026-04-30 --output /tmp/nbl-history/2025-26-candidates.json
      - name: Stage 2026-27 candidate finals to date
        run: python scripts/stage_nbl_history.py --start 2026-09-01 --end $(date -u +%F) --output /tmp/nbl-history/2026-27-candidates.json
      - name: Audit candidate identity and chronological integrity
        run: python scripts/audit_nbl_candidates.py --past /tmp/nbl-history/2025-26-candidates.json --current /tmp/nbl-history/2026-27-candidates.json --output /tmp/nbl-history/reconciliation-audit.json
      - name: Evaluate existing Elo settings against held-out current season
        run: python scripts/backtest_nbl_elo.py --past /tmp/nbl-history/2025-26-candidates.json --current /tmp/nbl-history/2026-27-candidates.json --output /tmp/nbl-history/elo-holdout-report.json
      - name: Evaluate fixed Elo settings across three chronological seasons
        run: python scripts/nbl_three_season_eval.py --s2024 /tmp/nbl-history/2024-25-candidates.json --s2025 /tmp/nbl-history/2025-26-candidates.json --s2026 /tmp/nbl-history/2026-27-candidates.json --output /tmp/nbl-history/elo-three-season-report.json
      - name: Select Elo parameters on historical validation, then evaluate holdout once
        run: python scripts/select_nbl_elo.py --s2024 /tmp/nbl-history/2024-25-candidates.json --s2025 /tmp/nbl-history/2025-26-candidates.json --s2026 /tmp/nbl-history/2026-27-candidates.json --output /tmp/nbl-history/elo-selection-audit.json
      - name: Screen fixed NBL parameter grid on validation season only
        run: python scripts/nbl_parameter_screen.py --s2024 /tmp/nbl-history/2024-25-candidates.json --s2025 /tmp/nbl-history/2025-26-candidates.json --s2026 /tmp/nbl-history/2026-27-candidates.json --output /tmp/nbl-history/parameter-screen-research.json
      - name: Record definitive NBL predictive release decision
        run: python scripts/nbl_release_decision.py --audit /tmp/nbl-history/reconciliation-audit.json --evaluation /tmp/nbl-history/elo-three-season-report.json --selection /tmp/nbl-history/elo-selection-audit.json --output /tmp/nbl-history/release-decision.json
      - name: Cross-check 2025-26 scorelines with independent publication
        run: python scripts/crosscheck_nbl26_archive.py --candidate /tmp/nbl-history/2025-26-candidates.json --output /tmp/nbl-history/independent-nbl26-crosscheck.json
      - name: Require complete independent NBL26 source reconciliation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/nbl-history/independent-nbl26-crosscheck.json')
          d=json.loads(p.read_text())
          assert d.get('status') in ('all_scorelines_matched','reconciled_with_documented_discrepancies'), d
          assert d.get('ESPN_candidates_excluding_cup')==178, d
          assert d.get('unmatched_count')==0, d
          assert d.get('matched_scorelines',0)+d.get('documented_discrepancies',0)==178, d
          assert d.get('production_approved') is False, d
          print('All 178 NBL26 league and playoff game scores externally accounted for.')
          PY
      - name: Upload original-source audit candidates
        uses: actions/upload-artifact@v4
        with:
          name: nbl-source-candidates
          path: /tmp/nbl-history/
          retention-days: 30
