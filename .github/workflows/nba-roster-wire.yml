name: NBA injury and transaction wire
on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-nba-roster-wire.py'
      - '.github/workflows/nba-roster-wire.yml'
permissions:
  contents: write
concurrency:
  group: nba-roster-wire-main
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector
        run: python -m py_compile scripts/collect-nba-roster-wire.py
      - name: Collect source-attributed wire
        run: python scripts/collect-nba-roster-wire.py
      - name: Preserve integrity and push
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/nba-roster-wire-snapshot.json'))
          assert d.get('injuries') or d.get('transactions')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba-roster-wire-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh sourced NBA injuries and transactions"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || exit 1
            sleep 2
          done
          exit 1
