name: NCAA men's offseason transfer-impact calibration
on:
  push:
    paths:
      - scripts/backtest_ncaam_roster_transfers.py
      - scripts/test_backtest_ncaam_roster_transfers.py
      - .github/workflows/ncaam-transfer-calibration.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncaam-transfer-calibration
  cancel-in-progress: false
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test transfer identity and chronology rules
        run: python -m unittest discover -s scripts -p test_backtest_ncaam_roster_transfers.py -v
      - name: Validate NCAA-origin roster-transfer feature on held-out season
        run: python scripts/backtest_ncaam_roster_transfers.py
      - name: Enforce evidence and source coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/ncaam-offseason-transfer-backtest.json').read_text())
          assert r['test_baseline']['games']>=500
          assert r['test_candidate']['games']==r['test_baseline']['games']
          assert r['test_candidate']['coverage']>.65
          assert min(r['team_feature_coverage'].values())>=250
          assert r['approved_for_primary'] is False
          print('Held-out evaluation completed; primary Elo remains independently calculated and gated.')
          PY
      - name: Commit reproducible empirical transfer calibration report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaam-offseason-transfer-backtest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Report held-out empirical NCAA transfer and returning-minutes Elo impact"
          git pull --rebase origin main
          git push origin HEAD:main
