name: Preserve authentic 1985 Buzz in ACC archive (one-off)
on:
  push:
    branches:
      - feat/acc-1980s-18-school-logo-audit-20261114
    paths:
      - scripts/replace_acc_georgia_tech_buzz.py
      - .github/workflows/one-off-acc-buzz85.yml
permissions:
  contents: write
jobs:
  mascot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'pillow>=10,<12'
      - name: Replace GT lettermark with authentic Buzz mascot source
        run: python scripts/replace_acc_georgia_tech_buzz.py
      - name: Verify local source and no production rewrite
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          from PIL import Image
          d=json.loads(Path('data/cbb-acc-1980s-source-manifest.json').read_text())
          row=next(x for x in d['schools'] if x['slug']=='georgia-tech')
          assert row['era']=='1985–1999'
          assert '1985 Buzz yellowjacket' in row['description']
          assert row['geometry']['gap_to_238px_ring']>=18
          with Image.open(row['local_path']) as i:
            assert i.size==(512,512)
          assert row['local_sha256']==hashlib.sha256(Path(row['local_path']).read_bytes()).hexdigest()
          html=Path('cbb-acc-1980s-preview.html').read_text()
          assert html.count('<article class="school">')==18
          assert 'georgia-tech.png?v=20261114-acc-buzz85' in html
          assert d['production_deployment'] is False
          print('PASS: complete 1985 mascot artwork, 18 current ACC members, no production logo overrides')
          PY
      - name: Commit corrected Buzz PNG and source metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cbb-acc-1980s/georgia-tech.png cbb-acc-1980s-preview.html data/cbb-acc-1980s-source-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Use 1985 Buzz original archive artwork instead of plain GT'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
