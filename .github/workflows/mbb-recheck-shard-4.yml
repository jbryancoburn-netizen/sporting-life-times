name: MBB official recheck shard 4 (300-365)
on:
  push:
    paths:
      - '.github/workflows/mbb-recheck-shard-4.yml'
  workflow_dispatch:
concurrency:
  group: mbb-official-shard-serialized-publisher
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      BATCH_START: '300'
      BATCH_END: '365'
      BATCH_NAME: 'shard-4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scripts/mbb_official_recheck_sharded.py
      - name: Commit official corrections and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-schedules-2026-27/ data/mbb-official-recheck-shard-4-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify official MBB schedule shard 4"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push && exit 0
              sleep 3
            done
            exit 1
          fi
