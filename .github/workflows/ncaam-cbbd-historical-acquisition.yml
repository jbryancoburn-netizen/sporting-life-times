name: Acquire historical national NCAA game archives
on:
  workflow_dispatch:
    inputs:
      first_season:
        description: First ending-year season
        required: true
        default: '1950'
      last_season:
        description: Last ending-year season
        required: true
        default: '1984'
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test historical API pagination and date boundaries
        run: python scripts/test_ncaam_cbbd_historical_acquisition.py
      - name: Check that the historical API credential is available
        run: |
          if [ -z "$CBBD_API_KEY" ]; then
            echo "::error::Missing CBBD_API_KEY repository secret; no data acquired"
            exit 1
          fi
      - name: Acquire date-windowed official historical game evidence
        run: |
          python scripts/acquire_ncaam_cbbd_pre1985.py --start-season "${{ inputs.first_season }}" --end-season "${{ inputs.last_season }}"
      - name: Convert historical API games and publish coverage audit
        run: |
          python scripts/convert_ncaam_cbbd_historical_games.py
          python scripts/import_ncaam_pre1985_national.py \
            --input historical-normalized/cbbd-national-fixtures.csv \
            --output data/ncaam-pre1985-national-coverage.json \
            --fixtures-output historical-normalized/ncaam-pre1985-national-verified.csv
          python - <<'PY'
          import json
          d=json.load(open('data/ncaam-pre1985-national-coverage.json'))
          assert d['games_verified']>0
          assert not any(x['eligible_full_national_elo'] for x in d['seasons'])
          PY
      - name: Upload acquired source and manifest for auditing
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbbd-historical-acquisition
          path: |
            historical-normalized/cbbd/*.json
            data/ncaam-cbbd-historical-acquisition.json
            data/ncaam-pre1985-national-coverage.json
            historical-normalized/cbbd-national-fixtures.csv
          if-no-files-found: warn
      - name: Publish historical inventory only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ncaam-cbbd-historical-acquisition.json data/ncaam-pre1985-national-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: record historical college basketball API acquisition provenance'
            git pull --rebase
            git push
          fi
