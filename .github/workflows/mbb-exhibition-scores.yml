name: MBB Exhibition Scores
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_mbb_exhibition_scores.py'
      - 'data/mbb-exhibition-finals-2026-27.json'
      - 'tests/mbb-calendar-finals.test.cjs'
      - '.github/workflows/mbb-exhibition-scores.yml'
  # Free official university schedule pages; September-November exhibition window.
  schedule:
    - cron: '19 11,23 * 9-11 *'
permissions:
  contents: write
concurrency:
  group: mbb-exhibition-scores
  cancel-in-progress: false
jobs:
  exhibition-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install open-source HTML reader
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Verify exhibition results do not alter RETRO Elo
        run: node tests/mbb-calendar-finals.test.cjs
      - name: Collect exact official-school exhibition results
        run: python scripts/refresh_mbb_exhibition_scores.py
      - name: Commit source-supported exhibition updates only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-exhibition-finals-2026-27.json data/mbb-exhibition-score-audit.json
          if git diff --cached --quiet; then
            echo "No new official exhibition results"
            exit 0
          fi
          git commit -m "Refresh independently verified exhibition results (no RETRO)"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
