name: MBB school logo identity validation
on:
  push:
    paths:
      - '.github/workflows/mbb-logo-identity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/mbb_logo_identity_verify.py
      - name: Publish logo identity report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-logo-registry.json data/mbb-school-logo-identity-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish full-league MBB logo identity checks"
            git pull --rebase origin main
            git push
          fi
