name: Verify historical NCAA preseason roster sources
on:
  push:
    paths:
      - 'scripts/audit_ncaam_preseason_roster_sources.py'
      - '.github/workflows/ncaam-preseason-roster-provenance.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncaam-preseason-provenance
  cancel-in-progress: false
jobs:
  verify-original-roster-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official PDF reader
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Check official dated school documents and pre-opening archived captures
        run: python scripts/audit_ncaam_preseason_roster_sources.py --output data/ncaam-preseason-roster-source-provenance.json
      - name: Validate strict certification safeguards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('data/ncaam-preseason-roster-source-provenance.json').read_text())
          assert audit['summary']['school_season_documents_tested']==5
          assert audit['summary']['fully_verified_365_team_preseason_roster_snapshots']==0
          assert audit['existing_retrospective_rosters_promotable'] is False
          assert all(r['immutable_prior_to_first_game_content_verified'] is False for r in audit['sources'])
          print('PASS: Dated school preseason sources audited without manufacturing a full 365-team snapshot')
          PY
      - name: Commit actual NCAA preseason source provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaam-preseason-roster-source-provenance.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish evidence from real dated NCAA preseason roster sources"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1
