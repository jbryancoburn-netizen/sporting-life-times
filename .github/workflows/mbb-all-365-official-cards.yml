name: MBB all 365 official athletics card verification
on:
  push:
    paths:
      - '.github/workflows/mbb-all-365-official-cards.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mbb-official-365-card-publisher
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: START=0 END=365 BATCH=365 python scripts/mbb_official_card_365.py
      - run: python scripts/mbb_live_quality_audit.py
      - name: Commit audited verified records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-schedules-2026-27/ data/mbb-official-card-apply-365.json data/mbb-live-quality-audit-2026-27.json
          git commit -m "Apply source-verified game sites for all 365 basketball programs" || exit 0
          for n in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 4
          done
          exit 1
