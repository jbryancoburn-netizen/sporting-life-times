name: Refresh 2026 CFB results
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_cfb_2026.py
      - .github/workflows/cfb-results.yml
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  import-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_cfb_2026.py
      - name: Commit refreshed game data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cfb-2026-results.json
          git diff --cached --quiet || (git commit -m "Refresh 2026 CFB completed games from ESPN" && git push)
