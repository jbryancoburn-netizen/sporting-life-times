name: Official athletics MBB school calendars
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/mbb-official-school-schedule-sources.json'
      - 'scripts/mbb_reciprocal_game_fields.py'
permissions:
  contents: write
jobs:
  official-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install beautifulsoup4 requests
      - name: Import verified school athletics schedules
        run: python scripts/import_mbb_official_school_schedules.py
      - name: Reconcile and validate recovered calendars
        run: |
          python scripts/mbb_reciprocal_official_recovery.py
          python scripts/mbb_reciprocal_game_fields.py
          python scripts/mbb_schedule_completion_audit.py
          python scripts/mbb_live_quality_audit.py
      - name: Publish verified schedule changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-schedules-2026-27/ data/mbb-official-game-evidence/ data/mbb-reciprocal-official-recovery.json data/mbb-reciprocal-game-fields.json data/mbb-schedule-completion-audit.json data/mbb-live-quality-audit-2026-27.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enrich official MBB calendars without replacing verified game records"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
