name: Official athletics MBB school calendars
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_mbb_official_school_schedules.py'
      - 'data/mbb-official-school-schedule-sources.json'
      - '.github/workflows/mbb-official-school-calendars.yml'
permissions:
  contents: write
jobs:
  official-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install beautifulsoup4
      - name: Import verified school athletics schedules
        run: python scripts/import_mbb_official_school_schedules.py
      - name: Publish official school calendars
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-schedules-2026-27/
          if ! git diff --cached --quiet; then
            git commit -m "Import school-athletics official MBB schedules"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
