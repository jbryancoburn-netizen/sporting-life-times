name: Refresh MIAA Soccer Standings
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_college_soccer_miaa_standings.py'
      - '.github/workflows/college-soccer-miaa-standings.yml'

permissions:
  contents: write

concurrency:
  group: update-miaa-official-standings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official table HTML parser
        run: python -m pip install beautifulsoup4
      - name: Fetch and validate official eight-school MIAA table
        run: python scripts/update_college_soccer_miaa_standings.py
      - name: Commit only genuine changes
        run: |
          if git diff --quiet -- data/college-soccer-miaa-standings.json; then
            echo "No verified conference standing changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/college-soccer-miaa-standings.json
          git commit -m "Update verified MIAA men's soccer standings"
          git pull --rebase origin main
          git push origin HEAD:main
