name: NCAA soccer live game-card scores
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: ncaa-soccer-live-gamecards
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch six NCAA soccer divisions
        run: python scripts/publish_college_soccer_live_scores.py
      - name: Commit live snapshot only on change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/college-soccer-live-scores.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NCAA soccer in-progress game-card scores"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
