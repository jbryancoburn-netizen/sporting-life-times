name: College Soccer RETRO Daily Selection
on:
  schedule:
    - cron: '40 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: college-soccer-selection-only
  cancel-in-progress: false
jobs:
  rebuild-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild and validate 48-team soccer projection
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from datetime import datetime,timezone
          from pathlib import Path
          out=Path("data/college-soccer-selection-update-status.json")
          run=subprocess.run([sys.executable,"scripts/rebuild_soccer_daily_selection.py"],capture_output=True,text=True)
          state={"checked_at_utc":datetime.now(timezone.utc).isoformat(),"status":"retro_projection_updated" if run.returncode==0 else "rebuild_failed","reason":(run.stdout if run.returncode==0 else run.stderr)[-600:]}
          out.write_text(json.dumps(state,indent=2)+chr(10))
          print(state)
          PY
          python -m json.tool data/college-soccer-ncaa-selection-forecast.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/college-soccer-ncaa-selection-forecast.json').read_text())
          status=json.loads(Path('data/college-soccer-selection-update-status.json').read_text())
          if status['status']!='retro_projection_updated':
              print('RETRO rebuild failed; previous projection retained and failure status published')
              raise SystemExit(0)
          assert len(d['field'])==48
          assert len(d['automatic_bid_scenarios'])==23
          assert len(set(x['team_id'] for x in d['field']))==48
          assert sum(x['official_aq'] for x in d['automatic_bid_scenarios'])==d['daily_rebuild']['official_automatic_bids']
          assert d['rating_cutoff']==json.loads(Path('data/college-soccer-elo.json').read_text())['as_of']
          assert d['status'] in ('retro_daily_experimental_not_ncaa_selection','provisional_rpi_resume_proxy')
          for bid in d['automatic_bid_scenarios']:
              assert bid['team_id'] in {x['team_id'] for x in d['field']}
              assert bid['official_aq'] is True or bid['method']!='verified_championship_result'
          # Regression: completed certified Big Ten quarterfinals eliminate losing teams
          b=json.loads(Path('data/college-soccer-men-d1-big-ten-standings.json').read_text())
          defeated=set()
          for m in b.get('tournament_bracket',{}).get('matches',[]):
              if m.get('status')=='final' and m.get('winner_id') in (m.get('home_id'),m.get('away_id')):
                  defeated.add(m['away_id'] if m['winner_id']==m['home_id'] else m['home_id'])
          for bid in d['automatic_bid_scenarios']:
              if bid['conference']=='men-d1:big-ten':
                  assert bid['team_id'] not in defeated, 'Eliminated team projected as Big Ten automatic qualifier'
          print('Validated daily experimental RETRO forecast; NCAA committee selections remain separate')
          PY
      - name: Publish only the selection forecast when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/college-soccer-ncaa-selection-forecast.json data/college-soccer-selection-update-status.json
          if git diff --cached --quiet; then
            echo 'No selection output changes'
            exit 0
          fi
          git commit -m 'Refresh daily NCAA soccer RETRO selection projection'
          git pull --rebase origin main
          git push origin HEAD:main
