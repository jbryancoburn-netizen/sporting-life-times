name: DII basketball — independent men and women editions
on:
  workflow_dispatch:
    inputs:
      full_season:
        description: 'Verify all 2026–27 DII game dates, October through April'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'd2-basketball.js'
      - 'd2-basketball.css'
      - 'd2-*-basketball.html'
      - 'd2-team.html'
      - 'scripts/build_d2_basketball.py'
      - '.github/workflows/d2-basketball.yml'
      - 'tests/d2-basketball.test.cjs'
      - 'tests/test_d2_logo_identity.py'
      - 'tests/test_d2_game_identity.py'
      - 'data/d2-membership-notes-2026-27.json'
      - 'tests/test_d2_membership.py'
      - 'tests/test_d2_scoreboard_fallback.py'
      - 'tests/test_d2_school_colors.py'
      - 'tests/test_d2_espn_scoreboard.py'
      - 'data/d2-verified-tournaments-2026-27.json'
      - 'data/d2-verified-other-openers-2026-27.json'
      - 'data/d2-verified-holiday-2026-27.json'
  schedule:
    - cron: '11 7 * * *'
permissions:
  contents: write
concurrency:
  group: d2-basketball-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install public directory HTML parser
        run: python -m pip install --quiet beautifulsoup4
      - name: Verify new papers and separate 1500 Elo systems
        run: |
          node --check d2-basketball.js
          node --test tests/d2-basketball.test.cjs
          python -m py_compile scripts/build_d2_basketball.py
          python -m unittest discover -s tests -p 'test_d2_*.py' -v
      - name: Bootstrap entire 2026-27 schedule or refresh recent NCAA games
        env:
          DII_FULL_BOOTSTRAP: ${{ (github.event_name == 'push' && github.event.head_commit.message == 'DII full season bootstrap kickoff') || inputs.full_season }}
        run: |
          if [ "$DII_FULL_BOOTSTRAP" = "true" ] || ! test -s data/d2-men-2026-27.json || ! python -c "import json; assert json.load(open('data/d2-men-2026-27.json')).get('as_of')"; then
            echo "Auditing the entire 2026-27 DII men's and women's season; preserving already verified results"
            python scripts/build_d2_basketball.py --bootstrap
          else
            echo "Incremental DII refresh, not a full-season rescan"
            python scripts/build_d2_basketball.py
          fi
      - name: Commit verified DII-only data (never overwrite DI)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/d2-men-2026-27.json data/d2-women-2026-27.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh verified DII men's and women's NCAA game ledgers"
          for n in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! GIT_EDITOR=true git rebase origin/main; then
              # Preserve this freshly verified snapshot on collisions with
              # another scheduled publisher; never force-push over its work.
              git checkout --theirs -- data/d2-men-2026-27.json data/d2-women-2026-27.json
              git add data/d2-men-2026-27.json data/d2-women-2026-27.json
              GIT_EDITOR=true git rebase --continue || { git rebase --abort || true; exit 1; }
            fi
            sleep $((n * 2))
          done
          exit 1
