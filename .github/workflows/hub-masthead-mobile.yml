name: SLT Sports Desks masthead mobile visual check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sports.html'
      - 'slt-hub-masthead-fix.css'
      - 'scripts/test-hub-masthead-mobile.mjs'
      - '.github/workflows/hub-masthead-mobile.yml'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned free browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROME_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
          npx playwright install --with-deps webkit
      - name: Serve local published files
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/slt-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 1
          done
      - name: Verify rendered iPhone and desktop dimensions plus screenshots
        run: node scripts/test-hub-masthead-mobile.mjs
      - name: Inspect ACTUAL deployed GitHub Pages site in mobile Chromium
        if: always()
        run: node scripts/diagnose-hub-live.mjs
      - name: Inspect actual published site with Safari-compatible WebKit
        if: always()
        env:
          SLT_HUB_ENGINE: webkit
        run: node scripts/diagnose-hub-live.mjs
      - name: Save visual evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slt-hub-visual-proof
          path: test-artifacts
          if-no-files-found: warn
