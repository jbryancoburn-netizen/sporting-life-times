name: MBB step 1 reconcile all 365 schedules
on:
  push:
    paths:
      - '.github/workflows/mbb-step1-reconcile-365.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/mbb_step1_reconcile_365.py
      - name: Commit reconciled data and conflict reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-schedules-2026-27/ data/mbb-step1-reconciliation-summary.json data/mbb-step1-reconciliation-flags.json
          if ! git diff --cached --quiet; then
            git commit -m "Complete conservative 365-school MBB schedule reconciliation audit"
            git pull --rebase origin main
            git push
          fi
