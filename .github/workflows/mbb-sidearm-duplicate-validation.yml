name: MBB audit Sidearm duplicate matches
on:
  push:
    paths:
      - '.github/workflows/mbb-sidearm-duplicate-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/mbb_sidearm_duplicate_validation.py
      - name: Publish duplicate-risk audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-sidearm-duplicate-validation.json
          git commit -m "Publish Sidearm duplicate match validation" || exit 0
          git pull --rebase origin main
          git push
