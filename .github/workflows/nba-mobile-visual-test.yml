name: NBA mobile visual regression
on:
  push:
    branches: [main]
    paths:
      - nba.html
      - shared-team-crests.css
      - shared-team-crests.js
      - scripts/inject-team-crests.py
      - nba-newspaper.js
      - nba-newspaper.css
      - nba-depth.css
      - nba-team-depth.js
      - nba-player-depth.js
      - nba-matchup-depth.js
      - nba-team-desk.html
      - nba-players.html
      - nba-rankings.html
      - nba-matchups.html
      - nba-home.js
      - nba-scorebug.js
      - nba-game-comparison.js
      - nba-game-center.js
      - nba-game-center.html
      - scripts/test-nba-comparison.mjs
      - nba-intelligence.js
      - nba-rabby-forecast.js
      - scripts/test-nba-scorebug.mjs
      - nba-paper-layout.css
      - nba-newspaper-polish.css
      - nba-editorial.css
      - compact-edition.css
      - scripts/test-nba-mobile-layout.mjs
      - .github/workflows/nba-mobile-visual-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROME_CHANNEL=chrome" >> "$GITHUB_ENV"
            echo "Using preinstalled runner Google Chrome"
          else
            echo "No runner Chrome found; installing Chromium"
            npx playwright install chromium
          fi
      - name: Check NBA comparison metrics
        run: node scripts/test-nba-comparison.mjs
      - name: Check scorebug ordering and state rules
        run: node scripts/test-nba-scorebug.mjs
      - name: Instrument every page with shared team crests
        run: python3 scripts/inject-team-crests.py && python3 scripts/inject-team-crests.py --check
      - name: Assert iPhone-sized layouts and capture images
        run: node scripts/test-nba-mobile-layout.mjs
      - name: Upload screenshots even when layout fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-mobile-screenshots
          path: test-artifacts
          if-no-files-found: ignore
