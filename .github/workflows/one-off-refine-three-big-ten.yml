name: Normalize three Big Ten source logos (one-off)
on:
  push:
    branches:
      - fix/big-ten-northwestern-goldy-pete-artwork-20261113
    paths:
      - scripts/refine_big_ten_three_marks.py
      - .github/workflows/one-off-refine-three-big-ten.yml
permissions:
  contents: write
jobs:
  correct-source-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Pillow
        run: python -m pip install 'pillow>=10,<12'
      - name: Reframe the original three logo image files
        run: python scripts/refine_big_ten_three_marks.py
      - name: Validate visual metrics and local image references
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          d=json.loads(Path('reports/big-ten-mascot-optical-qa.json').read_text())
          assert set(d['teams'])=={'northwestern','minnesota','purdue'}
          for k,row in d['teams'].items():
            with Image.open(f'assets/cbb-big-ten-1980s/centered/{k}.png') as im:
              assert im.size==(512,512)
            if k!='northwestern':
              assert row['new_long']/row['old_long']>1.065
            else:
              assert row['shift_pixels']!=[0,0]
          html=Path('cbb-big-ten-1980s-preview.html').read_text()
          assert html.count('?v=20261113-optical-v2')==4
          assert html.count('<img src="assets/cbb-big-ten-1980s/centered/')==14
          print('PASS: visible source-asset change, zero new layout or CSS overrides')
          PY
      - name: Save corrected source files and audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cbb-big-ten-1980s-preview.html assets/cbb-big-ten-1980s/centered/northwestern.png assets/cbb-big-ten-1980s/centered/minnesota.png assets/cbb-big-ten-1980s/centered/purdue.png reports/big-ten-mascot-optical-qa.json
          if ! git diff --cached --quiet; then
            git commit -m 'Optically center Northwestern and enlarge Goldy and Purdue Pete'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
