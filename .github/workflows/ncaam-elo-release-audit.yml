name: NCAA Elo release audit
on:
  push:
    paths:
      - 'scripts/audit_ncaa_elo_release.py'
      - 'scripts/test_audit_ncaa_elo_release.py'
      - 'data/ncaam-2026-27-preseason-provisional.json'
      - 'data/ncaam-2026-27-offseason-shadow.json'
      - 'data/ncaam-offseason-transfer-backtest.json'
      - '.github/workflows/ncaam-elo-release-audit.yml'
      - 'scripts/build_ncaam_2027_verified_preseason.py'
      - 'scripts/replay_ncaam_espn_2027.py'
      - 'scripts/update_ncaam_2027.py'
      - 'scripts/audit_ncaam_player_scoring_shadow.py'
      - 'data/ncaam-2026-27-player-scoring-shadow.json'
      - 'scripts/verify_ncaam_player_quality_release.py'
      - 'data/ncaam-2026-27-player-quality-release-decision.json'
      - 'scripts/test_backtest_ncaam_player_quality.py'
      - 'scripts/backtest_ncaam_player_quality.py'
      - 'scripts/backtest_ncaam_quality_retrospective.py'
      - 'scripts/backtest_ncaam_quality_earlyseason_asof.py'
      - 'scripts/test_backtest_ncaam_earlyseason_asof.py'
      - 'data/ncaam-quality-earlyseason-asof-backtest.json'
      - 'scripts/build_ncaam_2027_quality_shadow.py'
      - 'data/ncaam-2026-27-scoring-quality-shadow.json'
      - 'data/ncaam-player-quality-retrospective-backtest.json'
      - 'scripts/test_build_ncaam_2027_verified_preseason.py'
      - 'data/ncaam-2026-27-scoring-quality-shadow.json'
      - 'data/ncaam-2026-27-direct-player-crosswalk.json'
      - 'data/ncaam-2026-27-official-negative-player-identities.json'
      - 'data/ncaam-2026-27-official-prior-school-corroborations.json'
      - 'data/ncaam-2026-27-official-ambiguous-current-player-origins.json'
      - 'data/ncaam-2026-27-player-identity-source-review.json'
      - 'scripts/audit_ncaam_official_player_identities.py'
      - 'scripts/test_audit_ncaam_official_player_identities.py'
      - 'data/ncaam-2026-27-player-movement-audit.json'
      - 'data/ncaam-2026-27-minutes-retention-audit.json'
      - 'data/ncaam-2026-27-preseason-roster-informed.json'
      - 'ncaam-elo-page.js'
      - 'tests/ncaam-page.test.cjs'
  pull_request:
    paths:
      - 'scripts/audit_ncaa_elo_release.py'
      - 'scripts/test_audit_ncaa_elo_release.py'
      - 'data/ncaam-2026-27-preseason-provisional.json'
      - 'data/ncaam-2026-27-offseason-shadow.json'
      - 'data/ncaam-offseason-transfer-backtest.json'
      - 'scripts/build_ncaam_2027_verified_preseason.py'
      - 'scripts/replay_ncaam_espn_2027.py'
      - 'scripts/update_ncaam_2027.py'
      - 'scripts/test_build_ncaam_2027_verified_preseason.py'
      - 'data/ncaam-2026-27-direct-player-crosswalk.json'
      - 'data/ncaam-2026-27-player-movement-audit.json'
      - 'data/ncaam-2026-27-minutes-retention-audit.json'
      - 'data/ncaam-2026-27-preseason-roster-informed.json'
      - 'ncaam-elo-page.js'
      - 'tests/ncaam-page.test.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncaam-elo-release-proof
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile release audit
        run: python -m py_compile scripts/audit_ncaa_elo_release.py scripts/build_ncaam_2027_verified_preseason.py scripts/update_ncaam_2027.py scripts/replay_ncaam_espn_2027.py scripts/backtest_ncaam_quality_retrospective.py scripts/backtest_ncaam_quality_earlyseason_asof.py
      - name: Test release safeguards
        run: python -m unittest discover -s scripts -p 'test_audit_ncaa_elo_release.py' -v
      - name: Test source-identified preseason rating calculation
        run: python -m unittest discover -s scripts -p 'test_build_ncaam_2027_verified_preseason.py' -v
      - name: Lock out 22 proven wrong D-I athlete identities and verify all 30 school-source name cases
        run: |
          python -m unittest discover -s scripts -p 'test_audit_ncaam_official_player_identities.py' -v
          python scripts/audit_ncaam_official_player_identities.py --verify
      - name: Verify player scoring evidence reproduces without altering official Elo
        run: python scripts/audit_ncaam_player_scoring_shadow.py
      - name: Test chronological scoring-quality backtest and leakage detection
        run: python -m unittest discover -s scripts -p 'test_backtest_ncaam_player_quality.py' -v
      - name: Reject post-cutoff athlete leakage
        run: python -m unittest discover -s scripts -p 'test_backtest_ncaam_earlyseason_asof.py' -v
      - name: Enforce evidence-based scoring-quality release decision
        run: python scripts/verify_ncaam_player_quality_release.py
      - name: Verify NCAA ratings newspaper renders newest provisional data
        run: node --test tests/ncaam-page.test.cjs
      - name: Verify all 365 NCAA preseason ratings
        run: |
          python scripts/audit_ncaa_elo_release.py \
            data/ncaam-2026-27-preseason-provisional.json \
            data/ncaam-2026-27-offseason-shadow.json \
            data/ncaam-offseason-transfer-backtest.json
      - name: Preserve passing preseason release test evidence
        run: |
          python - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          data=Path('data/ncaam-2026-27-preseason-roster-informed.json')
          obj=json.loads(data.read_text(encoding='utf-8'))
          assert obj['team_count']==365
          assert obj['evidence']['players_with_verified_historical_minutes']==2923
          assert obj['production_elo_approved'] is False
          record={'season':'2026-27','release_tier':'provisional roster-informed preseason',
             'ci_release_checks':'PASSED',
             'not_full_model_certification':True,
             'source_commit_sha':os.environ.get('GITHUB_SHA'),
             'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
             'verified_at_utc':datetime.now(timezone.utc).isoformat(),
             'model_sha256':hashlib.sha256(data.read_bytes()).hexdigest(),
             'teams_checked':365,'source_linked_player_ids':obj['evidence']['source_linked_player_ids'],
             'players_with_traced_historical_minutes':obj['evidence']['players_with_verified_historical_minutes'],
             'checks':['365-team independent baseline+roster integrity','baseline-shadow calibration contract',
                       'published identity-linked ratings reproduce from data',
                       'source crosswalk/missing-player corruption guards',
                       'paper-style college Elo page Node rendering tests']}
          Path('data/ncaam-2026-27-release-verification.json').write_text(
             json.dumps(record,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(record,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaam-2026-27-release-verification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Certify provisional 2026-27 NCAA roster-informed preseason Elo release tests"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Publish exact NCAA release CI outcome
        if: always()
        env:
          AUDIT_JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          info={'run_id':os.environ.get('GITHUB_RUN_ID'),
                'source_commit_sha':os.environ.get('GITHUB_SHA'),
                'status':os.environ.get('AUDIT_JOB_STATUS'),
                'checks':'Review job steps for failed checks; PASS requires status success',
                'release_tier':'provisional 2026-27 roster-informed',
                'roster_asof_time_verified':False}
          Path('data/ncaam-elo-release-ci-status.json').write_text(json.dumps(info,indent=2)+chr(10))
          print(json.dumps(info,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ncaam-elo-release-ci-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record NCAA release audit CI outcome'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
