name: News wire refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
permissions:
  contents: write
concurrency:
  group: news-wire-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test news parser before publication
        run: python -m unittest -v test_news_wire
      - name: Fetch and validate current news
        run: python scripts/refresh_news.py
      - name: Publish news separately from Elo
        run: |
          git config user.name "sporting-life-times-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh attributed sports news wire"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
