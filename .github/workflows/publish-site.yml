name: Publish and refresh Sporting Life Times
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sporting-life-times-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate browser JavaScript syntax
        run: |
          node --check match-center-page.js
          node --check match-center.js
      - name: Run unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate any supplied USRS forecasts
        run: |
          if [ -f data/usrs-forecasts.json ]; then
            python scripts/publish_usrs.py data/usrs-forecasts.json data/usrs-forecasts.json
          else
            echo 'No verified current USRS forecast export; forecast desk stays unavailable.'
          fi
      - name: Validate supplied independent EPL forecasts
        run: |
          if [ -f data/epl-match-center.json ]; then
            if ! python scripts/publish_eps_epl.py data/epl-match-center.json data/epl-match-center.json; then
              echo 'EPL forecast failed validation or expired; withholding from site build.'
              rm -f data/epl-match-center.json
            fi
          else
            echo 'No fresh validated EPL Match Center export; predictions remain unavailable.'
          fi
      - name: Verify source registry
        run: python scripts/check_sources.py
      - name: Restore PDF masthead
        run: |
          python -m pip install --quiet pymupdf
          python scripts/extract_masthead.py
      - name: Restore prior Match Center archive
        uses: actions/cache/restore@v4
        with:
          path: data/match_center_archive.json
          key: match-center-archive-${{ github.run_id }}
          restore-keys: |
            match-center-archive-
      - name: Restore durable Match Center archive branch
        run: python scripts/persist_match_archive.py restore
      - name: Report restored Match Center archive
        run: |
          python scripts/check_archive_restore.py
      - name: Refresh news and scoreboards before publishing
        run: |
          python scripts/collect_feeds.py
          python scripts/collect_scores.py
          python scripts/collect_match_details.py
          python scripts/check_match_center.py
          python scripts/collect_official_scores.py
          python scripts/collect_college_schedules.py
          python scripts/collect_multisource.py
          python scripts/collect_statcast.py
          python scripts/publish_source_health.py
      - name: Commit durable Match Center archive branch
        run: python scripts/persist_match_archive.py save
      - name: Cross-check published EPL forecasts against Match Center IDs
        run: |
          if [ -f data/epl-match-center.json ]; then
            python scripts/check_eps_match_center.py
          else
            echo 'No current EPL forecast export; Match Center prediction panel remains unavailable.'
          fi
      - name: Preserve Match Center archive across scheduled runs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/match_center_archive.json
          key: match-center-archive-${{ github.run_id }}
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
