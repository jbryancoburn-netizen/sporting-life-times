name: Collect and validate Sporting Life Times data
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
permissions:
  contents: write
concurrency:
  group: newspaper-data-collection
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source parser dependencies
        run: python -m pip install --quiet beautifulsoup4
      - name: Validate browser JavaScript syntax
        run: |
          for script in *.js; do node --check "$script"; done
          python scripts/check_inline_javascript.py
      - name: Validate NBL Elo and feed collector regression tests
        run: python -m unittest discover -s tests -p 'test_nbl*.py' -v
      - name: Audit local page links and assets
        run: python scripts/audit_site_links.py
      - name: Run unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate any supplied USRS forecasts
        run: |
          if [ -f data/usrs-forecasts.json ]; then
            python scripts/publish_usrs.py data/usrs-forecasts.json data/usrs-forecasts.json
          else
            echo 'No verified current USRS forecast export; forecast desk stays unavailable.'
          fi
      - name: Validate supplied independent EPL forecasts
        run: |
          if [ -f data/epl-match-center.json ]; then
            if ! python scripts/publish_eps_epl.py data/epl-match-center.json data/epl-match-center.json; then
              echo 'EPL forecast failed validation or expired; withholding from site build.'
              rm -f data/epl-match-center.json
            fi
          else
            echo 'No fresh validated EPL Match Center export; predictions remain unavailable.'
          fi
      - name: Record actual EPL forecast publication status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/epl-match-center.json')
          status={'competition':'EPL','published':path.exists(),'reason':None if path.exists() else 'forecast export not validated or withheld'}
          Path('data/epl-forecast-publication-status.json').write_text(json.dumps(status,indent=2)+'\n')
          PY
      - name: Verify source registry
        run: python scripts/check_sources.py
      - name: Restore PDF masthead
        run: |
          python -m pip install --quiet pymupdf
          python scripts/extract_masthead.py
      - name: Restore prior Match Center archive
        uses: actions/cache/restore@v4
        with:
          path: data/match_center_archive.json
          key: match-center-archive-${{ github.run_id }}
          restore-keys: |
            match-center-archive-
      - name: Restore durable Match Center archive branch
        run: python scripts/persist_match_archive.py restore
      - name: Report restored Match Center archive
        run: |
          python scripts/check_archive_restore.py
      - name: Restore cumulative NBA game archive
        uses: actions/cache/restore@v4
        with:
          path: data/nba-game-center.json
          key: nba-game-center-${{ github.run_id }}
          restore-keys: |
            nba-game-center-
      - name: Refresh news and scoreboards before publishing
        run: |
          python scripts/collect_feeds.py
          python scripts/collect_scores.py
          if python scripts/publish_nbl_standings.py; then
            python scripts/publish_nbl_research_elo.py
            python scripts/embed_nbl_ratings.py
            python -c 'import json; from pathlib import Path; Path("data/nbl-standings-publication-status.json").write_text(json.dumps({"league":"Australian NBL","published":True}))'
          else
            echo 'NBL ESPN season replay unavailable; withholding reconstructed standings this build'
            rm -f data/nbl-standings.json data/nbl-research-current-ledger.json data/nbl-elo-research.json
            python -c 'import json; from pathlib import Path; Path("data/nbl-standings-publication-status.json").write_text(json.dumps({"league":"Australian NBL","published":False}))'
          fi
          python scripts/collect_match_details.py
          python scripts/build_match_archive_index.py
          python scripts/check_match_center.py
          python scripts/collect_official_scores.py
          python scripts/collect_nba_game_center.py
          python scripts/collect_college_schedules.py
          python scripts/collect_multisource.py
          python scripts/collect_statcast.py
          python scripts/publish_source_health.py
      - name: Reconcile NBL research Elo and standings to identical completed-game cutoff
        run: |
          if [ -f data/nbl-elo-research.json ] && [ -f data/nbl-standings.json ]; then
            python scripts/check_nbl_edition_consistency.py --elo data/nbl-elo-research.json --standings data/nbl-standings.json
          elif [ -f data/nbl-elo-research.json ] || [ -f data/nbl-standings.json ]; then
            echo 'NBL published files disagree: one snapshot is missing'
            exit 1
          else
            echo 'NBL source unavailable; both dependent snapshots withheld'
          fi
      - name: Audit scoreboard and Match Center freshness, coverage, and provenance
        run: python scripts/audit_feed_integrity.py
      - name: Commit durable Match Center archive branch
        run: python scripts/persist_match_archive.py save
      - name: Cross-check published EPL forecasts against Match Center IDs
        run: |
          if [ -f data/epl-match-center.json ]; then
            python scripts/check_eps_match_center.py
          else
            echo 'No current EPL forecast export; Match Center prediction panel remains unavailable.'
          fi
      - name: Preserve Match Center archive across scheduled runs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/match_center_archive.json
          key: match-center-archive-${{ github.run_id }}
      - name: Preserve cumulative NBA game archive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/nba-game-center.json
          key: nba-game-center-${{ github.run_id }}
