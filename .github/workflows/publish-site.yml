name: Publish and refresh Sporting Life Times
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate browser JavaScript syntax
        run: |
          for script in *.js; do node --check "$script"; done
          python scripts/check_inline_javascript.py
      - name: Validate NBL Elo and feed collector regression tests
        run: python -m unittest discover -s tests -p 'test_nbl*.py' -v
      - name: Audit local page links and assets
        run: python scripts/audit_site_links.py
      - name: Run unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate any supplied USRS forecasts
        run: |
          if [ -f data/usrs-forecasts.json ]; then
            python scripts/publish_usrs.py data/usrs-forecasts.json data/usrs-forecasts.json
          else
            echo 'No verified current USRS forecast export; forecast desk stays unavailable.'
          fi
      - name: Validate supplied independent EPL forecasts
        run: |
          if [ -f data/epl-match-center.json ]; then
            if ! python scripts/publish_eps_epl.py data/epl-match-center.json data/epl-match-center.json; then
              echo 'EPL forecast failed validation or expired; withholding from site build.'
              rm -f data/epl-match-center.json
            fi
          else
            echo 'No fresh validated EPL Match Center export; predictions remain unavailable.'
          fi
      - name: Record actual EPL forecast publication status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/epl-match-center.json')
          status={'competition':'EPL','published':path.exists(),'reason':None if path.exists() else 'forecast export not validated or withheld'}
          Path('data/epl-forecast-publication-status.json').write_text(json.dumps(status,indent=2)+'\n')
          PY
      - name: Verify source registry
        run: python scripts/check_sources.py
      - name: Restore PDF masthead
        run: |
          python -m pip install --quiet pymupdf
          python scripts/extract_masthead.py
      - name: Restore prior Match Center archive
        uses: actions/cache/restore@v4
        with:
          path: data/match_center_archive.json
          key: match-center-archive-${{ github.run_id }}
          restore-keys: |
            match-center-archive-
      - name: Restore durable Match Center archive branch
        run: python scripts/persist_match_archive.py restore
      - name: Report restored Match Center archive
        run: |
          python scripts/check_archive_restore.py
      - name: Restore cumulative NBA game archive
        uses: actions/cache/restore@v4
        with:
          path: data/nba-game-center.json
          key: nba-game-center-${{ github.run_id }}
          restore-keys: |
            nba-game-center-
      - name: Refresh news and scoreboards before publishing
        run: |
          python scripts/collect_feeds.py
          python scripts/collect_scores.py
          if python scripts/publish_nbl_standings.py; then
            python scripts/publish_nbl_research_elo.py
            python -c 'import json; from pathlib import Path; Path("data/nbl-standings-publication-status.json").write_text(json.dumps({"league":"Australian NBL","published":True}))'
          else
            echo 'NBL ESPN season replay unavailable; withholding reconstructed standings this build'
            rm -f data/nbl-standings.json data/nbl-research-current-ledger.json data/nbl-elo-research.json
            python -c 'import json; from pathlib import Path; Path("data/nbl-standings-publication-status.json").write_text(json.dumps({"league":"Australian NBL","published":False}))'
          fi
          python scripts/collect_match_details.py
          python scripts/build_match_archive_index.py
          python scripts/check_match_center.py
          python scripts/collect_official_scores.py
          python scripts/collect_nba_game_center.py
          python scripts/collect_college_schedules.py
          python scripts/collect_multisource.py
          python scripts/collect_statcast.py
          python scripts/publish_source_health.py
      - name: Audit scoreboard and Match Center freshness, coverage, and provenance
        run: python scripts/audit_feed_integrity.py
      - name: Commit durable Match Center archive branch
        run: python scripts/persist_match_archive.py save
      - name: Cross-check published EPL forecasts against Match Center IDs
        run: |
          if [ -f data/epl-match-center.json ]; then
            python scripts/check_eps_match_center.py
          else
            echo 'No current EPL forecast export; Match Center prediction panel remains unavailable.'
          fi
      - name: Preserve Match Center archive across scheduled runs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/match_center_archive.json
          key: match-center-archive-${{ github.run_id }}
      - name: Preserve cumulative NBA game archive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/nba-game-center.json
          key: nba-game-center-${{ github.run_id }}
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test published newspaper pages and club crest
        run: |
          set -euo pipefail
          base="https://jbryancoburn-netizen.github.io/sporting-life-times"
          for page in index.html epl.html epl-elo.html epl-club.html match-center.html nba.html nbl.html; do
            echo "Checking published $page"
            curl --fail --location --silent --show-error --retry 4 --retry-delay 3 --retry-all-errors "$base/$page" -o /tmp/newspaper-page.html
            test -s /tmp/newspaper-page.html
            grep -qi '<html' /tmp/newspaper-page.html
          done
          echo "Checking published NBL standings release decision"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 "$base/data/nbl-standings-publication-status.json" -o /tmp/nbl-release-status.json
          python -c 'import json; s=json.load(open("/tmp/nbl-release-status.json")); assert s.get("league")=="Australian NBL" and isinstance(s.get("published"),bool)'
          if python -c 'import json,sys;sys.exit(0 if json.load(open("/tmp/nbl-release-status.json"))["published"] else 1)'; then
            curl --fail --location --silent --show-error --retry 3 --retry-delay 3 "$base/data/nbl-standings.json" -o /tmp/nbl-standings.json
            python -c 'import json; d=json.load(open("/tmp/nbl-standings.json")); assert d.get("status")=="source_derived_not_officially_reconciled" and d.get("teams")==10 and len(d.get("rows",[]))==10 and sum(r["wins"] for r in d["rows"])==d["games_replayed"]'
          else
            echo "NBL standings source withheld safely: snapshot not present"
          fi
          echo "Checking published independent NBL research Elo"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 "$base/data/nbl-elo-research.json" -o /tmp/nbl-research-elo.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/nbl-research-elo.json'))
          assert d.get('status')=='RESEARCH_ONLY_UNCERTIFIED'
          assert d.get('production_approved') is False and d.get('prediction_certified') is False
          rows=d.get('ratings',[])
          assert len(rows)==10 and len({r['team'] for r in rows})==10
          assert [r['rank'] for r in rows]==list(range(1,11))
          assert all(isinstance(r.get('elo'),(float,int)) for r in rows)
          assert sum(r['wins'] for r in rows)==d['current_regular_season_games']
          assert sum(r['losses'] for r in rows)==d['current_regular_season_games']
          print('Confirmed ten NBL ratings, consistent records, and explicit research-only release status')
          PY
          echo "Checking approved EPL forecast publication state"
          curl --fail --location --silent --show-error --retry 4 --retry-delay 3 "$base/data/epl-forecast-publication-status.json" -o /tmp/epl-release-status.json
          python -c 'import json; s=json.load(open("/tmp/epl-release-status.json")); assert s.get("competition")=="EPL" and isinstance(s.get("published"),bool)'
          if python -c 'import json,sys;sys.exit(0 if json.load(open("/tmp/epl-release-status.json"))["published"] else 1)'; then
            curl --fail --location --silent --show-error --retry 4 --retry-delay 3 "$base/data/epl-match-center.json" -o /tmp/newspaper-epl.json
            python -c 'import json; d=json.load(open("/tmp/newspaper-epl.json")); assert d.get("competition")=="EPL" and len(d.get("fixtures",[]))>0'
          else
            echo "EPL forecast withheld by model publication gate; absence is expected, not a deployment failure"
            status=$(curl --location --silent --output /dev/null --write-out '%{http_code}' "$base/data/epl-match-center.json")
            test "$status" = "404"
          fi
          echo "Checking Tottenham crest URL"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors "https://a.espncdn.com/i/teamlogos/soccer/500/367.png" -o /tmp/newspaper-crest.png
          python -c 'from pathlib import Path; assert Path("/tmp/newspaper-crest.png").read_bytes()[:8]==bytes.fromhex("89504e470d0a1a0a")'

