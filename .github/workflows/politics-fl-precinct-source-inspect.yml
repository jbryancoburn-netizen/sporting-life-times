name: Politics Florida 2024 original precinct-source inspection
on:
  workflow_dispatch:
  push:
    branches: [politics-fl-2024-precinct-source-discovery-20261101]
    paths:
      - '.github/workflows/politics-fl-precinct-source-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find original statewide 2024 precinct returns from Florida Division of Elections
        run: |
          python - <<'PY'
          import html.parser,io,json,re,urllib.request,urllib.parse,zipfile,csv,hashlib,collections
          PAGES=[
            "https://dos.fl.gov/elections/data-statistics/elections-data/precinct-level-election-results/",
            "https://dos.fl.gov/elections/data-statistics/elections-data/precinct-level-election-results",
          ]
          class A(html.parser.HTMLParser):
              def __init__(self):super().__init__();self.href=None;self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="a":self.href=dict(attrs).get("href")
              def handle_data(self,data):
                  if self.href:self.links.append((data.strip(),self.href))
              def handle_endtag(self,tag):
                  if tag=="a":self.href=None
          links=[]
          for url in PAGES:
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 public elections data source verification"})
                  with urllib.request.urlopen(req,timeout=20) as res:
                      raw=res.read(700000)
                  reader=A();reader.feed(raw.decode("utf-8",errors="replace"))
                  links=[(name,urllib.parse.urljoin(url,href)) for name,href in reader.links]
                  print("OFFICIAL_PAGE_OK",url,"links",len(links))
                  break
              except Exception as e:
                  print("OFFICIAL_PAGE_UNAVAILABLE",url,type(e).__name__,str(e)[:140])
          match=[(label,link) for label,link in links if "2024 General Election" in label]
          print("OFFICIAL_2024_GENERAL_LINKS",match)
          if not match:raise ValueError("No official Florida 2024 general precinct download link found; no substitute source accepted")
          url=match[0][1]
          if not (url.startswith("https://") and any(x in urllib.parse.urlsplit(url).netloc for x in ("dos.fl.gov","floridados.gov","blob.core.windows.net"))):
              raise ValueError("Source download host needs explicit state-file verification")
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 public elections original data"})
          with urllib.request.urlopen(req,timeout=50) as res:
              blob=res.read(15_000_001)
          if len(blob)>15_000_000 or not zipfile.is_zipfile(io.BytesIO(blob)):
              raise ValueError("Expected a state election-data ZIP below 15 MB")
          with zipfile.ZipFile(io.BytesIO(blob)) as zip:
              files=[(x.filename,x.file_size,x.compress_size) for x in zip.infolist() if not x.is_dir()]
              print("FL2024_ZIP_INVENTORY",json.dumps(files[:30]))
              if len(files)>100:raise ValueError("Unexpectedly many precinct dataset members")
              if files:
                  with zip.open(files[0][0]) as f:
                      print("FIRST_MEMBER_FIRST_250_BYTES",repr(f.read(250)))
          print("FLORIDA_2024_PRECINCT_ZIP_BYTES",len(blob),"SOURCE",url,"SHA256",hashlib.sha256(blob).hexdigest())
          totals=collections.Counter()
          lengths=collections.Counter()
          counties=set()
          rows=0
          bad_samples=[]
          precinct_sets=collections.defaultdict(set)
          county_vote_totals=collections.Counter()
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              for item in z.infolist():
                  if item.is_dir() or not re.fullmatch(r"[A-Z]{3}_PctResults20241105\.txt",item.filename):
                      continue
                  counties.add(item.filename[:3])
                  with z.open(item) as stream:
                      reader=csv.reader(io.TextIOWrapper(stream,encoding="utf-8-sig",errors="replace"),delimiter="\t")
                      for row in reader:
                          if not row:continue
                          rows+=1
                          lengths[len(row)]+=1
                          if len(row)<19: 
                              if len(bad_samples)<4: bad_samples.append(("too_few_columns",item.filename,len(row)))
                              continue
                          if row[11].strip()!="President and Vice President":continue
                          try:
                              votes=int(row[18].strip())
                          except (ValueError,IndexError):
                              if len(bad_samples)<4:bad_samples.append(("bad_votes",item.filename,repr(row[18])))
                              continue
                          if votes<0:raise ValueError("Negative precinct votes")
                          party=row[15].strip()
                          cand=row[14].strip()
                          totals[(party,cand)]+=votes
                          county_vote_totals[(row[1].strip().casefold(),party,cand)]+=votes
                          precinct_sets[item.filename[:3]].add(row[5].strip())
          print("PRECINCT_2024_FIELD_LENGTHS",dict(lengths))
          print("OFFICIAL_2024_COUNTIES",len(counties),"ROWS",rows,"PRESIDENTIAL_CONTEST_CANDIDATES",sorted((f"{party}|{cand}",v) for (party,cand),v in totals.items()))
          print("FIRST_CANDIDATE_DATA_ERRORS",bad_samples)
          print("PRECINCT_GROUPS_COUNT",sum(len(p) for p in precinct_sets.values()))
          if len(counties)!=67:raise ValueError("Not all 67 Florida original county files")
          from html.parser import HTMLParser
          class OfficialRows(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows=[]
                  self.active_row=None
                  self.active_cell=None
              def handle_starttag(self,tag,attrs):
                  if tag=="tr":
                      self.active_row=[]
                  if tag in ("th","td") and self.active_row is not None:
                      self.active_cell=[]
              def handle_data(self,data):
                  if self.active_cell is not None:
                      self.active_cell.append(data)
              def handle_endtag(self,tag):
                  if tag in ("th","td") and self.active_cell is not None and self.active_row is not None:
                      self.active_row.append(" ".join("".join(self.active_cell).split()))
                      self.active_cell=None
                  if tag=="tr" and self.active_row is not None:
                      if self.active_row:self.rows.append(self.active_row)
                      self.active_row=None
          official_url="https://results.elections.myflorida.com/DetailRpt.Asp?DATAMODE=&DIST=&ELECTIONDATE=11%2F5%2F2024&GRP=&PARTY=&RACE=PRE"
          req=urllib.request.Request(official_url,headers={"User-Agent":"Mozilla/5.0 original statewide certified election verification"})
          with urllib.request.urlopen(req,timeout=30) as response:
              official_html=response.read(600000).decode("utf-8",errors="replace")
          parser=OfficialRows();parser.feed(official_html)
          print("OFFICIAL_RESULTS_HTML_BYTES",len(official_html),"TABLE_ROWS",len(parser.rows))
          matching=[]
          diffs=[]
          county_names=set(k[0] for k in county_vote_totals)
          for row in parser.rows:
              if len(row)<3:continue
              county=row[0].casefold()
              if county not in county_names:continue
              try:
                  trump=int(row[1].replace(",",""));harris=int(row[2].replace(",",""))
              except ValueError:continue
              matching.append(county)
              got_t=county_vote_totals[(county,"REP","Trump / Vance")]
              got_h=county_vote_totals[(county,"DEM","Harris / Walz")]
              if (trump,harris)!=(got_t,got_h):
                  diffs.append({"county":county,"official_trump":trump,"zip_trump":got_t,
                                "official_harris":harris,"zip_harris":got_h})
          print("OFFICIAL_MATCHED_COUNTY_ROWS",len(matching),"COUNTY_DIFFS",json.dumps(diffs))
          if len(matching)!=67:raise ValueError("Official county comparisons did not cover all 67 Florida counties")
          if totals[("REP","Trump / Vance")]!=6_110_125 or totals[("DEM","Harris / Walz")]!=4_683_038:
              raise ValueError("Original 2024 precinct president totals do not reconcile to the Florida Division of Elections official statewide election totals")
          print("PRELIMINARY_OFFICIAL_2024_PRESIDENTIAL_RECONCILIATION_PASSED")

          PY
