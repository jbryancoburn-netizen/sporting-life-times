name: Newspaper static release audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - '**.json'
      - 'scripts/audit_site.py'
      - 'scripts/audit-dual-ring-colors.cjs'
      - 'scripts/audit-mbb-logo-system.cjs'
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - '**.json'
      - 'scripts/audit_site.py'
      - 'scripts/audit-dual-ring-colors.cjs'
      - 'scripts/audit-mbb-logo-system.cjs'
      - '.github/workflows/site-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static assets and data integrity
        run: python scripts/audit_site.py
      - name: Protect 628 nonwhite two-color team crests and 51 editions
        run: node scripts/audit-dual-ring-colors.cjs
      - name: Enforce 365 school roundel-aware logo contracts
        run: node scripts/audit-mbb-logo-system.cjs
      - name: JavaScript syntax in public assets
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 2 -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check
