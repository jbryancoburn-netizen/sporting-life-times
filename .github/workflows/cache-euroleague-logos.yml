name: EuroLeague Official Crest Cache
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cache-euroleague-logos.py'
      - '.github/workflows/cache-euroleague-logos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: euroleague-crest-asset-cache
  cancel-in-progress: false
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official PDF rasterizer
        run: python -m pip install --quiet 'pymupdf>=1.24,<2' 'Pillow>=10,<12'
      - name: Extract and certify 20 current-season club emblems
        run: |
          python scripts/cache-euroleague-logos.py
          python scripts/cache-euroleague-logos.py --check
      - name: Commit real club art into site assets
        run: |
          git config user.name 'sporting-life-times[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/euroleague-logos
          if git diff --cached --quiet; then echo 'All 20 team crests already current'; exit 0; fi
          git commit -m 'Cache official 2026-27 EuroLeague club logos for self-hosted scorecards'
          for pass in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then echo 'All original crests committed'; exit 0; fi
            sleep 3
          done
          exit 1
