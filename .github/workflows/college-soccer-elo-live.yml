name: NCAA college soccer Elo final-score newspaper refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/college-soccer-elo-live.yml'
      - 'scripts/update_college_soccer_elo.py'
      - 'scripts/audit_college_soccer_elo_parameters.py'
      - 'scripts/audit_college_soccer_score_corrections.py'
      - 'scripts/build_college_soccer_conference_projections.py'
      - 'scripts/build_college_soccer_ncaa_selection.py'
      - 'scripts/test_update_college_soccer_elo.py'
      - 'scripts/score_college_soccer_forecasts.py'
      - 'scripts/test_score_college_soccer_forecasts.py'
      - 'college-soccer.html'
      - 'college-soccer-predictions.js'
      - 'forecast-design.css'
      - 'scripts/publish_college_soccer_dynamic.py'
      - 'scripts/check_college_soccer_publication.py'
      - 'scripts/check_college_soccer_predictions_public.py'
      - 'scripts/college_soccer_fixture_source.py'
      - 'scripts/test_publish_college_soccer_dynamic.py'
      - 'data/college-soccer-dynamic-state.json'
      - 'data/college-soccer-prospective-v2.json'
      - 'data/college-soccer-prospective.json'
      - 'data/college-soccer-elo-baseline.json'
      - 'data/college-soccer-elo-final-ledger.json'

permissions:
  contents: write

concurrency:
  group: college-soccer-elo-newspaper
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      needs_deploy: ${{ steps.check-public.outputs.needs_deploy }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source parser and no-duplicate Elo replay
        run: python -m unittest discover -s scripts -p test_update_college_soccer_elo.py -v
      - name: Verify prospective forecast scoring
        run: python -m unittest discover -s scripts -p test_score_college_soccer_forecasts.py -v
      - name: Verify matchup draw probabilities and prior-day data isolation
        run: python -m unittest discover -s scripts -p test_publish_college_soccer_dynamic.py -v
      - name: Check new NCAA men's and women's final scores in all divisions
        run: python scripts/update_college_soccer_elo.py --lookback 4
      - name: Update provisional conference standings and postseason seeds
        run: python scripts/build_college_soccer_conference_projections.py
      - name: Update experimental NCAA selection forecast
        run: python scripts/build_college_soccer_ncaa_selection.py
      - name: Audit previously disputed soccer game scores
        run: python scripts/audit_college_soccer_score_corrections.py
      - name: Rebuild Elo parameter sensitivity audit
        run: python scripts/audit_college_soccer_elo_parameters.py
      - name: Lock new matchup-specific forecasts before kickoff
        run: python scripts/publish_college_soccer_dynamic.py
      - name: Score matchup-model forecasts against verified finals
        run: python scripts/score_college_soccer_forecasts.py --archive data/college-soccer-prospective-v2.json --output data/college-soccer-forecast-scores-v2.json
      - name: Score locked pregame forecasts against verified finals
        run: python scripts/score_college_soccer_forecasts.py
      - name: Validate JSON contract and published game evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          baseline=json.loads(Path('data/college-soccer-elo-baseline.json').read_text())
          current=json.loads(Path('data/college-soccer-elo.json').read_text())
          ledger=json.loads(Path('data/college-soccer-elo-final-ledger.json').read_text())
          audit=json.loads(Path('data/college-soccer-elo-live-audit.json').read_text())
          assert current['status']=='provisional'
          assert len(current['cohorts'])==6
          assert len({g['match_id'] for g in ledger['results']})==len(ledger['results'])
          assert audit['ledger_finals']==len(ledger['results'])
          assert current['as_of']>=baseline['as_of']
          assert current.get('applied_finals_since_baseline',0)==audit['applied_finals'] if ledger['results'] else audit['applied_finals']==0
          for cohort, rows in current['cohorts'].items():
              assert rows and len({r['team_id'] for r in rows})==len(rows)
              for i,row in enumerate(rows):
                  assert row['rank']==i+1
                  assert row['gp']==row['w']+row['l']+row['d']
                  if i: assert rows[i-1]['elo']>=row['elo']
          print('PASS: six-cohort provisional NCAA Elo, unique verified final IDs, valid GP and ranks')
          PY
      - name: Verify deterministic replay leaves no ratings drift
        run: |
          before="$(sha256sum data/college-soccer-elo.json | cut -d' ' -f1)"
          python scripts/update_college_soccer_elo.py --offline
          after="$(sha256sum data/college-soccer-elo.json | cut -d' ' -f1)"
          test "$before" = "$after"
          echo "PASS: replayed stored NCAA finals without changing Elo output"
      - name: Commit refreshed newspaper Elo only after validation
        shell: bash
        run: |
          set -euo pipefail
          git add data/college-soccer-score-correction-status.json data/college-soccer-elo-parameter-audit-latest.json data/college-soccer-ncaa-selection-forecast.json data/college-soccer-projected-standings.json data/college-soccer-elo-final-ledger.json data/college-soccer-elo.json data/college-soccer-elo-live-audit.json data/college-soccer-forecast-scores.json data/college-soccer-prospective-v2.json data/college-soccer-forecast-scores-v2.json data/college-soccer-forecast-source-audit.json
          if git diff --cached --quiet; then
            echo "No new verified NCAA finals or repairs. Published ratings unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh college soccer Elo from final NCAA scores"
          for try in 1 2 3; do
            if git push origin HEAD:main; then
              echo "New NCAA soccer Elo ratings published to newspaper repository"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            python scripts/update_college_soccer_elo.py --offline
            python scripts/build_college_soccer_conference_projections.py
            python scripts/score_college_soccer_forecasts.py
            python scripts/score_college_soccer_forecasts.py --archive data/college-soccer-prospective-v2.json --output data/college-soccer-forecast-scores-v2.json
            git add data/college-soccer-elo-final-ledger.json data/college-soccer-elo.json data/college-soccer-elo-live-audit.json data/college-soccer-forecast-scores.json data/college-soccer-prospective-v2.json data/college-soccer-forecast-scores-v2.json data/college-soccer-forecast-source-audit.json
            git diff --cached --quiet || git commit -m "Reconcile NCAA soccer ratings and forecast scores after rebase"
            python -m unittest discover -s scripts -p test_update_college_soccer_elo.py -q
            sleep 2
          done
          echo "Failed to publish audited NCAA soccer feed" >&2
          exit 1
      - name: Check whether public newspaper already serves these rankings
        id: check-public
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, os, urllib.request
          root='https://jbryancoburn-netizen.github.io/sporting-life-times'
          paths=['data/college-soccer-elo.json','college-soccer-elo.js','college-soccer-elo.css','college-soccer.html','data/college-soccer-prospective.json','data/college-soccer-forecast-scores.json','college-soccer-predictions.js','forecast-design.css','data/college-soccer-prospective-v2.json','data/college-soccer-forecast-scores-v2.json']
          differences=[]
          for path in paths:
              expected=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              try:
                  req=urllib.request.Request(root+'/'+path+'?verify='+str(os.getpid()),headers={
                      'Cache-Control':'no-cache','User-Agent':'SportingLifeTimes-PagesIntegrity/1.0'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      current=hashlib.sha256(response.read()).hexdigest()
              except Exception as exc:
                  print('Published asset check unavailable:',path,str(exc))
                  current=None
              if current!=expected:
                  differences.append(path)
          stale=bool(differences)
          print('Published college soccer desk is', 'STALE: '+', '.join(differences) if stale else 'CURRENT')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('needs_deploy='+('true' if stale else 'false')+'\n')
          PY

  deploy-updated-elo:
    name: Deploy verified NCAA Elo to the public newspaper
    needs: refresh
    if: needs.refresh.outputs.needs_deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact files before publishing
        run: |
          node --check college-soccer-elo.js
          node --check college-soccer-predictions.js
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/college-soccer-elo.json').read_text())
          assert len(d['cohorts'])==6 and d['status']=='provisional'
          html=Path('college-soccer.html').read_text()
          assert 'college-soccer-visual-desk.js' in html
          assert "data/college-soccer-elo.json" in Path('college-soccer-visual-desk.js').read_text()
          print('Source edition:',d['as_of'], 'accepted new finals:',d.get('applied_finals_since_baseline',0))
          PY
      - name: Verify published v2 forecast contract
        run: |
          python scripts/publish_college_soccer_dynamic.py --offline
          python scripts/score_college_soccer_forecasts.py --archive data/college-soccer-prospective-v2.json --output data/college-soccer-forecast-scores-v2.json
      - name: Add current source revision and Pages marker
        run: |
          git rev-parse HEAD > pages-build-sha.txt
          touch .nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: ncaa-soccer-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish edition via GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ncaa-soccer-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify live newspaper HTML, JS, CSS and Elo data bytes
        run: python scripts/check_college_soccer_publication.py --attempts 15 --delay 10
      - name: Verify live matchup draw probabilities and archive
        run: python scripts/check_college_soccer_predictions_public.py
