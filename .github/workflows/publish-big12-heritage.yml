name: Publish approved Big 12 heritage logos
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_big12_heritage.py'
      - '.github/workflows/publish-big12-heritage.yml'
permissions:
  contents: write
concurrency:
  group: publish-big12-heritage
  cancel-in-progress: false
jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13' 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Validate all ten selected historical assets before publication
        run: python scripts/import_big12_heritage.py
      - name: Validate local image references and renderer code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from subprocess import run
          from re import findall
          src=Path('mbb-logo-system.js').read_text()
          assert src.count('assets/cbb-big-12-1980s/')==10
          assert 'heritageBig12TeamIds' in src
          for path in findall(r'assets/cbb-big-12-1980s/[\w-]+\.png',src):
              p=Path(path)
              assert p.exists(),path
              with Image.open(p) as im:
                  im.verify()
          check=run(['node','--check','mbb-logo-system.js'])
          assert check.returncode==0
          print('PASS: 10 logos, valid renderer, all local files exist')
          PY
      - name: Publish approved assets atomically
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cbb-big-12-1980s/ mbb-logo-system.js data/cbb-big-12-heritage-audit.json '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Publish 10 approved self-hosted Big 12 retro logos for men and women"
            git push
          fi
