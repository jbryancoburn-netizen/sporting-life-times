name: NCAA broad historical preseason source recovery
on:
  push:
    paths:
      - 'data/ncaam-historical-preopening-source-candidates.json'
      - 'scripts/probe_ncaam_broad_preopening_sources.py'
      - '.github/workflows/ncaam-broad-preopening-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncaam-broad-source-recovery
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf
      - run: python -m py_compile scripts/probe_ncaam_broad_preopening_sources.py
      - run: python scripts/probe_ncaam_broad_preopening_sources.py
      - name: Ensure no false historical roster certification
        run: |
          python - <<'PY'
          import json
          a=json.load(open("data/ncaam-broad-preopening-source-probe.json"))
          assert a["summary"]["candidates"]>=7
          assert a["summary"]["verified_complete_historical_preopening_rosters"]==0
          assert all(not x["preopening_roster_verified"] for x in a["results"])
          print(a["summary"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncaa-independent-preopening-source-audit
          path: data/ncaam-broad-preopening-source-probe.json
      - name: Publish collected source diagnostics
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaam-broad-preopening-source-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish broad independent NCAA preseason media-source retrieval [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
