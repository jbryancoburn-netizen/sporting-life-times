name: NBL official player portrait cache
on:
  workflow_dispatch:
  schedule:
    - cron: '12 7 * * *'
  push:
    paths:
      - scripts/cache_nbl_player_photos.py
permissions:
  contents: write
concurrency:
  group: nbl-player-photos
  cancel-in-progress: false
jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/cache_nbl_player_photos.py
      - name: Commit verified portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nbl-player-photos/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cache verified official NBL player portraits [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
