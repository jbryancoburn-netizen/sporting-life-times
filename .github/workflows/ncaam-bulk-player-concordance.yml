name: NCAA bulk historical player concordance
on:
  push:
    paths:
      - 'scripts/match_ncaam_bulk_historical_players.py'
      - 'scripts/test_ncaam_bulk_name_variants.py'
      - 'scripts/triage_ncaam_historical_name_gaps.py'
      - 'data/ncaam-historical-bulk-player-reconciliation.json'
      - '.github/workflows/ncaam-bulk-player-concordance.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncaam-bulk-player-concordance
  cancel-in-progress: false
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/match_ncaam_bulk_historical_players.py
      - run: python -m unittest discover -s scripts -p test_ncaam_bulk_name_variants.py -v
      - run: python scripts/match_ncaam_bulk_historical_players.py
      - run: python scripts/triage_ncaam_historical_name_gaps.py
      - run: |
          python - <<'PY'
          import json
          d=json.load(open("data/ncaam-historical-player-concordance.json"))
          source=json.load(open("data/ncaam-historical-bulk-player-reconciliation.json"))
          assert d["summary"]["extracted_names"]==source["filtered_name_mentions"]
          assert d["summary"]["matched_to_historical_ncaa_season_rosters"]<=source["filtered_name_mentions"]
          assert d["source_roster_timing_verified"] is False
          assert d["preopening_production_approved"] is False
          triage=json.load(open("data/ncaam-historical-name-gap-triage.json"))
          assert triage["summary"]["source_unmatched"]==d["summary"]["unmatched"]
          summary=d["summary"]
          rows=d["results"]
          assert summary["school_seasons"]==len(rows)
          assert summary["extracted_names"]==sum(r["extracted_names"] for r in rows)
          assert summary["matched_to_historical_ncaa_season_rosters"]==sum(r["ncaa_matched_names"] for r in rows)
          assert summary["unmatched"]==sum(len(r["unmatched_names"]) for r in rows)
          assert summary["unmatched"]+summary["matched_to_historical_ncaa_season_rosters"]==summary["extracted_names"]
          assert all(r["ncaa_matched_names"]+len(r["unmatched_names"])==r["extracted_names"] for r in rows)
          assert all(r["exact_matches"]+r["unique_suffix_matches"]==r["ncaa_matched_names"] for r in rows)
          assert all(r["preopening_membership_certified"] is False for r in rows)
          assert len({(r["school"],r["season_end_year"]) for r in rows})==len(rows)
          assert triage["summary"]["unmatched_on_team_without_name_alignment"]+triage["summary"]["unmatched_on_aligned_team"]+triage["summary"]["explicit_staff_title_candidates"]==summary["unmatched"]
          print("PASS: bulk name matching fully reconciled; preseason approval correctly blocked")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncaam-bulk-player-concordance
          path: |
            data/ncaam-historical-player-concordance.json
            data/ncaam-historical-name-gap-triage.json
      - name: Publish historical NCAA player matching
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaam-historical-player-concordance.json data/ncaam-historical-name-gap-triage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish all-school historical player name concordance [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
