name: MBB first 100 opponent identity repair
on:
  push:
    paths:
      - '.github/workflows/mbb-first-100-opponent-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/mbb_first_100_logo_repair.py
      - name: Commit corrected schedule identifiers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-schedules-2026-27 data/mbb-first-100-opponent-logo-repair-20261027.json
          if ! git diff --cached --quiet; then
            git commit -m "Repair first 100 MBB opponent logo IDs with exact crosswalk matches"
            git push
          fi
