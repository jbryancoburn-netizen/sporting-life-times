name: Build certified CBB heritage medallion assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_cbb_heritage_medallions.py'
      - '.github/workflows/build-cbb-heritage-medallions.yml'
permissions:
  contents: write
concurrency:
  group: cbb-baked-heritage-pngs
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - name: Build medallion PNGs from verified local school artwork and colors
        run: python scripts/build_cbb_heritage_medallions.py
      - name: Audit real output dimensions, color rings and all source identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          r=json.loads(Path('data/cbb-heritage-medallions-audit.json').read_text())
          assert r['rendered_count']>=75 and r['rendered_count']==r['source_count']
          assert len(set(x['espn_id'] for x in r['records']))==len(r['records'])
          for e in r['records']:
              with Image.open(e['asset']) as im:
                  assert im.size==(512,512) and im.mode=='RGBA'
                  assert im.getpixel((6,256))[:3] != im.getpixel((25,256))[:3]
                  assert Path(e['source']).exists()
          print('PASS: all baked historic crests have exactly two real school-color rings')
          PY
      - name: Commit only audited PNGs and proof, leaving original historical art untouched
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cbb-heritage-medallions data/cbb-heritage-medallions-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish certified two-ring CBB heritage crest PNG assets'
            git push origin HEAD:main
          fi
