name: College basketball national news refresh
on:
  pull_request:
    paths:
      - 'scripts/refresh_cbb_national_news.py'
      - 'scripts/refresh_cbb_247sports.py'
      - 'cbb-247sports.js'
      - 'data/cbb-247sports-team-sites.json'
      - 'scripts/verify_cbb_news.py'
      - 'scripts/test_cbb_news_quality.py'
      - 'cbb-front-news.js'
      - 'cbb-chronicle-retro.js'
      - 'cbb-chronicle.css'
      - 'cbb-shared-navigation.js'
      - 'tests/cbb-chronicle-editorial.test.cjs'
      - 'ncaam.html'
      - '.github/workflows/cbb-national-news.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_cbb_national_news.py'
      - 'scripts/refresh_cbb_247sports.py'
      - 'cbb-247sports.js'
      - 'data/cbb-247sports-team-sites.json'
      - 'scripts/verify_cbb_news.py'
      - 'scripts/test_cbb_news_quality.py'
      - 'cbb-front-news.js'
      - 'cbb-chronicle-retro.js'
      - 'cbb-chronicle.css'
      - 'cbb-shared-navigation.js'
      - 'tests/cbb-chronicle-editorial.test.cjs'
      - 'ncaam.html'
      - '.github/workflows/cbb-national-news.yml'
  workflow_dispatch:
  # GitHub schedule triggers are best-effort under heavy Actions load.
  # Independent successful publishers also wake the dedicated CBB newsroom.
  workflow_run:
    workflows:
      - 'MBB newspaper refresh and publish'
      - 'News wire refresh'
    types: [completed]
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: cbb-national-news-refresh
  cancel-in-progress: false
jobs:
  quality:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify news collector, checker, and renderer syntax
        run: |
          python -m py_compile scripts/refresh_cbb_247sports.py scripts/refresh_cbb_national_news.py scripts/verify_cbb_news.py scripts/test_cbb_news_quality.py
          node --check cbb-247sports.js
          node --check cbb-front-news.js
          node --check cbb-chronicle-retro.js
          node --check cbb-shared-navigation.js
      - name: Test newsroom classification and editorial selection
        run: python -m unittest discover -s scripts -p 'test_cbb_news_quality.py' -v
      - name: Preserve tested independent news fallback on the live editions
        run: node tests/cbb-front-news.test.cjs
      - name: Test Chronicle editorial layout, native identities, and RETRO isolation
        run: node tests/cbb-chronicle-editorial.test.cjs
      - name: Smoke-test real RSS sources before release (without publishing)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/refresh_cbb_national_news.py
          python scripts/verify_cbb_news.py
  refresh:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch national men's and women's basketball news
        id: national
        continue-on-error: true
        run: python scripts/refresh_cbb_national_news.py
      - name: Verify both editions, relevance, provenance, diversity, and freshness
        if: steps.national.outcome == 'success'
        id: national-check
        continue-on-error: true
        run: python scripts/verify_cbb_news.py
      - name: Refresh 247Sports school headlines
        id: school
        continue-on-error: true
        run: python scripts/refresh_cbb_247sports.py
      - name: Verify fresh 247Sports collection and usable headlines
        if: steps.school.outcome == 'success'
        id: school-check
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          data = json.loads(Path('data/cbb-247sports-headlines.json').read_text())
          now = datetime.now(timezone.utc)
          updated = datetime.fromisoformat(data['updated_at'].replace('Z', '+00:00'))
          age = (now - updated).total_seconds() / 60
          if not -5 <= age <= 20:
              raise SystemExit(f'247Sports collection stale: {age:.0f} minutes old')
          articles = data.get('articles', [])
          if not isinstance(articles, list) or not articles:
              raise SystemExit('247Sports collection has no usable headlines')
          print(f'247Sports collection verified: {len(articles)} articles, age {age:.1f} min')
          PY
      - name: Publish updated basketball news
        env:
          SCHOOL_VERIFIED: ${{ steps.school-check.outcome }}
          NATIONAL_VERIFIED: ${{ steps.national-check.outcome }}
        run: |
          git config user.name sporting-life-times-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          snapshots=$(mktemp -d)
          trap 'rm -rf "$snapshots"' EXIT
          if [ "$SCHOOL_VERIFIED" = success ]; then
            cp data/cbb-247sports-headlines.json "$snapshots/"
          else
            echo "::warning::247Sports unavailable; retaining the last verified school wire"
          fi
          if [ "$NATIONAL_VERIFIED" = success ]; then
            cp data/cbb-national-news.json "$snapshots/"
          else
            echo "::warning::National wire unavailable; retaining the last verified national wire"
          fi
          if [ "$SCHOOL_VERIFIED" != success ] && [ "$NATIONAL_VERIFIED" != success ]; then
            echo "::error::Neither basketball news feed passed verification"
            exit 1
          fi
          git restore -- data/cbb-247sports-headlines.json data/cbb-national-news.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout --detach FETCH_HEAD
            # These are whole feed snapshots. Compare their timestamps against
            # the latest main instead of merging generated JSON line by line.
            python - "$snapshots" <<'PY'
          from datetime import datetime
          import json
          from pathlib import Path
          import sys

          def updated_at(path):
              return datetime.fromisoformat(json.loads(path.read_bytes())['updated_at'])

          for snapshot in Path(sys.argv[1]).glob('*.json'):
              target = Path('data') / snapshot.name
              try:
                  current = updated_at(target)
              except (OSError, ValueError, TypeError, KeyError):
                  current = None
              if current is None or updated_at(snapshot) > current:
                  target.write_bytes(snapshot.read_bytes())
          PY
            git add data/cbb-247sports-headlines.json data/cbb-national-news.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh verified college basketball news"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
