name: Verify WBB University Schedules in Bulk
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wbb-official-school-batch.yml'
permissions:
  contents: write
concurrency:
  group: wbb-university-batch-research
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schedule-table reader
        run: python -m pip install --quiet beautifulsoup4
      - name: Validate source verifier
        run: python -m py_compile scripts/wbb-verify-university-batch.py
      - name: Verify 363 women's calendars against official women's university sites in three independent batches
        run: |
          for batch in 0 1 2; do
            echo "Official women's university schedule batch $batch"
            python scripts/wbb-verify-university-batch.py --batch "$batch" --size 125 || echo "Batch $batch has limited verified coverage; preserving its detailed audit"
          done
      - name: Publish provenance and discrepancy audit (no guessed corrections)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaaw-official-school-verification-batch-*.json data/ncaaw-official-school-verification-audit-batch-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verify women's NCAA calendars against 363 official university schedule sources"
          for n in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep 2
          done
          exit 1
