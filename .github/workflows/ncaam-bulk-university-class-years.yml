name: NCAA bulk university roster recovery
on:
  push:
    paths:
      - scripts/collect_ncaam_school_class_years_bulk.py
      - data/ncaam-2026-27-official-roster-urls.json
      - data/ncaam-2026-27-next-900-unclassified-targets.json
      - .github/workflows/ncaam-bulk-university-class-years.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncaam-bulk-university-rosters
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/collect_ncaam_school_class_years_bulk.py --queue data/ncaam-2026-27-next-900-unclassified-targets.json
      - name: Commit matched records and source audit
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/ncaam-2026-27-school-roster-class-years.csv data/ncaam-2026-27-official-bulk-recovery-report.json
          git diff --cached --quiet || git commit -m "Collect university verified NCAA class year records"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ncaam-university-bulk-roster-evidence
          path: data/ncaam-2026-27-official-bulk-recovery-report.json
