name: MBB recover reciprocal official sites
on:
  push:
    paths:
      - '.github/workflows/mbb-reciprocal-official-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/mbb_reciprocal_official_recovery.py
      - name: Publish official reciprocal corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-schedules-2026-27/ data/mbb-reciprocal-official-recovery.json
          if ! git diff --cached --quiet; then
            git commit -m "Recover sites from matching verified opponent university schedules"
            git pull --rebase origin main
            git push
          fi
