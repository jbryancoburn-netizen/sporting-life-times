name: Fit larger Purdue Pete in round crest (one-off)
on:
  push:
    branches:
      - fix/purdue-pete-optical-size-v6-20261114
    paths:
      - scripts/refine_purdue_optical_v6.py
      - .github/workflows/one-off-purdue-optical-v6.yml
permissions:
  contents: write
jobs:
  fit-pete:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster tools
        run: python -m pip install 'pillow>=10,<12'
      - name: Enlarge historic mascot by circle-optimized source framing
        run: python scripts/refine_purdue_optical_v6.py
      - name: Verify whole silhouette, ring margin and original gallery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          r=json.loads(Path('reports/purdue-pete-optical-size-v6.json').read_text())
          a,b=r['before'],r['after']
          assert b['long_side_px'] >= 350, (a,b)
          assert b['long_side_px'] > a['long_side_px']*1.07
          assert b['ring_margin_px'] >= 8.0
          assert b['radial_ink_max_px'] <= 230
          assert b['visual_center_offset_px'] <= 28
          with Image.open('assets/cbb-big-ten-1980s/centered/purdue.png') as image:
            assert image.size == (512,512)
          html=Path('cbb-big-ten-1980s-preview.html').read_text()
          assert html.count('purdue.png?v=20261114-pete-optical-v6') == 2
          assert html.count('<img src="assets/cbb-big-ten-1980s/centered/') == 14
          assert '--slt-ink-' not in html
          print('PASS: Purdue artwork enlarged by >=7%, radial gap>=8px, no CSS/JS overrides')
          PY
      - name: Commit validated local source PNG on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cbb-big-ten-1980s-preview.html assets/cbb-big-ten-1980s/centered/purdue.png reports/purdue-pete-optical-size-v6.json
          if ! git diff --cached --quiet; then
            git commit -m 'Enlarge authentic Purdue Pete by circle-aware optical centering'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
