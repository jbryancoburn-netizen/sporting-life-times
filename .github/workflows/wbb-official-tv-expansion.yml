name: Women's NCAA Official TV Source Expansion
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wbb-official-tv-expansion.yml'
      - 'scripts/wbb-import-official-tv.py'
      - 'data/ncaaw-2026-27-official-tv-research.json'
permissions:
  contents: write
concurrency:
  group: wbb-official-tv-expansion
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate cited women's research importer
        run: python -m py_compile scripts/wbb-import-official-tv.py
      - name: Exact-match official conference and school television listings
        run: python scripts/wbb-import-official-tv.py
      - name: Replicate official TV evidence to all 363 women's school schedules
        run: python scripts/wbb-reconcile-schedule-evidence.py
      - name: Enforce preservation of historical official TV evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("data/ncaaw-schedules-2026-27-audit.json").read_text())
          b=json.loads(Path("data/ncaaw-2026-27-official-tv-research-audit.json").read_text())
          assert a["programs"]==363
          assert a["official_broadcast_unique_games"]>=135
          assert a["official_broadcast_unique_games"]==b["official_unique_games"]
          assert b["matched_new_official_game_ids"]>=12
          rule=b["conference_media_rule_audit"].get("Atlantic 10 Conference",{})
          assert rule.get("conference_games_validated")==126
          assert rule.get("streaming_games_generated",0)>=90
          american=b["conference_media_rule_audit"].get("American Conference",{})
          assert american.get("conference_games_validated")==117
          assert american.get("streaming_games_covered")==115
          assert american.get("streaming_games_previously_explicit")==18
          assert american.get("streaming_games_generated")==97
          assert american.get("national_linear_tv_games")==1
          assert american.get("unresolved_network_exclusions")==1
          assert american.get("conflicting_prior_games")==0
          assert a["cross_school_date_venue_identity_conflicts"]==0
          print("Officially broadcast unique games:",a["official_broadcast_unique_games"])
          print("Newly official source-matched games:",b["matched_new_official_game_ids"])
          print("Remaining TV team entries:",a["missing_broadcast"])
          PY
      - name: Publish independently matched official women's television evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaaw-2026-27-official-broadcast-overrides.json data/ncaaw-2026-27-official-tv-research-audit.json
          git add data/ncaaw-schedules-2026-27.json data/ncaaw-schedules-2026-27-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish source-verified Big 12 and Florida Atlantic women's broadcast assignments"
          for n in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep 2
          done
          exit 1
