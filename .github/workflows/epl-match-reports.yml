name: EPL detailed match reports
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_epl_match_reports.py'
      - '.github/workflows/epl-match-reports.yml'
      - 'data/epl-match-center.json'
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: epl-match-reports
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate report collector
        run: python -m py_compile scripts/update_epl_match_reports.py
      - name: Collect match reports
        run: python scripts/update_epl_match_reports.py
      - name: Verify published report structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/epl-match-reports.json').read_text())
          assert d.get('matches'), 'No match reports produced'
          for key,match in d['matches'].items():
              assert str(key).isdecimal() and all(k in match for k in ('home','away','home_score','away_score','source_url'))
              assert any(match.get(k) for k in ('teams','players','events')), 'Details missing for '+key
          print('Verified detailed reports:',len(d['matches']))
          PY
      - name: Publish verified details
        run: |
          git config user.name "sporting-life-times-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epl-match-reports.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified EPL match reports"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Record report collection heartbeat
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
          TRIGGER: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,datetime,pathlib
          p=pathlib.Path("data/epl-match-report-status.json")
          p.write_text(json.dumps({"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"job_status":os.getenv("RUN_STATUS"),"trigger":os.getenv("TRIGGER"),"run_id":os.getenv("RUN_ID")},indent=2)+chr(10))
          PY
          git config user.name "sporting-life-times-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epl-match-report-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record EPL match report pipeline status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
