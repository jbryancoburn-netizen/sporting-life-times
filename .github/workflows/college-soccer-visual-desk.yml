name: NCAA Soccer Visual Desk Checks
on:
  push:
    branches: [main]
    paths:
      - 'college-soccer-visual-desk.js'
      - 'college-soccer-visual-desk.css'
      - 'college-soccer.html'
      - 'college-soccer-search.css'
      - 'college-soccer-editorial.js'
      - 'college-soccer-editorial.css'
      - 'college-soccer-match.html'
      - 'college-soccer-match.js'
      - 'college-soccer-match.css'
      - 'data/college-soccer-elo.json'
      - 'data/college-soccer-prospective-v2.json'
      - '.github/workflows/college-soccer-visual-desk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate visual desk JavaScript
        run: |
          node --check college-soccer-visual-desk.js
          node --check college-soccer-editorial.js
          node --check college-soccer-match.js
      - name: Audit real data and published page
        run: |
          node <<'NODE'
          const fs=require('fs'), assert=require('node:assert/strict');
          const html=fs.readFileSync('college-soccer.html','utf8');
          assert(html.includes('id="college-soccer-visual-desk"'));
          assert(html.includes('id="college-soccer-editorial"'));
          assert(html.includes('id="college-team-search"'));
          assert(html.includes('college-soccer-search.css?v=restore1'));
          assert.equal((html.match(/id="college-team-search"/g)||[]).length,1,'Exactly one school search input');
          assert(html.indexOf('id="college-team-finder"') < html.indexOf('class="hub-nav"'),'School finder must be above newspaper section navigation');
          assert(html.includes('class="college-search-field"'));
          assert(fs.readFileSync('college-soccer-search.css','utf8').includes('visibility:visible!important'));
          assert(fs.readFileSync('college-soccer-teams.js','utf8').includes("search.addEventListener('input',render)"));
          assert(html.indexOf('id="college-team-finder"') < html.indexOf('id="college-soccer-visual-desk"'),'School search must precede visual matchday desk');
          assert(html.includes('college-soccer-editorial.js?v=phase3'));
          assert(html.includes('college-soccer-editorial.css?v=phase4'));
          assert(!html.includes('id="college-soccer-elo"'));
          assert(!html.includes('id="college-soccer-predictions"'));
          assert(!html.includes('college-soccer-elo.js'));
          assert(!html.includes('college-soccer-predictions.js'));
          assert(fs.readFileSync('college-soccer-visual-desk.js','utf8').includes('www.ncaa.com/sites/default/files/images/logos/schools/bgl/'));
          assert(fs.readFileSync('college-soccer-visual-desk.js','utf8').includes('cs-score-tile'));
          assert(html.includes('college-soccer-visual-desk.js?v=match1'));
          assert(html.includes('college-soccer-visual-desk.css?v=phase5'));
          const matchPage=fs.readFileSync('college-soccer-match.html','utf8');
          const deskJs=fs.readFileSync('college-soccer-visual-desk.js','utf8');
          assert(matchPage.includes('id="cs-match-view"'));
          assert(matchPage.includes('college-soccer-match.js?v=4'));
          assert(deskJs.includes("college-soccer-match.html?game="),'Result rail and forecasts must link to match center');
          assert(deskJs.includes("tile.href='college-soccer-match.html?game="),'Recent finals must open details');
          const matchJs=fs.readFileSync('college-soccer-match.js','utf8');
          assert(matchJs.includes("data/college-soccer-elo-final-ledger.json"));
          assert(matchJs.includes("data/college-soccer-prospective-v2.json"));
          assert(matchJs.includes('Goals scored per match'));
          assert(matchJs.includes('Goals allowed per match'));
          assert(matchJs.includes('data/college-soccer-team-game-index.json'));
          assert(matchJs.includes('Recent verified results'));
          assert(matchJs.includes("g.status==='final'"));
          assert(matchPage.includes('college-soccer-match.css?v=3'));
                    const elo=JSON.parse(fs.readFileSync('data/college-soccer-elo.json','utf8'));
          const forecast=JSON.parse(fs.readFileSync('data/college-soccer-prospective-v2.json','utf8'));
          for(const sex of ['men','women'])for(const division of [1,2,3]){
            const cohort=sex+'-d'+division, teams=elo.cohorts[cohort];
            assert(Array.isArray(teams)&&teams.length>=10,'Missing cohort '+cohort);
            assert(teams.every(t=>Number.isFinite(t.elo)&&Number.isFinite(t.gf)&&Number.isFinite(t.ga)&&Number.isFinite(t.gp)));
            assert.equal(new Set(teams.map(t=>t.team_id)).size,teams.length,'Duplicate school IDs in '+cohort);
          }
          assert(Array.isArray(elo.latest_finals));
          for(const game of elo.latest_finals){
            assert(game.match_id && game.cohort && game.source_game && /^\\d+[-–]\\d+$/.test(game.score));
          }
          const ledger=JSON.parse(fs.readFileSync('data/college-soccer-elo-final-ledger.json','utf8'));
          assert(Array.isArray(ledger.results));
          assert.equal(new Set(ledger.results.map(g=>g.match_id)).size,ledger.results.length);
          for(const g of ledger.results){
            assert(g.match_id && g.source_game && Number.isInteger(g.home_goals) && Number.isInteger(g.away_goals));
            const candidates=Object.entries(elo.cohorts).filter(([k,rows])=>k.startsWith(g.gender+'-') && rows.some(t=>t.team_id===g.home_team) && rows.some(t=>t.team_id===g.away_team));
            assert(candidates.length>0,'Cannot resolve both teams for '+g.match_id);
          }
                    assert(Array.isArray(forecast.forecasts));
          for(const g of forecast.forecasts){
            assert(g.match_id && g.kickoff_utc && g.source_game);
            const p=Number(g.p_home)+Number(g.p_draw)+Number(g.p_away);
            assert(Math.abs(p-1)<0.002,'Probabilities do not sum to one');
          }
          console.log('Visual desk validated against six published rating cohorts and locked forecast probabilities.');
          NODE
