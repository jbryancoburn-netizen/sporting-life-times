name: NCAA Soccer Visual Desk Checks
on:
  push:
    branches: [main]
    paths:
      - 'college-soccer-visual-desk.js'
      - 'college-soccer-visual-desk.css'
      - 'college-soccer.html'
      - 'college-soccer-search.css'
      - 'college-soccer-editorial.js'
      - 'college-soccer-editorial.css'
      - 'college-soccer-match.html'
      - 'college-soccer-match.js'
      - 'college-soccer-match.css'
      - 'college-soccer-postseason.js'
      - 'college-soccer-postseason.css'
      - 'college-soccer-cciw.js'
      - 'college-soccer-cciw.css'
      - 'college-soccer-women-miaa.js'
      - 'college-soccer-women-miaa.css'
      - 'college-soccer-conference-index.js'
      - 'college-soccer-conference-index.css'
      - 'college-soccer-cup-ui.js'
      - 'college-soccer-cup-ui.css'
      - 'data/college-soccer-miaa-women-standings.json'
      - 'scripts/update_college_soccer_miaa_women_standings.py'
      - 'scripts/test_college_soccer_miaa_women_standings.py'
      - 'data/college-soccer-cciw-standings.json'
      - 'scripts/test_college_soccer_cciw_standings.py'
      - 'scripts/test_college_soccer_postseason.py'
      - 'data/college-soccer-postseason-rules.json'
      - 'data/college-soccer-conferences.json'
      - 'data/college-soccer-miaa-standings.json'
      - 'data/college-soccer-miac-standings.json'
      - 'scripts/update_college_soccer_miac_standings.py'
      - 'scripts/test_college_soccer_miac_standings.py'
      - 'data/college-soccer-elo.json'
      - 'data/college-soccer-prospective-v2.json'
      - '.github/workflows/college-soccer-visual-desk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate visual desk JavaScript
        run: |
          node --check college-soccer-visual-desk.js
          node --check college-soccer-editorial.js
          node --check college-soccer-match.js
          node --check college-soccer-postseason.js
          node --check college-soccer-cciw.js
          node --check college-soccer-women-miaa.js
          node --check college-soccer-conference-index.js
          node --check college-soccer-cup-ui.js
      - name: Validate NCAA postseason rules and normalized MIAA probabilities
        run: python -m unittest discover -s scripts -p test_college_soccer_postseason.py -v
      - name: Validate MIAC collector parsing
        run: |
          python -m pip install beautifulsoup4
          python -m unittest discover -s scripts -p test_college_soccer_miac_standings.py -v
      - name: Validate CCIW standings collector and tournament math
        run: |
          python -m pip install beautifulsoup4
          python -m unittest discover -s scripts -p test_college_soccer_cciw_standings.py -v
      - name: Verify women's MIAA official standings parser
        run: |
          python -m pip install beautifulsoup4
          python -m unittest discover -s scripts -p test_college_soccer_miaa_women_standings.py -v
      - name: Audit real data and published page
        run: |
          node <<'NODE'
          const fs=require('fs'), assert=require('node:assert/strict');
          const html=fs.readFileSync('college-soccer.html','utf8');
          assert(html.includes('id="college-soccer-visual-desk"'));
          assert(html.includes('id="college-soccer-editorial"'));
          assert(html.includes('id="college-team-search"'));
          assert(html.includes('college-soccer-search.css?v=restore1'));
          assert.equal((html.match(/id="college-team-search"/g)||[]).length,1,'Exactly one school search input');
          assert(html.indexOf('id="college-team-finder"') < html.indexOf('class="hub-nav"'),'School finder must be above newspaper section navigation');
          assert(html.includes('class="college-search-field"'));
          assert(fs.readFileSync('college-soccer-search.css','utf8').includes('visibility:visible!important'));
          assert(fs.readFileSync('college-soccer-teams.js','utf8').includes("search.addEventListener('input',render)"));
          assert(html.indexOf('id="college-team-finder"') < html.indexOf('id="college-soccer-visual-desk"'),'School search must precede visual matchday desk');
          assert(html.includes('college-soccer-editorial.js?v=results1'));
          assert(html.includes('college-soccer-editorial.css?v=results1'));
          assert(!html.includes('id="college-soccer-elo"'));
          assert(!html.includes('id="college-soccer-predictions"'));
          assert(!html.includes('college-soccer-elo.js'));
          assert(!html.includes('college-soccer-predictions.js'));
          assert(fs.readFileSync('college-soccer-visual-desk.js','utf8').includes('www.ncaa.com/sites/default/files/images/logos/schools/bgl/'));
          assert(fs.readFileSync('college-soccer-visual-desk.js','utf8').includes('cs-score-tile'));
          assert(html.includes('college-soccer-visual-desk.js?v=reconcile1'));
          assert(html.includes('college-soccer-visual-desk.css?v=reconcile1'));
          const matchPage=fs.readFileSync('college-soccer-match.html','utf8');
          const deskJs=fs.readFileSync('college-soccer-visual-desk.js','utf8');
          assert(matchPage.includes('id="cs-match-view"'));
          assert(matchPage.includes('college-soccer-match.js?v=4'));
          assert(deskJs.includes("college-soccer-match.html?game="),'Result rail and forecasts must link to match center');
          assert(deskJs.includes("tile.href='college-soccer-match.html?game="),'Recent finals must open details');
          const matchJs=fs.readFileSync('college-soccer-match.js','utf8');
          assert(matchJs.includes("data/college-soccer-elo-final-ledger.json"));
          assert(matchJs.includes("data/college-soccer-prospective-v2.json"));
          assert(matchJs.includes('Goals scored per match'));
          assert(matchJs.includes('Goals allowed per match'));
          assert(matchJs.includes('data/college-soccer-team-game-index.json'));
          assert(matchJs.includes('Recent verified results'));
          assert(matchJs.includes("g.status==='final'"));
          assert(matchPage.includes('college-soccer-match.css?v=3'));
                    assert(html.includes('id="college-soccer-postseason"'));
          assert(html.includes('college-soccer-postseason.js?v=bracket8'));
          assert(html.includes('college-soccer-postseason.css?v=launch3'));
          assert(html.indexOf('id="college-team-search"')<html.indexOf('id="college-soccer-postseason"'),'School finder displaced');
          assert(html.includes('id="college-soccer-cciw"'));
          assert(html.includes('college-soccer-cciw.js?v=bracket3'));
          assert(html.includes('college-soccer-cciw.css?v=1'));
          const cciw=JSON.parse(fs.readFileSync('data/college-soccer-cciw-standings.json','utf8'));
          const cciwScript=fs.readFileSync('college-soccer-cciw.js','utf8');
          assert(cciwScript.includes('Bracket probability normalization failed'));
          assert(cciwScript.includes('Not calibrated tournament odds'));
          assert.equal(cciw.rows.length,9);
          assert.equal(new Set(cciw.rows.map(r=>r.team_id)).size,9);
          for(const row of cciw.rows){
            const [wins,losses,draws=0]=row.conference_record.split('-').map(Number);
            assert.equal(wins*3+draws,row.conference_points,'Bad CCIW points for '+row.team_id);
            assert.equal(wins+losses+draws,row.conference_games,'Bad CCIW GP for '+row.team_id);
          }
                    const women=JSON.parse(fs.readFileSync('data/college-soccer-miaa-women-standings.json','utf8'));
          assert(html.includes('id="college-soccer-women-miaa"'));
          assert(html.includes('id="college-soccer-conference-index"'));
          assert(html.includes('college-soccer-conference-index.js?v=coverage2'));
          assert(html.includes('college-soccer-conference-index.css?v=coverage2'));
          assert(html.indexOf('id="college-team-search"')<html.indexOf('id="college-soccer-conference-index"'));
          const directory=fs.readFileSync('college-soccer-conference-index.js','utf8');
          assert(directory.includes("'men-d3:miaa'"));
          assert(directory.includes("'men-d3:miac'"));
          assert(directory.includes("'men-d3:cciw'"));
          assert(directory.includes("'women-d3:miaa'"));
          assert(html.includes('college-soccer-women-miaa.js?v=bracket4'));
          assert(html.includes('college-soccer-women-miaa.css?v=1'));
          assert.equal(women.rows.length,9);
          assert.deepEqual(new Set(women.rows.map(r=>r.team_id)),new Set(JSON.parse(fs.readFileSync('data/college-soccer-conferences.json','utf8')).conferences['women-d3:miaa'].teams));
          for(const row of women.rows){
             const [w,l,d=0]=row.conference_record.split('-').map(Number);
             assert.equal(3*w+d,row.conference_points,'Invalid women MIAA points');
          }
                    assert(html.includes('college-soccer-cup-ui.js?v=2'));
          assert(html.includes('college-soccer-cup-ui.css?v=2'));
          assert(html.indexOf('college-soccer-cup-ui.js?v=2')<html.indexOf('college-soccer-postseason.js?v=bracket8'));
          assert(html.indexOf('college-soccer-cup-ui.js?v=2')<html.indexOf('college-soccer-cciw.js?v=bracket3'));
          const shared=fs.readFileSync('college-soccer-cup-ui.js','utf8');
          assert(shared.includes('cs-cup-bracket'));
          assert(shared.includes('ncaa.com/sites/default/files/images/logos/schools/bgl/'));
          const mjs=fs.readFileSync('college-soccer-postseason.js','utf8');
          const cjs=fs.readFileSync('college-soccer-cciw.js','utf8');
          const wjs=fs.readFileSync('college-soccer-women-miaa.js','utf8');
          for(const src of [mjs,cjs,wjs]){
            assert(src.includes('cupUI.bracket('),'Missing shared bracket');
            assert(src.includes('cupUI.decorateTable('),'Missing school crests');
          }
                    const tournamentRules=JSON.parse(fs.readFileSync('data/college-soccer-postseason-rules.json','utf8'));
          const conf=JSON.parse(fs.readFileSync('data/college-soccer-conferences.json','utf8'));
          const miaa=JSON.parse(fs.readFileSync('data/college-soccer-miaa-standings.json','utf8'));
          assert.equal(tournamentRules.ncaa['men-d1'].field,48);
          assert.equal(tournamentRules.ncaa['women-d1'].field,64);
          assert.equal(tournamentRules.ncaa['men-d1'].seeded_teams,24);
          assert.equal(tournamentRules.conferences['men-d3:miaa'].tournament.field,6);
          assert.equal(tournamentRules.conferences['women-d3:miaa'].tournament.field,6);
          const members=conf.conferences['men-d3:miaa'].teams;
          assert.equal(members.length,8);
          assert.equal(new Set(members).size,8);
          assert.deepEqual(new Set(miaa.rows.map(r=>r.team_id)),new Set(members));
          assert(miaa.checked_at_utc || miaa.checked_date,'Missing MIAA table check date');
          const miac=JSON.parse(fs.readFileSync('data/college-soccer-miac-standings.json','utf8'));
          const miacMembers=conf.conferences['men-d3:miac'].teams;
          assert.equal(miacMembers.length,11);
          assert.equal(new Set(miacMembers).size,11);
          assert.deepEqual(new Set(miac.rows.map(r=>r.team_id)),new Set(miacMembers));
          assert.equal(tournamentRules.conferences['men-d3:miac'].tournament.field,6);
          assert.equal(tournamentRules.conferences['men-d3:cciw'].tournament.field,6);
          assert.equal(tournamentRules.conferences['men-d3:cciw'].tournament.first_round_byes,2);
          assert.deepEqual(new Set(conf.conferences['men-d3:cciw'].teams),new Set(cciw.rows.map(r=>r.team_id)));
          assert.equal(conf.conferences['men-d3:cciw'].teams.length,9);
          assert(miac.snapshot_checked_date,'MIAC source date missing');
          const postseasonJs=fs.readFileSync('college-soccer-postseason.js','utf8');
          assert(postseasonJs.includes('setInterval'));
          assert(postseasonJs.includes('NOT calibrated tournament odds'));
          assert(postseasonJs.includes('Early Division I contender forecast'));
          assert(postseasonJs.includes('MIAC · Men’s Division III'));
          assert(postseasonJs.includes('data/college-soccer-miac-standings.json'));
          assert(postseasonJs.includes('MIAA stays active'));
          assert(html.includes('CONFERENCES &amp; TOURNAMENTS'));
          assert(html.indexOf('id="college-team-search"') < html.indexOf('id="college-soccer-postseason"'));
          assert(html.includes('college-soccer-postseason.js?v=bracket8'));
          assert(postseasonJs.includes('NOT odds of qualifying for or winning the MIAC playoff'));
          assert(postseasonJs.includes('15*60*1000'));
                    const elo=JSON.parse(fs.readFileSync('data/college-soccer-elo.json','utf8'));
          const forecast=JSON.parse(fs.readFileSync('data/college-soccer-prospective-v2.json','utf8'));
          for(const sex of ['men','women'])for(const division of [1,2,3]){
            const cohort=sex+'-d'+division, teams=elo.cohorts[cohort];
            assert(Array.isArray(teams)&&teams.length>=10,'Missing cohort '+cohort);
            assert(teams.every(t=>Number.isFinite(t.elo)&&Number.isFinite(t.gf)&&Number.isFinite(t.ga)&&Number.isFinite(t.gp)));
            assert.equal(new Set(teams.map(t=>t.team_id)).size,teams.length,'Duplicate school IDs in '+cohort);
          }
          assert(Array.isArray(elo.latest_finals));
          for(const game of elo.latest_finals){
            assert(game.match_id && game.cohort && game.source_game && /^\d+[-–]\d+$/.test(game.score));
          }
          const ledger=JSON.parse(fs.readFileSync('data/college-soccer-elo-final-ledger.json','utf8'));
          assert(Array.isArray(ledger.results));
          assert.equal(new Set(ledger.results.map(g=>g.match_id)).size,ledger.results.length);
          for(const g of ledger.results){
            assert(g.match_id && g.source_game && Number.isInteger(g.home_goals) && Number.isInteger(g.away_goals));
            const candidates=Object.entries(elo.cohorts).filter(([k,rows])=>k.startsWith(g.gender+'-') && rows.some(t=>t.team_id===g.home_team) && rows.some(t=>t.team_id===g.away_team));
            assert(candidates.length>0,'Cannot resolve both teams for '+g.match_id);
          }
                    assert(Array.isArray(forecast.forecasts));
          for(const g of forecast.forecasts){
            assert(g.match_id && g.kickoff_utc && g.source_game);
            const p=Number(g.p_home)+Number(g.p_draw)+Number(g.p_away);
            assert(Math.abs(p-1)<0.002,'Probabilities do not sum to one');
          }
          console.log('Visual desk validated against six published rating cohorts and locked forecast probabilities.');
          NODE
