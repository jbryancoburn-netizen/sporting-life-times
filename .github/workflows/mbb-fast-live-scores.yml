name: MBB fast live scores
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_mbb_live_scores.py'
      - 'tests/test_mbb_fast_scores.py'
      - '.github/workflows/mbb-fast-live-scores.yml'
  workflow_run:
    workflows:
      - MBB newspaper refresh and publish
    types: [completed]
    branches: [main]
  schedule:
    # GitHub Actions scheduling is best-effort. The Pages publisher also
    # independently captures this exact scoreboard immediately before upload.
    - cron: '*/5 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: mbb-fast-live-scores
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prevent live scoreboard regression
        run: python3 -m unittest discover -s tests -p test_mbb_fast_scores.py -v
      - name: Fetch source-reported men’s active scores and update exact event IDs
        run: python3 scripts/refresh_mbb_live_scores.py
      - name: Publish changed live scores and request Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git add data/mbb-live.json
            if git diff --cached --quiet; then
              echo "No scoreboard change; avoid redundant commits and Pages deployments."
              exit 0
            fi
            git commit -m 'Publish live MBB scoreboard updates'
            if git push origin HEAD:main; then
              gh workflow run publish-newspaper.yml --ref main
              exit 0
            fi
            echo "Concurrent data publisher changed main. Re-fetch verified games and retry." >&2
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/refresh_mbb_live_scores.py
            sleep "$((2*attempt))"
          done
          echo "::error::Fresh MBB score snapshot could not reach main"
          exit 1

      - name: Recover new Division I finals into RETRO and both team calendars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/slt-new-mbb-finals
          import json
          from pathlib import Path
          feed=json.loads(Path('data/mbb-live.json').read_text())
          cross=json.loads(Path('data/ncaam-2026-27-espn-team-crosswalk.json').read_text())
          retro=json.loads(Path('data/ncaam-2026-27-retro-primary.json').read_text())
          di={str(t['espn_id']) for t in cross['teams'] if t.get('espn_id')}
          recorded={str(x['id']).removeprefix('espn:') for x in retro['events']}
          missing=[str(g['id']) for g in feed.get('games',[])
                   if g.get('state')=='post'
                   and {str(t.get('id')) for t in g.get('teams',[])} <= di
                   and len(g.get('teams',[]))==2
                   and str(g['id']) not in recorded]
          print(' '.join(missing))
          PY
          pending="$(cat /tmp/slt-new-mbb-finals)"
          if [[ -n "$pending" ]]; then
            echo "Missing verified-publisher finals: $pending"
            active="$(gh run list --workflow mbb-retro-primary.yml --branch main --limit 12 --json status --jq 'any(.[]; .status != "completed")')"
            if [[ "$active" == "false" ]]; then
              gh workflow run mbb-retro-primary.yml --ref main
            fi
          fi
