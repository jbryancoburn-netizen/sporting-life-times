name: EuroLeague live scorebugs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/euroleague_live.py'
      - 'scripts/euroleague_live_fast.py'
      - 'scripts/test_euroleague_live_fast.py'
      - 'scripts/euroleague_header.py'
      - 'scripts/test_euroleague_header.py'
      - 'scripts/test_euroleague_live.py'
      - '.github/workflows/euroleague-live.yml'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: euroleague-live
  cancel-in-progress: false
jobs:
  scoreboard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test EuroLeague live scorebug invariants
        run: python -m unittest discover -s scripts -p 'test_euroleague_live.py' -v
      - name: Test game Header live-score safeguards
        run: python -m unittest discover -s scripts -p 'test_euroleague_header.py' -v
      - name: Test fast-game updates and final handoff
        run: python -m unittest discover -s scripts -p 'test_euroleague_live_fast.py' -v
      - name: Retrieve active-game scores without full-season download
        run: python scripts/euroleague_live_fast.py
      - name: Detect newly verified finals requiring an Elo rebuild
        id: finals
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          model=json.loads(Path("data/euroleague-model.json").read_text())
          live=json.loads(Path("data/euroleague-live.json").read_text())
          ledger=model.get("completed_game_ledger",[])
          counted={str(g["id"]):g for g in ledger}
          pending=[]
          corrected=[]
          for g in live.get("games",[]):
              if g.get("status")!="final":
                  continue
              gid=str(g["id"])
              previous=counted.get(gid)
              if previous is None:
                  pending.append(gid)
              elif (previous.get("home")!=g.get("home",{}).get("code")
                    or previous.get("away")!=g.get("away",{}).get("code")
                    or previous.get("score")!=[g.get("home",{}).get("score"),g.get("away",{}).get("score")]):
                  corrected.append(gid)
          if corrected:
              raise ValueError("Published EuroLeague finals conflict with live source; manual verification required: "+", ".join(corrected))
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write("new_finals="+("true" if pending or len(ledger)!=model.get("games_completed") else "false")+"\n")
          print("New officially verified finals awaiting Elo:",", ".join(pending) if pending else "none")
          PY
      - name: Publish live scores independently of Elo computation
        run: |
          if [ -n "$(git status --porcelain -- data/euroleague-live.json)" ]; then
            git config user.name "sporting-life-times-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/euroleague-live.json
            git commit -m "Refresh EuroLeague live scoreboard"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Rebuild Elo and standings after a newly confirmed final
        if: steps.finals.outputs.new_finals == 'true'
        run: |
          python scripts/euroleague_model.py
          python scripts/euroleague_release_gate.py
          if [ -n "$(git status --porcelain -- data/euroleague-model.json)" ]; then
            git add data/euroleague-model.json
            git commit -m "Refresh EuroLeague Elo and standings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
