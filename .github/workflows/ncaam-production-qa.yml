name: NCAA Production End-to-End QA
on:
  push:
    paths:
      - 'scripts/update_ncaam_season.py'
      - 'scripts/test_ncaam_season_updates.py'
      - 'ncaam-desk.js'
      - 'ncaam.html'
      - '.github/workflows/ncaam-production-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify updater and independent desk scripts
        id: tests
        continue-on-error: true
        run: |
          python -m py_compile scripts/update_ncaam_season.py scripts/test_ncaam_season_updates.py
          python -m unittest discover -s scripts -p test_ncaam_season_updates.py -v
          node --check ncaam-desk.js
          python - <<'PY'
          import csv,json,subprocess,sys,tempfile
          from pathlib import Path
          baseline=json.loads(Path('data/ncaam-2026-27-preseason-roster-informed.json').read_text())
          first,second=baseline['rankings'][:2]
          with tempfile.TemporaryDirectory() as temp:
            root=Path(temp)
            src=root/'schedule.csv'
            with src.open('w',newline='') as f:
              writer=csv.DictWriter(f,fieldnames=['contest_id','game_date','home','away','home_score','away_score','status'])
              writer.writeheader()
              writer.writerow({'contest_id':'verified-test-001','game_date':'11/03/2026','home':first['team'],'away':second['team'],'home_score':78,'away_score':72,'status':'final'})
            cmd=[sys.executable,'scripts/update_ncaam_season.py','--schedule',str(src),'--as-of','2026-11-04','--out-dir',str(root)]
            subprocess.run(cmd,check=True)
            current=json.loads((root/'ncaam-2026-27-current-provisional.json').read_text())
            ledger=json.loads((root/'ncaam-2026-27-game-ledger.json').read_text())
            assert current['games_played']==1
            assert ledger['count']==1 and ledger['games'][0]['id']=='verified-test-001'
            assert len(current['rankings'])==365
            assert sum(t['wins'] for t in current['rankings'])==1
            assert sum(t['losses'] for t in current['rankings'])==1
            subprocess.run(cmd,check=True)
            same=json.loads((root/'ncaam-2026-27-current-provisional.json').read_text())
            assert same==current,'Second identical run must never increment Elo again'
          print('END-TO-END PASS: 365 baseline -> verified final -> Elo -> records -> ledger -> replay')
          PY
      - name: Publish end-to-end run receipt
        if: always() && github.event_name != 'schedule'
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('data/ncaam-production-qa-receipt.json')
          path.write_text(json.dumps({
             'source_commit':os.environ['GITHUB_SHA'],
             'run_id':os.environ['GITHUB_RUN_ID'],
             'test_outcome':os.environ['TEST_OUTCOME'],
             'checks':['Python compile','deterministic replay tests','JS syntax','365-team real-baseline end-to-end once-only replay']
          },indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ncaam-production-qa-receipt.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record NCAA production QA [skip ci]'
            git -c rebase.autoStash=true pull --rebase origin main
            git push
          fi
      - name: Enforce passing status
        if: steps.tests.outcome != 'success'
        run: exit 1
