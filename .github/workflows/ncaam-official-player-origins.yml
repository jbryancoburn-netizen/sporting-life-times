name: NCAA official player origins verification
on:
  push:
    paths:
      - 'scripts/verify_ncaam_official_origin_overlay.py'
      - 'data/ncaam-2026-27-official-player-origin-overlay.json'
      - 'data/ncaam-2026-27-official-player-resolutions.json'
      - 'data/ncaam-2026-27-player-movement-audit.json'
      - '.github/workflows/ncaam-official-player-origins.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_ncaam_official_origin_overlay.py
