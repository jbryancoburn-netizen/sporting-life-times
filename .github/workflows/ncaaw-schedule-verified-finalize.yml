name: NCAAW Schedule Corrections
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_ncaaw_maui_tipoff_corrections.py
      - run: python scripts/audit_ncaaw_schedule_completeness.py
      - name: Publish schedule corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaaw-schedules-2026-27.json data/ncaaw-schedule-completeness-deep-audit.json
          git diff --cached --quiet || (git commit -m "Publish verified NCAAW schedule fixes" && git push)
