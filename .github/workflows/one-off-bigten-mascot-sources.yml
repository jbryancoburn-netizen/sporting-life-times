name: Build historic Gruff Sparty and Testudo local logos (one-off)
on:
  push:
    branches:
      - feat/production-cbb-big-ten-heritage-20261114
    paths:
      - scripts/build_big_ten_heritage_mascots.py
      - .github/workflows/one-off-bigten-mascot-sources.yml
permissions:
  contents: write
jobs:
  mascot-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing
        run: python -m pip install 'pillow>=10,<12'
      - name: Build historical Gr uf f Sparty and Testudo PNGs
        run: python scripts/build_big_ten_heritage_mascots.py
      - name: Verify local PNGs and source provenance
        run: |
          python - <<'PY'
          import json
          from PIL import Image
          from pathlib import Path
          p=Path('data/cbb-big-ten-heritage-mascot-provenance.json')
          data=json.loads(p.read_text())
          assert set(data)=={'michigan-state-gruff','maryland-terrapin'}
          for key,item in data.items():
            path=Path(item['local'])
            assert path.is_file(),path
            assert item['geometry']['ring_margin_to_238px'] >= 14
            with Image.open(path) as img:
              assert img.size==(512,512),key
          print('PASS: vintage mascots are readable and fit school-color double rings')
          PY
      - name: Commit vetted source artwork on branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cbb-big-ten-1980s/centered/michigan-state-gruff.png assets/cbb-big-ten-1980s/centered/maryland-terrapin.png data/cbb-big-ten-heritage-mascot-provenance.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified vintage mascot sources: Gruff Sparty and 1983 Testudo'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
