name: NCAA ESPN Missing School Evidence
on:
  push:
    paths:
      - 'scripts/audit_ncaam_missing_programs.py'
      - '.github/workflows/ncaam-espn-missing-ids.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official ESPN college basketball event IDs
        run: |
          python -m py_compile scripts/audit_ncaam_missing_programs.py
          python scripts/audit_ncaam_missing_programs.py
      - name: Publish evidence not guesses
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ncaam-2026-27-missing-espn-event-ids.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish evidence for last NCAA ESPN school IDs [skip ci]'
            git -c rebase.autoStash=true pull --rebase origin main
            git push
          fi
