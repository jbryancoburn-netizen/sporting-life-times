name: CBB browser artwork and layout verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/cbb_visual_browser_audit.py'
      - '.github/workflows/mbb-logo-mobile-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/cbb_visual_browser_audit.py'
      - '.github/workflows/mbb-logo-mobile-audit.yml'
  schedule:
    - cron: '19 14 * * *'
permissions:
  contents: read
concurrency:
  group: cbb-browser-visual-audit
  cancel-in-progress: false
jobs:
  validate-script:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile independent visual auditor
        run: python3 -m py_compile scripts/cbb_visual_browser_audit.py
  browser-audit:
    needs: validate-script
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Check real live men's and women's team pages at desktop and mobile widths
        run: python3 scripts/cbb_visual_browser_audit.py
      - name: Preserve screenshots, failed image URLs, and browser audit report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbb-browser-visual-evidence
          path: artifacts/cbb-visual/
          retention-days: 14
          if-no-files-found: warn
