name: Generate university MBB master document (on-demand)
on:
  push:
    paths:
      - '.github/workflows/mbb-build-university-master.yml'
      - 'data/mbb-arena-registry.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check five fully sourced school schedules before publishing
        run: |
          python - <<'PY'
          import json,pathlib
          folder=pathlib.Path("data/mbb-schedules-2026-27")
          expected={"9":32,"59":33,"8":34,"167":35,"2509":35,"84":35,"96":35,"26":34}
          for school,count in expected.items():
              d=json.loads((folder/(school+".json")).read_text())
              assert len(d["events"])==count, (school,len(d["events"]),count)
              pairs=[]
              for e in d["events"]:
                  comps=e["competitions"][0]["competitors"]
                  opp=next((str(x["team"].get("id") or x["team"].get("displayName")) for x in comps if str(x["team"].get("id"))!=school),"")
                  pairs.append((e["date"][:10],opp))
              assert len(pairs)==len(set(pairs)),school
          print("Eight official school schedules certified: 273 game records")
          PY
      - name: Audit current school schedule records
        run: python scripts/mbb_live_quality_audit.py
      - name: Validate completed Alabama and UCLA university schedules
        run: |
          python -c "import json; from pathlib import Path; d=Path('data/mbb-schedules-2026-27'); u=json.loads((d/'26.json').read_text()); a=json.loads((d/'333.json').read_text()); assert len(u['events'])==34; assert len(a['events'])==35; assert sum(bool(x.get('site_verified')) for x in a['events'])==35; print('UCLA:',len(u['events']),'Alabama:',len(a['events']))"
      - name: Recount all published basketball schedules
        run: python scripts/mbb_live_quality_audit.py
      - name: Build CSV and JSON manifest from source-verified university schedules
        run: python scripts/mbb_build_university_master.py
      - name: Verify output
        run: |
          test -s data/mbb-university-master-2026-27.csv
          test -s data/mbb-university-master-2026-27.json
          python -c "import json;d=json.load(open('data/mbb-university-master-2026-27.json'));assert d['summary']['schools']==365"
      - name: Publish static site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-live-quality-audit-2026-27.json data/mbb-university-master-2026-27.csv data/mbb-university-master-2026-27.json data/mbb-live-quality-audit-2026-27.json
          git commit -m "Publish 365-school master schedule CSV and JSON manifest" || exit 0
          git pull --rebase origin main
          git push
