name: Politics official candidate source monitor
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/politics_ballot_source_probe.py'
      - 'test_politics_ballot_source_probe.py'
      - '.github/workflows/politics-ballot-source-probe.yml'
  push:
    branches: [main]
    paths:
      - 'politics-official-ballots.json'
      - 'scripts/politics_ballot_source_probe.py'
      - 'test_politics_ballot_source_probe.py'
      - '.github/workflows/politics-ballot-source-probe.yml'
  schedule:
    - cron: '18 14 * * *'
permissions:
  contents: write
concurrency:
  group: politics-ballot-source-probe
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate government-source boundaries without a network
        run: |
          python -m py_compile scripts/politics_ballot_audit.py scripts/politics_ballot_source_probe.py
          python -m unittest -v test_politics_ballot_audit test_politics_ballot_source_probe
      - name: Probe official source availability and document fingerprints
        run: |
          python scripts/politics_ballot_source_probe.py
      - name: Check source status without ever certifying candidates or odds
        run: |
          python - <<'PY'
          import json
          d=json.load(open('politics-ballot-source-health.json'))
          original=json.load(open('politics-official-ballots.json'))
          assert len(d['sources'])==len(original['sources'])
          assert d['forecast_eligible'] is False
          assert d['sources_requiring_candidate_review']==sum(x['requires_candidate_review'] is True for x in d['sources'])
          assert d['sources_out_of_sync_with_reviewed_snapshot']==sum(x.get('source_content_mismatch_against_review_baseline') is True for x in d['sources'])
          assert all(x.get('review_baseline_sha256') is None or len(x['review_baseline_sha256'])==64 for x in d['sources'])
          assert all(x['candidate_rows_automatically_updated'] is False for x in d['sources'])
          assert d['sources_accessible']+d['sources_unavailable']==len(original['sources'])
          print('Source refresh status:',d['status'],'changed:',d['sources_changed_since_last_probe'])
          PY
      - name: Publish source health without modifying any source transcriptions
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "sporting-life-times-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Retain ONLY the validated probe output across concurrent main updates.
          cp politics-ballot-source-health.json /tmp/politics-ballot-source-health.json
          for attempt in $(seq 1 15); do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/politics-ballot-source-health.json politics-ballot-source-health.json
            git add politics-ballot-source-health.json
            if git diff --cached --quiet; then
              echo "Source health already current"
              exit 0
            fi
            git commit -m "Refresh official ballot source health; flag source changes for review"
            if git push origin HEAD:main; then
              echo "Updated original source health on attempt $attempt"
              exit 0
            fi
            echo "Concurrent main update: rebuilding original-source-only commit ($attempt/15)"
            sleep 2
          done
          exit 1
