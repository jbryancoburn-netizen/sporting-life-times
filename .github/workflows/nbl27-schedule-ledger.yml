name: NBL27 schedule ledger audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nbl27_schedule_audit.py'
      - '.github/workflows/nbl27-schedule-ledger.yml'
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
concurrency:
  group: nbl27-schedule-ledger
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and audit NBL game candidates
        id: audit
        continue-on-error: true
        run: python scripts/nbl27_schedule_audit.py
      - name: Preserve source ledger and discrepancy report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/nbl27-season-candidates.json data/nbl27-schedule-audit.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Publish NBL27 source candidates and schedule discrepancies"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Enforce audit success
        if: steps.audit.outcome != 'success'
        run: |
          echo "NBL source audit failed; discrepancy report was preserved where possible."
          exit 1
