name: NBL27 schedule ledger audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
concurrency:
  group: nbl27-schedule-ledger
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch NBL season and generate candidate ledger and audit
        run: python scripts/nbl27_schedule_audit.py
      - name: Commit updated source ledger and integrity report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nbl27-season-candidates.json data/nbl27-schedule-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NBL27 candidate game ledger and integrity audit"
            git push
          fi
