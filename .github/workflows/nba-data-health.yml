name: NBA data freshness and overnight reconciliation
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-nba-daily-health.py'
      - 'scripts/test_nba_daily_health.py'
      - 'scripts/verify-nba-final-transitions.py'
      - 'scripts/test_nba_final_transitions.py'
      - '.github/workflows/nba-data-health.yml'
permissions:
  contents: write
concurrency:
  group: nba-health-main
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check audit syntax
        run: python -m py_compile scripts/audit-nba-daily-health.py
      - name: Test missing-final and stale-scoreboard detection
        run: python -m unittest discover -s scripts -p 'test_nba_daily_health.py' -v
      - name: Audit Elo, completed games, box score coverage and feed freshness
        continue-on-error: true
        run: python scripts/audit-nba-daily-health.py
      - name: Test public live-to-final evidence checks
        run: python -m unittest discover -s scripts -p 'test_nba_final_transitions.py' -v
      - name: Observe actual public NBA final transitions
        continue-on-error: true
        run: python scripts/verify-nba-final-transitions.py
      - name: Commit health status even when feeds are stale
        run: |
          test -s data/nba-pipeline-health.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba-pipeline-health.json
          if test -f data/nba-final-transition-evidence.json; then git add data/nba-final-transition-evidence.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Audit overnight NBA data coverage and feed freshness"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || exit 1
            sleep 2
          done
          exit 1
      - name: Alert on stale or incomplete NBA sources
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/nba-pipeline-health.json'))
          assert not d['issues'], 'NBA sources need attention: '+', '.join(d['issues'])
          print('NBA feeds healthy; coverage remains a captured-game sample until complete')
          PY
