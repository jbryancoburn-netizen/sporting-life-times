name: EuroLeague independent source and Elo audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/euroleague_independent_audit.py'
      - '.github/workflows/euroleague-independent-audit.yml'
  schedule:
    - cron: '12 7 * * *'
permissions:
  contents: write
concurrency:
  group: euroleague-independent-audit
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently fetch historical seasons and replay Elo
        run: python -u scripts/euroleague_independent_audit.py
      - name: Commit audit ledger
        if: always()
        run: |
          if [ -f data/euroleague-independent-audit.json ] && [ -n "$(git status --porcelain -- data/euroleague-independent-audit.json)" ]; then
            git config user.name "sporting-life-times-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/euroleague-independent-audit.json
            git commit -m "Publish independent EuroLeague source and Elo reconciliation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
