name: MBB 365-team shared crest contract
on:
  workflow_dispatch:
  push:
    paths:
      - 'mbb-logo-system.js'
      - 'mbb-logo-system.css'
      - 'mbb-elo-primary.js'
      - 'mbb-newspaper.js'
      - 'mbb-team-calendar-boot.js'
      - 'ncaam-predictor.js'
      - 'ncaam-predictor.html'
      - 'ncaam-rivalry.js'
      - 'ncaam-rivalry.html'
      - 'data/mbb-logo-registry.json'
      - 'data/ncaam-2026-27-espn-team-crosswalk.json'
      - 'scripts/audit-mbb-logo-system.cjs'
      - 'tests/mbb-rankings-runtime.test.cjs'
      - 'tests/mbb-poll-logos.test.cjs'
      - '.github/workflows/mbb-logo-contract.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all 365 shared college basketball team crests
        run: node scripts/audit-mbb-logo-system.cjs
      - name: Validate 365 NCAA power ranking rows render in DOM
        run: node tests/mbb-rankings-runtime.test.cjs
      - name: Match AP and Coaches Top 25 identities to registered school logos
        run: node tests/mbb-poll-logos.test.cjs
