name: NCAA 2026-27 complete player movement verification
on:
  push:
    paths:
      - scripts/audit_ncaam_player_movements.py
      - scripts/apply_ncaam_official_identities.py
      - scripts/test_apply_ncaam_official_identities.py
      - scripts/verify_ncaam_historical_identity_links.py
      - scripts/test_verify_ncaam_historical_identity_links.py
      - data/ncaam-2026-27-official-player-resolutions.json
      - .github/workflows/ncaam-player-movement-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile NCAA IDs and current ESPN roster endpoints
        run: |
          python scripts/reconcile_ncaam_roster_ids.py
          python scripts/collect_ncaam_roster_evidence.py --season 2027 --out staging/ncaam-2027-roster-evidence.json
      - name: Audit every athlete and prior school without guessed matches
        run: python scripts/audit_ncaam_player_movements.py
      - name: Test institutional biography reconciliation
        run: python -m unittest discover -s scripts -p 'test_apply_ncaam_official_identities.py' -v
      - name: Reconcile 34 institutional athlete histories without inventing NCAA IDs
        run: python scripts/apply_ncaam_official_identities.py
      - name: Regression-test NCAA athlete historical source correlation
        run: python -m unittest discover -s scripts -p 'test_verify_ncaam_historical_identity_links.py' -v
      - name: Link institution-sourced player histories to unique 2025-26 NCAA-origin IDs
        run: python scripts/verify_ncaam_historical_identity_links.py
      - name: Verify NCAA historical identity evidence accounting
        run: |
          python - <<'PY'
          import json
          a=json.load(open('data/ncaam-2026-27-historical-athlete-links.json'))
          assert a['source_candidate_count']==34
          assert a['complete_classification_accounting']
          assert a['source_correlated_ncaa_player_matches']+a['uncertain_historical_identity_count']+a['new_to_d1_no_box_expected']==34
          assert a['exact_numeric_id_cross_provider_matches']==0
          assert not a['approved_for_primary']
          print('Source-correlated NCAA athlete IDs:',a['source_correlated_ncaa_player_matches'],
                'remaining uncertain:',a['uncertain_historical_identity_count'])
          PY
      - name: Verify sourced resolution count and promotion hold
        run: |
          python - <<'PY'
          import json
          raw=json.load(open('data/ncaam-2026-27-player-movement-audit.json'))
          x=json.load(open('data/ncaam-2026-27-identity-resolved.json'))
          assert raw['roster_teams']==365
          assert x['teams_checked']==365
          assert x['institutional_source_confirmations']==x['raw_ambiguous_name_count']
          assert x['uncorroborated_ambiguous_count']==0
          assert x['transfer_minutes_authorized_from_biographies']==0
          assert not x['production_elo_approved']
          print('Source corroboration:',x['institutional_source_confirmations'],'/ 34; prior D-I box unknown:',x['unmatched_prior_d1_box_count'])
          PY
      - name: Verify identity status and release block
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/ncaam-2026-27-player-movement-audit.json'))
          assert x['roster_teams']>=350
          assert x['players_audited']>3500
          assert not x['production_elo_approved']
          assert sum(x['player_status_counts'].values())==x['players_audited']
          print(x['player_status_counts'])
          PY
      - name: Preserve current roster evidence
        uses: actions/upload-artifact@v4
        with:
          name: ncaam-current-rosters-for-movement-audit
          path: staging/ncaam-2027-roster-evidence.json
      - name: Publish movement ledger and audited team crosswalk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaam-2026-27-player-movement-audit.json data/ncaam-2026-27-espn-team-crosswalk.json data/ncaam-2026-27-identity-resolved.json data/ncaam-2026-27-historical-athlete-links.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish 2026-27 player-by-player transfer and returning production audit"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
