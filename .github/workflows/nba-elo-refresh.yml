name: NBA Elo verified final-game refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-elo-refresh.yml'
      - 'scripts/update-nba-elo.mjs'
      - 'tests/nba-final-publisher-contract.test.cjs'
      - 'scripts/audit-nba-elo.mjs'
      - 'scripts/audit-nba-boxscore-elo.mjs'
      - 'scripts/update-nba-forecast-ledger.mjs'
      - 'scripts/test-nba-forecast-ledger.mjs'
      - 'tests/nba-rabby-refresh.test.cjs'
      - 'scripts/persist_nba_cup_results.py'
      - 'scripts/test-nba-cup-results.py'
      - 'nba-rabby-possession.js'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-shared-elo-game-center-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check out latest published main before computing
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify NBA browser scripts and page contract
        run: |
          node --check nba-home.js
          node --check nba-desk-loader.js
          node scripts/audit-nba-page.mjs
      - name: Audit published ratings before refresh
        run: node scripts/audit-nba-elo.mjs
      - name: Validate NBA Elo replay script before network access
        run: node --check scripts/update-nba-elo.mjs
      - name: Test schedule-to-Elo sync offline
        run: |
          python -m py_compile scripts/collect-nba-schedule.py
          node --check scripts/reconcile-nba-schedule.mjs
          node scripts/test-nba-schedule-sync.mjs
      - name: Refresh current NBA scoreboard and nearby dates
        run: |
          python scripts/collect-nba-schedule.py --fast || echo "NBA scoreboard fetch unavailable; preserve prior snapshot and synchronize confirmed Elo finals."
      # One release owns NBA final scores, player boxes, RETRO and team records.
      - name: Collect and aggregate NBA player statistics before the final-score replay
        run: |
          if ! python scripts/collect_nba_game_center.py; then echo "::warning::Official NBA feed unavailable; trying ESPN fallback"; fi
          if ! python scripts/backfill-nba-espn.py; then echo "::warning::ESPN player boxes delayed; verified scores still publish"; fi
          if ! python scripts/enrich-nba-game-details.py; then echo "::warning::Some NBA game details pending"; fi
          python scripts/collect-nba-player-leaders.py
          node scripts/build-nba-possession-inputs.mjs
      - name: Replay verified 2026-27 regular-season finals
        run: node scripts/update-nba-elo.mjs
      - name: Build isolated shadow Elo and historical-prior forecasts
        run: node scripts/build-nba-elo-shadow.mjs --write
      - name: Reconcile verified NBA finals into schedule scorecards
        run: |
          node scripts/reconcile-nba-schedule.mjs
          node scripts/reconcile-nba-schedule.mjs --check
      - name: Synchronize NBA Cup finals using the same verified NBA score feeds
        run: |
          python scripts/test-nba-cup-results.py
          python scripts/persist_nba_cup_results.py
      - name: Verify all rankings, Elo deltas and dated finals before publication
        run: |
          node scripts/audit-nba-elo.mjs
          node scripts/audit-nba-boxscore-elo.mjs
          node scripts/audit-nba-page.mjs
      - name: Report incomplete player box scores without delaying confirmed finals
        continue-on-error: true
        run: python scripts/audit-nba-stat-coverage.py
      - name: Freeze real pregame Rabby estimates and grade verified finals
        id: forecast_archive
        # Experimental forecasting must never block the independent final-score Elo ledger.
        continue-on-error: true
        run: |
          node scripts/test-nba-rabby-possession.mjs
          node scripts/test-nba-forecast-ledger.mjs
          node --test tests/nba-rabby-refresh.test.cjs
          node scripts/update-nba-forecast-ledger.mjs
      - name: Guard against split NBA final publishers
        run: node tests/nba-final-publisher-contract.test.cjs
      - name: Publish new verified game results, if any
        run: |
          if git diff --quiet -- data/nba-2026-27-current-provisional.json && git diff --quiet -- data/nba-elo-reconciliation.json && git diff --quiet -- data/nba-elo-shadow-2026-27.json && git diff --quiet -- data/nba-upcoming-schedule.json && git diff --quiet -- data/nba-cup-2026.json && git diff --quiet -- data/nba-game-center.json && git diff --quiet -- data/nba-player-leaders.json && git diff --quiet -- data/nba-possession-inputs.json && git diff --quiet -- data/nba-stat-coverage-audit.json && test -z "$(git status --porcelain -- data/nba-rabby-forecast-ledger.json)" && test -f data/nba-elo-reconciliation.json; then
            echo "No new completed games; no commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba-2026-27-current-provisional.json data/nba-elo-reconciliation.json data/nba-elo-shadow-2026-27.json data/nba-upcoming-schedule.json data/nba-cup-2026.json data/nba-game-center.json data/nba-player-leaders.json data/nba-possession-inputs.json data/nba-stat-coverage-audit.json
          if test -f data/nba-rabby-forecast-ledger.json; then git add data/nba-rabby-forecast-ledger.json; fi
          git commit -m "Update independent provisional NBA Elo with verified final scores"
          for attempt in 1 2 3; do
            if git push; then echo "NBA Elo and scoreboard published successfully"; exit 0; fi
            # Other score, news and game-center workflows also publish to main.
            # Recompute over latest verified finals, never rebase conflicting JSON.
            git fetch origin main
            git reset --hard origin/main
            # A never-published local forecast must not be carried forward after a failed push.
            if ! git ls-files --error-unmatch data/nba-rabby-forecast-ledger.json >/dev/null 2>&1; then rm -f data/nba-rabby-forecast-ledger.json; fi
            python scripts/collect-nba-schedule.py --fast || echo "Schedule endpoint unavailable on retry; using last verified schedule."
            python scripts/backfill-nba-espn.py || echo "::warning::Player box scores still pending on retry"
            python scripts/collect-nba-player-leaders.py
            node scripts/build-nba-possession-inputs.mjs
            node scripts/update-nba-elo.mjs
            node scripts/build-nba-elo-shadow.mjs --write
            node scripts/reconcile-nba-schedule.mjs
            python scripts/persist_nba_cup_results.py
            if ! node scripts/update-nba-forecast-ledger.mjs; then
              echo "::warning::Rabby archive unavailable on retry; publish verified NBA Elo without altering previous forecasts."
            fi
            node scripts/audit-nba-elo.mjs
            node scripts/audit-nba-boxscore-elo.mjs
            node scripts/reconcile-nba-schedule.mjs --check
            python scripts/audit-nba-stat-coverage.py || echo "::warning::Some NBA player stats remain pending"
            git add data/nba-2026-27-current-provisional.json data/nba-elo-reconciliation.json data/nba-elo-shadow-2026-27.json data/nba-upcoming-schedule.json data/nba-cup-2026.json data/nba-game-center.json data/nba-player-leaders.json data/nba-possession-inputs.json data/nba-stat-coverage-audit.json
          if test -f data/nba-rabby-forecast-ledger.json; then git add data/nba-rabby-forecast-ledger.json; fi
            if git diff --cached --quiet; then echo "Remote NBA data already up-to-date"; exit 0; fi
            git commit -m "Reconcile verified NBA finals and current scoreboard"
            sleep 2
          done
          echo "NBA Elo publication failed after three attempts" >&2
          exit 1

      - name: Report forecast archive failures without suppressing NBA final-score publication
        if: always() && steps.forecast_archive.outcome == 'failure'
        run: |
          echo "::error::NBA forecast archive failed. NBA final-score updates remain independent, but this workflow must report failure."
          exit 1
