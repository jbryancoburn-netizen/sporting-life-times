name: NBA Elo verified daily refresh
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-elo-refresh-main
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify NBA browser scripts and page contract
        run: |
          node --check nba-home.js
          node --check nba-desk-loader.js
          node scripts/audit-nba-page.mjs
      - name: Audit published ratings before refresh
        run: node scripts/audit-nba-elo.mjs
      - name: Replay only ESPN-confirmed 2026-27 regular-season finals
        run: node scripts/update-nba-elo.mjs
      - name: Verify all rankings, Elo deltas and dated finals before publication
        run: |
          node scripts/audit-nba-elo.mjs
          node scripts/audit-nba-page.mjs
      - name: Publish new verified game results, if any
        run: |
          if git diff --quiet -- data/nba-2026-27-current-provisional.json; then
            echo "No new completed games; no commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba-2026-27-current-provisional.json
          git commit -m "Update independent provisional NBA Elo with verified final scores"
          git push
