name: Retrieve and audit NCAA D1 scores 2020–2026
on:
  workflow_dispatch:
    inputs:
      season:
        description: Season ending year (2020-2026)
        required: true
        default: '2020'
  push:
    paths:
      - 'scripts/acquire_ncaam_ncaa_2020_2026.py'
      - 'scripts/test_ncaam_ncaa_2020_2026.py'
      - 'scripts/audit_ncaam_2020_2026_import_readiness.py'
      - '.github/workflows/ncaam-ncaa-scores-2020-2026.yml'
permissions:
  contents: write
concurrency:
  group: ncaa-historical-scores
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        season: [2020,2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate NCAA final-score parser
        run: python scripts/test_ncaam_ncaa_2020_2026.py
      - name: Pull genuine NCAA results by day
        run: |
          python scripts/acquire_ncaam_ncaa_2020_2026.py --season ${{ matrix.season }} --sleep 0.4
      - name: Publish source files only after season completeness gate succeeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historical-normalized/ncaa/ncaa-${{ matrix.season }}-finals.csv historical-normalized/ncaa/ncaa-${{ matrix.season }}-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: acquire NCAA ${{ matrix.season }} final scores and audit'
            for n in 1 2 3 4 5 6 7 8; do
              git pull --rebase && git push && break
              if [ "$n" = 8 ]; then exit 1; fi
              sleep $((n*3))
            done
          fi
      - name: Audit published season inventory against source game counts
        run: |
          python scripts/audit_ncaam_2020_2026_import_readiness.py
      - name: Preserve complete scored fixture archives
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncaa-score-source-${{ matrix.season }}
          path: |
            historical-normalized/ncaa/ncaa-${{ matrix.season }}-finals.csv
            historical-normalized/ncaa/ncaa-${{ matrix.season }}-audit.json
          if-no-files-found: warn
