name: NCAA Candidate Competition Exposure
on:
  push:
    paths:
      - scripts/reconcile_ncaam_candidate_exposure.py
      - .github/workflows/ncaam-candidate-exposure.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_ncaam_player_opponent_elo.py
      - run: python scripts/reconcile_ncaam_candidate_exposure.py
      - uses: actions/upload-artifact@v4
        with:
          name: ncaam-candidate-competition-exposure
          path: data/ncaam-2026-27-candidate-opponent-exposure.json
