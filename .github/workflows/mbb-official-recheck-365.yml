name: MBB official-site recheck all 365 schools
on:
  push:
    paths:
      - '.github/workflows/mbb-official-recheck-365.yml'
      - 'scripts/mbb_official_recheck_365.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scripts/mbb_official_recheck_365.py
      - name: Publish official recheck
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-schedules-2026-27/ data/mbb-official-recheck-365-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Recheck 365 basketball schedules against official university game listings"
            git pull --rebase origin main
            git push
          fi
