name: MBB verified Sidearm three-school pilot
on:
  push:
    paths:
      - '.github/workflows/mbb-sidearm-verified-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: REPORT=sidearm-pilot APPLY=1 python scripts/mbb_sidearm_verified_reader.py
      - run: python scripts/mbb_live_quality_audit.py
      - name: Publish measured corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-schedules-2026-27/ data/mbb-sidearm-pilot.json data/mbb-live-quality-audit-2026-27.json
          git commit -m "Apply verified Sidearm three-school pilot" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1
