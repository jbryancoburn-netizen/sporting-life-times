name: NCAA 300 versus 1200 matched holdout
on:
  push:
    paths:
      - 'scripts/backtest_ncaam_coefficient_head_to_head.py'
      - 'scripts/run_ncaam_coefficient_head_to_head.py'
      - '.github/workflows/ncaam-coefficient-head-to-head.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncaam-coefficient-comparison
  cancel-in-progress: false
jobs:
  head-to-head:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile both methods and test formula
        run: |
          python -m py_compile scripts/backtest_ncaam_coefficient_head_to_head.py scripts/run_ncaam_coefficient_head_to_head.py
          python -m unittest discover -s scripts -p test_ncaam_exact_player_v1.py -v
      - name: Compare both methods on one frozen game population
        run: python scripts/run_ncaam_coefficient_head_to_head.py
      - name: Retain test evidence even if collection fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-beta300-vs-quality1200
          path: |
            data/ncaam-coefficient-head-to-head.json
            data/ncaam-coefficient-head-to-head-diagnostic.json
      - name: Publish comparison without selecting model
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ncaam-coefficient-head-to-head*.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record matched NCAA 300 vs 1200 holdout [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
