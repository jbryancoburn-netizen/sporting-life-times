name: Build eight historical Big Ten 1980s logos (one-off)
on:
  push:
    branches:
      - feat/big-ten-18-vintage-1980s-gallery-20261114
    paths:
      - scripts/add_1980s_later_big_ten.py
      - .github/workflows/one-off-bigten-eighteen-vintage.yml
permissions:
  contents: write
jobs:
  build-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG processing library
        run: python -m pip install 'pillow>=10,<12'
      - name: Verify Python syntax
        run: python -m py_compile scripts/add_1980s_later_big_ten.py
      - name: Download verified historical-era artwork and build 18-school audit
        run: python scripts/add_1980s_later_big_ten.py
      - name: Audit complete local historical gallery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          page=Path('cbb-big-ten-1980s-preview.html').read_text()
          data=json.loads(Path('data/cbb-big-ten-1980s-eight-source-manifest.json').read_text())
          assert data['current_big_ten_count']==18
          assert len(data['later_arrivals'])==8
          assert page.count('<article class="school">')==18
          assert page.count('v=20261114-bigten18a')==8
          assert page.count('target="_blank"')>=8
          assert 'id="additional-1980s"' in page
          assert '--slt-ink-' not in page
          for item in data['later_arrivals']:
            assert item['used_in_1980s'] is True
            assert item['geometry']['gap_to_238px_circle'] >= 18
            path=Path(item['local_file'])
            assert path.exists()
            with Image.open(path) as im:
              assert im.size == (512,512), path
              assert im.format == 'PNG', path
          print('PASS: all 18 current Big Ten 1980s logos, 8 verified local additions, no external runtime logo assets')
          PY
      - name: Commit local archival image assets to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cbb-big-ten-1980s-preview.html assets/cbb-big-ten-1980s/centered/ data/cbb-big-ten-1980s-eight-source-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add eight authentic 1980s logos to complete 18-school Big Ten archive'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
