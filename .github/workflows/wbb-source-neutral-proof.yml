name: Verify Auburn Women's Neutral-Site Tournament Fixtures
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/wbb-source-neutral-proof.yml'
      - 'scripts/wbb-verified-neutral-sites.py'
      - 'data/ncaaw-2026-27-auburn-neutral-site-evidence.json'
      - 'tests/test_wbb_venue_resolution.py'
  push:
    paths:
      - '.github/workflows/wbb-source-neutral-proof.yml'
      - 'scripts/wbb-verified-neutral-sites.py'
      - 'data/ncaaw-2026-27-auburn-neutral-site-evidence.json'
      - 'tests/test_wbb_venue_resolution.py'
permissions:
  contents: write
concurrency:
  group: wbb-source-neutral-proof
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check unique school, opponent, Eastern date and game ID
        run: |
          python -m unittest discover -s tests -p 'test_wbb_venue_resolution.py' -v
          python scripts/wbb-verified-neutral-sites.py
          python - <<'PY'
          import json
          d=json.load(open('data/ncaaw-2026-27-verified-neutral-sites.json'))
          assert d['verified_unique_games']==5 and len(d['games'])==5
          assert len({x['game_id'] for x in d['games']})==5
          print('Neutral events matched exactly:',[x['game_id'] for x in d['games']])
          PY
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile five independently cited neutral games
        run: python scripts/wbb-verified-neutral-sites.py
      - name: Publish verified women-only neutral game identities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaaw-2026-27-verified-neutral-sites.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verify five women's Auburn neutral venues by exact event identity"
          for n in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/wbb-verified-neutral-sites.py
            git add data/ncaaw-2026-27-verified-neutral-sites.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish neutral Auburn women fixtures on current school calendars"
            sleep 2
          done
          exit 1
