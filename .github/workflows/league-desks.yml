name: League desk integrity
on:
  push:
    paths:
      - 'sports.html'
      - 'league-desks.js'
      - 'league-desk.css'
      - 'epl.html'
      - '*-basketball.html'
      - '*-league.html'
      - 'euroleague.html'
      - 'nbl.html'
      - 'scripts/check-league-desks.mjs'
      - '.github/workflows/league-desks.yml'
  pull_request:
    paths:
      - 'sports.html'
      - 'league-desks.js'
      - 'league-desk.css'
      - 'epl.html'
      - '*.html'
      - 'scripts/check-league-desks.mjs'
      - '.github/workflows/league-desks.yml'
  workflow_dispatch:
jobs:
  check-league-desks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit every league desk
        run: node scripts/check-league-desks.mjs
