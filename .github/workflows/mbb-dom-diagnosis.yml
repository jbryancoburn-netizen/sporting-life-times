name: MBB inspect real official schedule HTML
on:
  push:
    paths:
      - '.github/workflows/mbb-dom-diagnosis.yml'
      - 'scripts/mbb_official_dom_diagnosis.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scripts/mbb_official_dom_diagnosis.py
      - name: Commit DOM evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-official-dom-diagnosis.json
          git commit -m "Publish real university schedule DOM findings" || exit 0
          for n in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1
