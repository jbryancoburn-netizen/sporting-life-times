name: Build 16 SEC historical crests — review gallery
on:
  push:
    branches: [feat/sec-1980s-gallery-20261114]
    paths:
      - 'scripts/build_sec_1980s_gallery.py'
      - '.github/workflows/sec-1980s-gallery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processor
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Rebuild source-verified, centered local SEC crests
        run: python scripts/build_sec_1980s_gallery.py
      - name: Check all 16 output files and provenance
        run: node --test tests/cbb-sec-heritage-gallery.test.cjs
      - name: Save approved-size review artwork to SEC branch only
        run: |
          git config user.name sporting-life-times-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/cbb-sec-1980s/ cbb-sec-1980s-preview.html data/cbb-sec-1980s-source-manifest.json
          git commit -m "Generate 16 source-verified 1980s SEC review crests"
          git push origin HEAD:feat/sec-1980s-gallery-20261114
