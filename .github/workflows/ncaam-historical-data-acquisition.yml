name: Acquire NCAA historical player data
# Manual 2026-10-24 verification rerun requested; preserves strict no-leakage gate.
on:
  push:
    paths:
      - '.github/workflows/ncaam-historical-data-acquisition.yml'
      - 'scripts/normalize_ncaam_historical_parquet.py'
      - 'scripts/backtest_ncaam_quality_retrospective.py'
      - 'scripts/backtest_ncaam_quality_earlyseason_asof.py'
      - 'scripts/build_ncaam_2027_quality_shadow.py'
      - 'scripts/recover_ncaam_prior_player_stats_by_id.py'
      - 'scripts/replay_ncaam_official_transfer_source_ids.py'
      - 'data/ncaam-2026-27-official-prior-school-corroborations.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncaam-historical-source-acquisition
  cancel-in-progress: true
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow
      - name: Download and inspect NCAA-origin historical assets
        shell: bash
        run: |
          mkdir -p historical-data historical-report
          python - <<'PY'
          import datetime,hashlib,json,os,urllib.request
          from pathlib import Path
          import pyarrow.parquet as pq
          root='https://github.com/sportsdataverse/sportsdataverse-data/releases/download'
          groups={
            'ncaa_mbb_team_rosters':'ncaa_mbb_team_rosters_{season}.parquet',
            'ncaa_mbb_player_box':'ncaa_mbb_player_box_{season}.parquet',
            'ncaa_mbb_schedule':'ncaa_mbb_schedule_{season}.parquet',
          }
          # Training 2024 and 2025; untouched holdout 2026;
          # 2023 required to compute genuinely prior-year performance for 2024.
          records=[]
          for season in (2023,2024,2025,2026):
            for group,format_ in groups.items():
              name=format_.format(season=season)
              url=f'{root}/{group}/{name}'
              path=Path('historical-data')/name
              record={'season':season,'kind':group,'asset':name,'url':url}
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'SportingLifeTimes-acquisition/1.0'})
                with urllib.request.urlopen(req,timeout=90) as src,open(path,'wb') as f:
                  import shutil
                  shutil.copyfileobj(src,f)
                pfile=pq.ParquetFile(path)
                record.update(status='fetched',bytes=path.stat().st_size,
                    rows=pfile.metadata.num_rows,columns=pfile.schema.names,
                    sha256=hashlib.sha256(path.read_bytes()).hexdigest())
                print('FETCHED',season,group,record['rows'],'rows',flush=True)
              except Exception as exc:
                record.update(status='failed',error=str(exc)[:400])
                print('FAILED',season,group,repr(exc),flush=True)
              records.append(record)
          manifest={
            'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'origin':'SportsDataverse NCAA MBB (stats.ncaa.org)',
            'historical_asof_preseason_verified':False,
            'source_timing_warning':'Season roster archives do not by themselves establish pre-opening-day capture time. Never certify no-leakage until snapshot timestamps are proven.',
            'records':records,
          }
          Path('historical-report/ncaam-historical-acquisition.json').write_text(json.dumps(manifest,indent=2)+'\n')
          success=sum(r['status']=='fetched' for r in records)
          print(f'ACQUIRED {success} of {len(records)} historical parquet assets')
          if success==0:
            raise SystemExit('No historical assets fetched')
          PY
      - name: Convert historical player statistics, rosters and schedules for backtesting
        run: python scripts/normalize_ncaam_historical_parquet.py
      - name: Run real NCAA historical player-quality backtest
        run: |
          python scripts/backtest_ncaam_quality_retrospective.py \
            --source historical-normalized \
            --output historical-report/ncaam-player-quality-retrospective-backtest.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('historical-report/ncaam-player-quality-retrospective-backtest.json').read_text())
          assert r['holdout_minutes_only']['games'] >= 1000
          assert r['holdout_minutes_plus_quality']['games'] == r['holdout_minutes_only']['games']
          assert r['production_approval'] is False
          assert r['status']=='RETROSPECTIVE_DIAGNOSTIC_NOT_ASOF_PRESEASON_VALIDATED'
          print('PASS:',r['holdout_minutes_only']['games'],'holdout games with no misleading production promotion')
          PY
      - name: Run strictly dated in-season 2024–25 train and 2026 holdout
        run: |
          python scripts/backtest_ncaam_quality_earlyseason_asof.py \
            --source historical-normalized \
            --output historical-report/ncaam-quality-earlyseason-asof-backtest.json
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('historical-report/ncaam-quality-earlyseason-asof-backtest.json').read_text())
          assert o['holdout_minutes']['games']>1000
          assert o['holdout_quality']['games']==o['holdout_minutes']['games']
          assert o['status']=='CHRONOLOGICALLY_VALID_EARLYSEASON_NOT_PRESEASON'
          assert o['preseason_release_approved'] is False
          print('CHECKED:',o['holdout_minutes']['games'],'real post-cutoff 2026 contests')
          PY
      - name: Generate and validate 365-team player-quality PRESEASON shadow
        run: |
          python scripts/build_ncaam_2027_quality_shadow.py \
            --historical-player-box historical-normalized/ncaa_mbb_player_box_2026.csv.gz \
            --study historical-report/ncaam-quality-earlyseason-asof-backtest.json \
            --out historical-report/ncaam-2026-27-scoring-quality-shadow.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('historical-report/ncaam-2026-27-scoring-quality-shadow.json').read_text())
          assert report['team_count']==365
          assert report['status']=='SHADOW_ONLY_DO_NOT_PROMOTE'
          assert report['production_elo_approved'] is False
          assert report['preseason_asof_certified'] is False
          assert len({r['team_id'] for r in report['rankings']})==365
          assert report['source_integrity']['matched_verified_history']==2923
          assert report['source_integrity']['fallback_team_count']==1
          print('CHECKED: 365 experimental player-quality adjusted NCAA ratings, not official Elo')
          PY
      - name: Reproduce four NCAA athlete IDs for official 2026-27 D-I transfers
        run: |
          python scripts/replay_ncaam_official_transfer_source_ids.py \
            --parquet historical-data/ncaa_mbb_player_box_2026.parquet \
            --csv historical-normalized/ncaa_mbb_player_box_2026.csv.gz \
            --out historical-report/ncaam-2026-27-four-player-source-replay.json
          python scripts/replay_ncaam_official_transfer_source_ids.py \
            --parquet historical-data/ncaa_mbb_player_box_2026.parquet \
            --csv historical-normalized/ncaa_mbb_player_box_2026.csv.gz \
            --out historical-report/ncaam-2026-27-four-player-source-replay.json --verify
      - name: Recover 2025–26 transfer scoring by strict NCAA athlete ID
        run: |
          python scripts/recover_ncaam_prior_player_stats_by_id.py \
            --player-box historical-normalized/ncaa_mbb_player_box_2026.csv.gz \
            --out historical-report/ncaam-2026-27-id-history-recoveries.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('historical-report/ncaam-2026-27-id-history-recoveries.json').read_text())
          assert x['source_linked_players']==3523
          assert x['original_measured_players']==2923
          assert x['source_unmeasured_links']==600
          assert x['changes_to_published_elo'] is False
          assert x['automatically_promoted'] is False
          assert x['recovered_eligible_for_future_review']<=600
          assert len({r['current_espn_id'] for r in x['verified_historical_id_recoveries']})==x['recovered_eligible_for_future_review']
          print('STRICT ID RECOVERIES:',x['recovered_eligible_for_future_review'])
          PY
      - name: Publish acquisition status to the newspaper repository
        if: always()
        shell: bash
        run: |
          mkdir -p data historical-report
          if [ ! -s historical-report/ncaam-historical-acquisition.json ]; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          Path('historical-report/ncaam-historical-acquisition.json').write_text(json.dumps({
              'status':'DOWNLOAD_OR_SETUP_FAILED',
              'run_id':os.environ.get('GITHUB_RUN_ID'),
              'failure':'No source audit was generated; inspect this GitHub Actions run'
          },indent=2) + chr(10))
          PY
          fi
          cp historical-report/ncaam-historical-acquisition.json data/ncaam-historical-acquisition-status.json
          if [ -s historical-report/ncaam-player-quality-retrospective-backtest.json ]; then
            cp historical-report/ncaam-player-quality-retrospective-backtest.json data/ncaam-player-quality-retrospective-backtest.json
          fi
          if [ -s historical-report/ncaam-quality-earlyseason-asof-backtest.json ]; then
            cp historical-report/ncaam-quality-earlyseason-asof-backtest.json data/ncaam-quality-earlyseason-asof-backtest.json
          fi
          if [ -s historical-report/ncaam-2026-27-scoring-quality-shadow.json ]; then
            cp historical-report/ncaam-2026-27-scoring-quality-shadow.json data/ncaam-2026-27-scoring-quality-shadow.json
          fi
          if [ -s historical-report/ncaam-2026-27-four-player-source-replay.json ]; then
            cp historical-report/ncaam-2026-27-four-player-source-replay.json data/ncaam-2026-27-four-player-source-replay.json
          fi
          if [ -s historical-report/ncaam-2026-27-id-history-recoveries.json ]; then
            cp historical-report/ncaam-2026-27-id-history-recoveries.json data/ncaam-2026-27-id-history-recoveries.json
          fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path('data/ncaam-historical-acquisition-status.json')
          j=json.loads(f.read_text())
          records=j.get('records',[])
          j['status']=('COMPLETE' if len(records)==12 and
                       all(r.get('status')=='fetched' for r in records)
                       else 'INCOMPLETE')
          j['run_id']=os.environ.get('GITHUB_RUN_ID')
          j['commit_sha']=os.environ.get('GITHUB_SHA')
          f.write_text(json.dumps(j,indent=2) + chr(10))
          print('Acquisition status:',j['status'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ncaam-historical-acquisition-status.json data/ncaam-player-quality-retrospective-backtest.json
          for file in data/ncaam-quality-earlyseason-asof-backtest.json data/ncaam-2026-27-scoring-quality-shadow.json data/ncaam-2026-27-id-history-recoveries.json data/ncaam-2026-27-four-player-source-replay.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          git commit -m 'Record NCAA historical data acquisition result' || exit 0
          # Generated audit JSON changes every run. Rebase can conflict with
          # concurrently published acquisitions. Re-apply our complete files
          # on the latest branch rather than merging two partial JSON reports.
          mkdir -p /tmp/ncaam-acquisition-publish
          for file in data/ncaam-historical-acquisition-status.json data/ncaam-player-quality-retrospective-backtest.json data/ncaam-quality-earlyseason-asof-backtest.json data/ncaam-2026-27-scoring-quality-shadow.json data/ncaam-2026-27-id-history-recoveries.json data/ncaam-2026-27-four-player-source-replay.json; do
            if [ -f "$file" ]; then cp "$file" /tmp/ncaam-acquisition-publish/; fi
          done
          for attempt in 1 2 3 4 5; do
            git fetch origin main || exit 1
            git reset --hard origin/main || exit 1
            cp /tmp/ncaam-acquisition-publish/* data/
            git add data/ncaam-historical-acquisition-status.json
            for file in data/ncaam-player-quality-retrospective-backtest.json data/ncaam-quality-earlyseason-asof-backtest.json data/ncaam-2026-27-scoring-quality-shadow.json data/ncaam-2026-27-id-history-recoveries.json data/ncaam-2026-27-four-player-source-replay.json; do
              if [ -f "$file" ]; then git add "$file"; fi
            done
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish complete NCAA historical validation artifacts' || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1
      - name: Save source manifest and acquired datasets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaam-historical-source-audit-${{ github.run_id }}
          path: |
            historical-report/
            historical-data/
            historical-normalized/
          retention-days: 7
          if-no-files-found: warn
