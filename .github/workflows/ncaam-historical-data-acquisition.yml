name: Acquire NCAA historical player data
# Manual 2026-10-24 verification rerun requested; preserves strict no-leakage gate.
on:
  push:
    paths:
      - '.github/workflows/ncaam-historical-data-acquisition.yml'
      - 'scripts/normalize_ncaam_historical_parquet.py'
      - 'scripts/backtest_ncaam_quality_retrospective.py'
      - 'scripts/calibrate_ncaam_game_elo.py'
      - 'scripts/calibrate_ncaam_centered_margin.py'
      - 'scripts/backtest_ncaam_turnover_update_speed.py'
      - 'scripts/backtest_ncaam_combined_elo.py'
      - 'scripts/backtest_ncaam_exact_challenger_v3.py'
      - 'scripts/calibrate_ncaam_score_model.py'
      - 'scripts/build_ncaam_scoring_profiles.py'
      - 'scripts/build_ncaam_2027_multistat_challenger.py'
      - 'scripts/test_ncaam_multistat_release.py'
      - 'scripts/audit_ncaam_indiana_highpoint_baseline.py'
      - 'scripts/audit_ncaam_bootstrap_coldstart.py'
      - 'scripts/audit_ncaam_historical_transfer_origin.py'
      - 'scripts/audit_ncaam_historical_multistat_coverage.py'
      - 'scripts/build_ncaam_historical_multistat_features.py'
      - 'scripts/calibrate_ncaam_independent_stat_weights.py'
      - 'scripts/audit_ncaam_coefficient_impact.py'
      - 'scripts/optimize_ncaam_continuous_stat_weights.py'
      - 'scripts/audit_ncaam_continuous_optimizer_impact.py'
      - 'scripts/audit_ncaam_adjustment_size_buckets.py'
      - 'scripts/audit_ncaam_stat_coverage_timing.py'
      - 'scripts/audit_ncaam_stat_player_match_coverage.py'
      - 'scripts/backtest_ncaam_coverage_shrinkage.py'
      - 'scripts/reconcile_ncaam_players.py'
      - 'scripts/audit_ncaam_player_reconciliation.py'
      - 'scripts/reconcile_ncaam_multi_year.py'
      - 'scripts/audit_ncaam_multiyear_identity.py'
      - 'scripts/audit_ncaam_athlete_ids.py'
      - 'scripts/backtest_ncaam_multiyear_stat_recovery.py'
      - 'scripts/backtest_ncaam_quality_earlyseason_asof.py'
      - 'scripts/build_ncaam_2027_quality_shadow.py'
      - 'scripts/recover_ncaam_prior_player_stats_by_id.py'
      - 'scripts/replay_ncaam_official_transfer_source_ids.py'
      - 'data/ncaam-2026-27-official-prior-school-corroborations.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncaam-historical-source-acquisition
  cancel-in-progress: true
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow
      - name: Download and inspect NCAA-origin historical assets
        shell: bash
        run: |
          mkdir -p historical-data historical-report
          python - <<'PY'
          import datetime,hashlib,json,os,urllib.request
          from pathlib import Path
          import pyarrow.parquet as pq
          root='https://github.com/sportsdataverse/sportsdataverse-data/releases/download'
          groups={
            'ncaa_mbb_team_rosters':'ncaa_mbb_team_rosters_{season}.parquet',
            'ncaa_mbb_player_box':'ncaa_mbb_player_box_{season}.parquet',
            'ncaa_mbb_schedule':'ncaa_mbb_schedule_{season}.parquet',
          }
          # Training 2024 and 2025; untouched holdout 2026;
          # 2023 required to compute genuinely prior-year performance for 2024.
          records=[]
          for season in (2023,2024,2025,2026):
            for group,format_ in groups.items():
              name=format_.format(season=season)
              url=f'{root}/{group}/{name}'
              path=Path('historical-data')/name
              record={'season':season,'kind':group,'asset':name,'url':url}
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'SportingLifeTimes-acquisition/1.0'})
                with urllib.request.urlopen(req,timeout=90) as src,open(path,'wb') as f:
                  import shutil
                  shutil.copyfileobj(src,f)
                pfile=pq.ParquetFile(path)
                record.update(status='fetched',bytes=path.stat().st_size,
                    rows=pfile.metadata.num_rows,columns=pfile.schema.names,
                    sha256=hashlib.sha256(path.read_bytes()).hexdigest())
                print('FETCHED',season,group,record['rows'],'rows',flush=True)
              except Exception as exc:
                record.update(status='failed',error=str(exc)[:400])
                print('FAILED',season,group,repr(exc),flush=True)
              records.append(record)
          manifest={
            'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'origin':'SportsDataverse NCAA MBB (stats.ncaa.org)',
            'historical_asof_preseason_verified':False,
            'source_timing_warning':'Season roster archives do not by themselves establish pre-opening-day capture time. Never certify no-leakage until snapshot timestamps are proven.',
            'records':records,
          }
          Path('historical-report/ncaam-historical-acquisition.json').write_text(json.dumps(manifest,indent=2)+'\n')
          success=sum(r['status']=='fetched' for r in records)
          print(f'ACQUIRED {success} of {len(records)} historical parquet assets')
          if success==0:
            raise SystemExit('No historical assets fetched')
          PY
      - name: Convert historical player statistics, rosters and schedules for backtesting
        run: python scripts/normalize_ncaam_historical_parquet.py
      - name: Reconstruct Indiana and High Point historical Elo baseline
        run: |
          python scripts/audit_ncaam_indiana_highpoint_baseline.py --source historical-normalized --output data/ncaam-indiana-high-point-baseline-audit.json
          python - <<'PY'
          import json
          d=json.load(open('data/ncaam-indiana-high-point-baseline-audit.json'))
          assert len(d['years']['2026']['teams']['indiana']['match_ledger'])>=20
          assert len(d['years']['2026']['teams']['high point']['match_ledger'])>=20
          assert d['years']['2026']['games_replayed']>3000
          print('Verified source games; published Elo parity:',d['published_baseline_comparison'])
          PY
      - name: Test historical Elo cold start against published bootstrap
        run: |
          python scripts/audit_ncaam_bootstrap_coldstart.py --source historical-normalized
          python - <<'PY'
          import json
          a=json.load(open('data/ncaam-bootstrap-initialization-comparison.json'))
          assert a['verified_games']>5000
          assert all(k in a['teams'] for k in ('indiana','high point'))
          PY
      - name: Reconcile and account for every historical roster player
        run: |
          python scripts/audit_ncaam_player_reconciliation.py --source historical-normalized --out historical-report/ncaam-player-reconciliation.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-player-reconciliation.json'))
          assert not d['production_promotion_allowed']
          for y in ('2024','2025','2026'):
            v=d['seasons'][y]
            assert v['players_accounted_for']>4000
            assert sum(v['match_reason_counts'].values())==v['players_accounted_for']
          PY
      - name: Recover multi-year player identities without fabricating freshman status
        run: |
          python scripts/audit_ncaam_multiyear_identity.py --source historical-normalized --out historical-report/ncaam-multiyear-identity-audit.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-multiyear-identity-audit.json'))
          assert d['production_promotion_allowed'] is False
          for y in ('2025','2026'):
            x=d['results'][y]
            assert x['current_roster_entries_accounted']>4000
            assert x['additional_previous_two_seasons_matches']>=0
          PY
      - name: Audit NCAA cross-season athlete source ID consistency
        run: |
          python scripts/audit_ncaam_athlete_ids.py --source historical-normalized --out historical-report/ncaam-athlete-id-audit.json
          python - <<'PY'
          import json
          x=json.load(open('historical-report/ncaam-athlete-id-audit.json'))
          assert not x['production_promotion_allowed']
          assert len(x['years'])==3
          PY
      - name: Fit NCAA basketball score projections with 2026 historical holdout
        run: |
          python scripts/calibrate_ncaam_score_model.py --source historical-normalized --out historical-report/ncaam-score-calibration.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-score-calibration.json'))
          assert d['validation']['date_disjoint']
          assert d['validation']['holdout_games']>=3000
          PY
      - name: Build evidence-based NCAA team offense and defense scoring profiles
        run: |
          python scripts/build_ncaam_scoring_profiles.py --source historical-normalized --out historical-report/ncaam-team-scoring-profiles.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-team-scoring-profiles.json'))
          assert d['team_count']==365
          assert d['previous_season_games']>3000
          assert all(t['tempo_possessions'] is None for t in d['teams'])
          PY
      - name: Reconstruct 2026-27 multistat Elo research challenger
        run: |
          python scripts/build_ncaam_2027_multistat_challenger.py --box historical-normalized/ncaa_mbb_player_box_2026.csv.gz --output historical-report/ncaam-2026-27-multistat-challenger.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-2026-27-multistat-challenger.json'))
          assert d['team_count']==365 and d['published_elo_changed'] is False
          assert len({t['team_id'] for t in d['teams']})==365
          PY
          cp historical-report/ncaam-2026-27-multistat-challenger.json data/ncaam-2026-27-multistat-challenger.json
          python scripts/test_ncaam_multistat_release.py
      - name: Calibrate current game Elo K and margin multipliers on untouched 2026 holdout
        run: |
          python scripts/calibrate_ncaam_game_elo.py --source historical-normalized --output historical-report/ncaam-elo-k-mov-historical-calibration.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-elo-k-mov-historical-calibration.json'))
          assert d['training_selected']['games'] >= 5000
          assert d['identical_game_count']
          assert d['holdout_baseline']['games'] >= 3000
          assert d['eligible_for_automatic_live_promotion'] is False
          print('PASS: 2026 unseen games held separate from parameter selection')
          PY
      - name: Validate separated Elo update speed and blowout slope
        run: |
          python scripts/calibrate_ncaam_centered_margin.py --source historical-normalized --output historical-report/ncaam-elo-centered-margin-validation.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-elo-centered-margin-validation.json'))
          assert d['validation_selected']['games']>=3000
          assert d['validation_selected']['games']==d['validation_current_formula']['games']
          assert d['eligible_for_automatic_live_promotion'] is False
          PY
      - name: Test roster-turnover-specific early-season Elo speed (research only)
        run: |
          python scripts/backtest_ncaam_turnover_update_speed.py --source historical-normalized --output historical-report/ncaam-turnover-update-speed-retrospective.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-turnover-update-speed-retrospective.json'))
          assert d['no_automatic_production_promotion']
          assert len(d['trials'])==8
          assert d['diagnostic_2026_baseline']['games']==d['diagnostic_2026_selected']['games']
          PY
      - name: Audit historical NCAA shooting rebounding passing and defensive data
        run: |
          python scripts/audit_ncaam_historical_multistat_coverage.py --source historical-normalized --out historical-report/ncaam-historical-multistat-coverage.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-historical-multistat-coverage.json'))
          assert all(d['years'][str(y)]['rows']>50000 for y in (2023,2024,2025,2026))
          assert d['production_elo_changed'] is False
          PY
      - name: Reconstruct previous-school strength from historical player identities
        run: |
          python scripts/audit_ncaam_historical_transfer_origin.py --source historical-normalized --output historical-report/ncaam-historical-transfer-origin-evidence.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-historical-transfer-origin-evidence.json'))
          assert d['production_approved'] is False
          assert d['season_data']['2026']['audit']['matched_transfer_records']>100
          PY
      - name: Evaluate combined NCAA player-quality and roster-turnover model
        run: |
          python scripts/backtest_ncaam_combined_elo.py --source historical-normalized --output historical-report/ncaam-combined-elo-research.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-combined-elo-research.json'))
          assert d['automatic_promotion'] is False
          assert d['transfers_origin_included_in_scoring'] is True
          assert d['transfer_origin_audits']['2026']['matched_transfer_records'] > 100
          assert len(d['trials'])==135
          assert set(d['multistat_ablation_winners'])=={'none','shooting','playmaking','defense','all'}
          assert d['historical_multistat_audits']['2026']['teams_with_verified_prior_stats'] > 250
          assert d['diagnostic_baseline']['games']==d['diagnostic_combined']['games']
          PY
      - name: Run identical-game NCAA roster incumbent vs exact player-quality v3 challenger
        run: |
          python scripts/backtest_ncaam_exact_challenger_v3.py --source historical-normalized --output historical-report/ncaam-exact-challenger-v3-head-to-head.json
          python - <<'PY'
          import json
          p='historical-report/ncaam-exact-challenger-v3-head-to-head.json'
          d=json.load(open(p))
          assert d['same_game_replay']
          assert d['holdout_games']>=1000
          assert not d['preopening_asof_certified']
          print('RESULT:',d['holdout_games'],'games; challenger wins both:',d['challenger_wins_both'])
          PY
      - name: Calibrate separate shooting playmaking and defense weights chronologically
        run: |
          python scripts/calibrate_ncaam_independent_stat_weights.py --source historical-normalized --out historical-report/ncaam-independent-stat-weights.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-independent-stat-weights.json'))
          assert d['auto_promote'] is False
          assert d['games_identical'] is True
          assert len(d['grid'])==125
          assert len(d['regularization_sensitivity'])==5
          assert all(v['validation_2025']['games']==d['selected_validation']['games'] for v in d['regularization_sensitivity'].values())
          assert isinstance(d['selected_at_grid_boundary'],bool)
          PY
      - name: Audit realized Elo-point impact of coefficient grid boundaries
        run: |
          cp historical-report/ncaam-independent-stat-weights.json data/ncaam-independent-stat-weights.json
          python scripts/audit_ncaam_coefficient_impact.py --source historical-normalized --out historical-report/ncaam-stat-coefficient-impact.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-stat-coefficient-impact.json'))
          assert d['production_promotion_allowed'] is False
          assert len(d['actual_stat_elo_effects'])==3
          assert all(x['covered_teams']>250 for x in d['actual_stat_elo_effects'].values())
          PY
      - name: Optimize continuous player-stat coefficients and compare future seasons
        run: |
          python scripts/optimize_ncaam_continuous_stat_weights.py --source historical-normalized --out historical-report/ncaam-continuous-stat-optimizer.json
          python - <<'PY'
          import json,math
          d=json.load(open('historical-report/ncaam-continuous-stat-optimizer.json'))
          assert d['production_promotion_allowed'] is False
          assert d['validation_2025']['games']==d['prior_grid_validation_2025']['games']
          assert all(math.isfinite(x) and x>=0 for x in d['selected_weights'].values())
          PY
      - name: Check continuous optimizer rating impacts and initialization stability
        run: |
          python scripts/audit_ncaam_continuous_optimizer_impact.py --source historical-normalized --out historical-report/ncaam-continuous-impact-audit.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-continuous-impact-audit.json'))
          assert d['production_promotion_allowed'] is False
          assert len(d['seasons'])==3
          assert d['starts_training_loss_gap']>=0
          PY
      - name: Test predictive quality by size of preseason statistical adjustment
        run: |
          cp historical-report/ncaam-continuous-stat-optimizer.json data/ncaam-continuous-stat-optimizer.json
          python scripts/audit_ncaam_adjustment_size_buckets.py --source historical-normalized --out historical-report/ncaam-continuous-size-buckets.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-continuous-size-buckets.json'))
          assert d['production_promotion_allowed'] is False
          for year in ('2025','2026'):
            rows=d['results'][year]['game_bucket_by_max_team_adjustment']
            assert sum(r['n'] for r in rows.values())>5000
          PY
      - name: Audit NCAA high adjustment prediction gains by coverage and timing
        run: |
          python scripts/audit_ncaam_stat_coverage_timing.py --source historical-normalized --out historical-report/ncaam-stat-adjustment-coverage-timing.json
          python - <<'PY'
          import json
          x=json.load(open('historical-report/ncaam-stat-adjustment-coverage-timing.json'))
          assert x['production_promotion_allowed'] is False
          assert all(sum(a['games'] for a in x['results'][y]['groups'])>5000 for y in ('2025','2026'))
          PY
      - name: Audit matched historical players and playing minutes by adjustment band
        run: |
          python scripts/audit_ncaam_stat_player_match_coverage.py --source historical-normalized --out historical-report/ncaam-stat-player-match-audit.json
          python - <<'PY'
          import json
          d=json.load(open('historical-report/ncaam-stat-player-match-audit.json'))
          assert d['production_promotion_allowed'] is False
          assert all(d['years'][str(y)]['teams']>250 for y in (2024,2025,2026))
          PY
      - name: Test coverage-aware player-stat shrinkage against no shrinkage
        run: |
          python scripts/backtest_ncaam_coverage_shrinkage.py --source historical-normalized --out historical-report/ncaam-coverage-shrinkage.json
          python - <<'PY'
          import json
          x=json.load(open('historical-report/ncaam-coverage-shrinkage.json'))
          assert len(x['trials'])==5 and not x['production_promotion_allowed']
          assert all(r['validation_2025']['games']==x['unshrunk_validation_2025']['games'] for r in x['trials'])
          PY
      - name: Backtest use of recovered two-year-old athlete history
        run: |
          python scripts/backtest_ncaam_multiyear_stat_recovery.py --source historical-normalized --out historical-report/ncaam-two-year-stat-recovery-backtest.json
          python - <<'PY'
          import json
          r=json.load(open('historical-report/ncaam-two-year-stat-recovery-backtest.json'))
          assert r['production_promotion_allowed'] is False
          assert len(r['trials'])==4
          assert all(t['training_2025']['games']==r['baseline']['training_2025']['games'] for t in r['trials'])
          PY
      - name: Run real NCAA historical player-quality backtest
        run: |
          python scripts/backtest_ncaam_quality_retrospective.py \
            --source historical-normalized \
            --output historical-report/ncaam-player-quality-retrospective-backtest.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('historical-report/ncaam-player-quality-retrospective-backtest.json').read_text())
          assert r['holdout_minutes_only']['games'] >= 1000
          assert r['holdout_minutes_plus_quality']['games'] == r['holdout_minutes_only']['games']
          assert r['production_approval'] is False
          assert r['status']=='RETROSPECTIVE_DIAGNOSTIC_NOT_ASOF_PRESEASON_VALIDATED'
          print('PASS:',r['holdout_minutes_only']['games'],'holdout games with no misleading production promotion')
          PY
      - name: Run strictly dated in-season 2024–25 train and 2026 holdout
        run: |
          python scripts/backtest_ncaam_quality_earlyseason_asof.py \
            --source historical-normalized \
            --output historical-report/ncaam-quality-earlyseason-asof-backtest.json
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('historical-report/ncaam-quality-earlyseason-asof-backtest.json').read_text())
          assert o['holdout_minutes']['games']>1000
          assert o['holdout_quality']['games']==o['holdout_minutes']['games']
          assert o['status']=='CHRONOLOGICALLY_VALID_EARLYSEASON_NOT_PRESEASON'
          assert o['preseason_release_approved'] is False
          print('CHECKED:',o['holdout_minutes']['games'],'real post-cutoff 2026 contests')
          PY
      - name: Generate and validate 365-team player-quality PRESEASON shadow
        run: |
          python scripts/build_ncaam_2027_quality_shadow.py \
            --historical-player-box historical-normalized/ncaa_mbb_player_box_2026.csv.gz \
            --study historical-report/ncaam-quality-earlyseason-asof-backtest.json \
            --out historical-report/ncaam-2026-27-scoring-quality-shadow.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('historical-report/ncaam-2026-27-scoring-quality-shadow.json').read_text())
          assert report['team_count']==365
          assert report['status']=='SHADOW_ONLY_DO_NOT_PROMOTE'
          assert report['production_elo_approved'] is False
          assert report['preseason_asof_certified'] is False
          assert len({r['team_id'] for r in report['rankings']})==365
          assert report['source_integrity']['matched_verified_history']==2923
          assert report['source_integrity']['fallback_team_count']==1
          print('CHECKED: 365 experimental player-quality adjusted NCAA ratings, not official Elo')
          PY
      - name: Reproduce four NCAA athlete IDs for official 2026-27 D-I transfers
        run: |
          python scripts/replay_ncaam_official_transfer_source_ids.py \
            --parquet historical-data/ncaa_mbb_player_box_2026.parquet \
            --csv historical-normalized/ncaa_mbb_player_box_2026.csv.gz \
            --out historical-report/ncaam-2026-27-four-player-source-replay.json
          python scripts/replay_ncaam_official_transfer_source_ids.py \
            --parquet historical-data/ncaa_mbb_player_box_2026.parquet \
            --csv historical-normalized/ncaa_mbb_player_box_2026.csv.gz \
            --out historical-report/ncaam-2026-27-four-player-source-replay.json --verify
      - name: Recover 2025–26 transfer scoring by strict NCAA athlete ID
        run: |
          python scripts/recover_ncaam_prior_player_stats_by_id.py \
            --player-box historical-normalized/ncaa_mbb_player_box_2026.csv.gz \
            --out historical-report/ncaam-2026-27-id-history-recoveries.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('historical-report/ncaam-2026-27-id-history-recoveries.json').read_text())
          assert x['source_linked_players']==3523
          assert x['original_measured_players']==2923
          assert x['source_unmeasured_links']==600
          assert x['changes_to_published_elo'] is False
          assert x['automatically_promoted'] is False
          assert x['recovered_eligible_for_future_review']<=600
          assert len({r['current_espn_id'] for r in x['verified_historical_id_recoveries']})==x['recovered_eligible_for_future_review']
          print('STRICT ID RECOVERIES:',x['recovered_eligible_for_future_review'])
          PY
      - name: Publish acquisition status to the newspaper repository
        if: always()
        shell: bash
        run: |
          mkdir -p data historical-report
          if [ ! -s historical-report/ncaam-historical-acquisition.json ]; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          Path('historical-report/ncaam-historical-acquisition.json').write_text(json.dumps({
              'status':'DOWNLOAD_OR_SETUP_FAILED',
              'run_id':os.environ.get('GITHUB_RUN_ID'),
              'failure':'No source audit was generated; inspect this GitHub Actions run'
          },indent=2) + chr(10))
          PY
          fi
          cp historical-report/ncaam-historical-acquisition.json data/ncaam-historical-acquisition-status.json
          if [ -s historical-report/ncaam-two-year-stat-recovery-backtest.json ]; then
