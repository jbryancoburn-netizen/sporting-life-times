name: Cache authentic 1980s NBA crests for visual preview
on:
  push:
    branches:
      - feat/nba-vintage-crests-bolder-rings-20261113
    paths:
      - scripts/cache-nba-vintage-logos.py
      - data/nba-vintage-logos.json
      - .github/workflows/nba-vintage-logo-cache.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoding libraries
        run: python -m pip install --disable-pip-version-check --quiet pillow cairosvg
      - name: Download and individually verify the thirty authentic-era images
        run: python scripts/cache-nba-vintage-logos.py
      - name: Commit exactly the 30 archival PNGs and verification manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nba-vintage-logos/ data/nba-vintage-logo-audit.json
          test "$(find assets/nba-vintage-logos -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 30
          if git diff --cached --quiet; then
            echo "All 30 archival marks already present"
            exit 0
          fi
          git commit -m "Cache 30 verified high-resolution historical NBA crests"
          for attempt in 1 2 3 4; do
            git fetch origin feat/nba-vintage-crests-bolder-rings-20261113
            git rebase origin/feat/nba-vintage-crests-bolder-rings-20261113
            if git push origin HEAD:feat/nba-vintage-crests-bolder-rings-20261113; then
              echo "PASS: 30 actual historic logos stored on feature branch"
              exit 0
            fi
          done
          exit 1
