name: Verify CBB home road neutral notation (one-off)
on:
  push:
    branches:
      - fix/cbb-form-book-opponent-site-notation-20261113
    paths:
      - .github/workflows/one-off-cbb-site-notation.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify men's and women's opponent notation with fixtures
        run: |
          node --test tests/cbb-team-form.test.cjs tests/cbb-opponent-notation.test.cjs
          node tests/mbb-calendar-finals.test.cjs
      - name: Static validation of updated scripts
        run: |
          node --check cbb-team-form.js
          node --check mbb-team-calendar-boot.js
          node --check wbb-team-newspaper.js
