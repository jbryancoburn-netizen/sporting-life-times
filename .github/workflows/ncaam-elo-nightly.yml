name: NCAA men's 2026-27 Elo nightly refresh
on:
  schedule:
    - cron: '25 10 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_ncaam_2027.py'
      - 'scripts/test_ncaam_elo.py'
      - 'scripts/replay_ncaam_espn_2027.py'
      - 'scripts/test_replay_ncaam_espn_2027.py'
      - 'data/ncaam-2026-27-espn-team-crosswalk.json'
      - '.github/workflows/ncaam-elo-nightly.yml'
permissions:
  contents: write
concurrency:
  group: ncaam-elo-nightly
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent Elo tests
        run: python -m unittest discover -s scripts -p test_ncaam_elo.py -v
      - name: Verify secondary-provider end-to-end Elo replay tests
        run: python -m unittest discover -s scripts -p test_replay_ncaam_espn_2027.py -v
      - name: Reconcile season membership and replay NCAA-origin finals
        run: python scripts/update_ncaam_2027.py
      - name: Replay verified ESPN final results if NCAA-origin season archive is not published
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          ready=json.loads(Path('data/ncaam-source-readiness.json').read_text()).get('ready') is True
          if not ready:
              print('NCAA-origin season archive unavailable; validate ESPN final-score replay')
              subprocess.run([sys.executable,'scripts/replay_ncaam_espn_2027.py'],check=True)
          else:
              print('NCAA-origin results available; ESPN fallback not needed')
          PY
      - name: Verify output schema before publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('data')
          state=json.loads((base/'ncaam-source-readiness.json').read_text())
          if state['ready']:
              out=json.loads((base/'ncaam-2026-27-current-provisional.json').read_text())
              assert out['team_count']==365
              assert len(out['rankings'])==365
              assert out['games_played']==len(out['events'])
              assert len({t['team_id'] for t in out['rankings']})==365
              assert out['status']=='provisional-current-venue-neutral'
              assert all(isinstance(t['elo'],(int,float)) for t in out['rankings'])
              assert all(t['rank']==i for i,t in enumerate(out['rankings'],1))
              assert all(out['rankings'][i-1]['elo']>=out['rankings'][i]['elo'] for i in range(1,365))
              print('Verified',out['games_played'],'real games')
          else:
              assert not (base/'ncaam-2026-27-current-provisional.json').exists()
              print('Historical preseason remains primary: unreleased new-season data.')
          PY
      - name: Commit changed verified source readiness and ratings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaam-source-readiness.json
          if [ -f data/ncaam-2026-27-current-provisional.json ]; then git add data/ncaam-2026-27-current-provisional.json; fi
          if git diff --cached --quiet; then echo "No changed data"; exit 0; fi
          git commit -m "Refresh NCAA D1 men source status and independent Elo ratings"
          git pull --rebase origin main
          git push origin HEAD:main
