name: MBB team news
on:
  push:
    paths:
      - 'scripts/refresh_mbb_team_news.py'
      - '.github/workflows/mbb-team-news.yml'
  workflow_dispatch:
  schedule:
    - cron: "13 */3 * * *"
permissions:
  contents: write
concurrency:
  group: mbb-team-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect reported school-specific basketball stories
        run: python scripts/refresh_mbb_team_news.py
      - name: Publish team news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-team-news/
          if ! git diff --cached --quiet; then
            git commit -m "Update MBB team reporting feeds"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
