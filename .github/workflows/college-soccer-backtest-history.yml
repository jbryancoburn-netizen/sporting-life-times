name: USRS soccer historical backtest collection
on:
  workflow_dispatch:
  schedule:
    - cron: '43 7 * * *'
  push:
    paths:
      - 'scripts/collect_college_soccer_history.py'
      - '.github/workflows/college-soccer-backtest-history.yml'
permissions:
  contents: write
concurrency:
  group: soccer-backtest-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect 2023-2025 men's D-I soccer finals
        run: python scripts/collect_college_soccer_history.py --years 2023 2024 2025 --max-days-per-year 153
      - name: Run preliminary historical Elo holdout backtest
        if: always()
        run: python scripts/backtest_college_soccer_elo.py --preliminary
      - name: Run expanded 336-configuration validation and holdout
        if: always()
        run: python scripts/backtest_college_soccer_expanded.py
      - name: Run certified historical Elo holdout backtest when complete
        if: always()
        run: |
          python scripts/backtest_college_soccer_elo.py || echo 'Full-season certification pending; preliminary results retained.'
      - name: Report historical collection progress
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          for year in (2023,2024,2025):
              p=pathlib.Path(f'data/college-soccer-history/men-d1-{year}.json')
              if not p.exists():
                  print(f'::error::{year}: historical file missing')
                  continue
              d=json.loads(p.read_text())
              n=len(d.get('checked_dates',[]))
              print(f'{year}: {n}/153 dates; {len(d.get("games",[]))} games; {len(d.get("errors",[]))} errors')
              if n<153: print(f'::warning::{year}: {153-n} historical dates remain')
          PY
      - name: Commit collected historical results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d data/college-soccer-history ]; then exit 0; fi
          git add data/college-soccer-history/
          if ! git diff --cached --quiet; then
            git commit -m "Collect historical men's soccer finals for Elo backtest"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
              sleep $((attempt * 3))
            done
            echo "::error::Historical results could not be pushed after five attempts"
            exit 1
          fi
