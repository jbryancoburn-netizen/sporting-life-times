name: USRS soccer historical backtest collection
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect_college_soccer_history.py'
      - '.github/workflows/college-soccer-backtest-history.yml'
permissions:
  contents: write
concurrency:
  group: soccer-backtest-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect 2023-2025 men's D-I soccer finals
        run: python scripts/collect_college_soccer_history.py --years 2023 2024 2025
      - name: Commit verified historical results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/college-soccer-history/
          if ! git diff --cached --quiet; then
            git commit -m "Collect historical men's soccer finals for Elo backtest"
            git push
          fi
