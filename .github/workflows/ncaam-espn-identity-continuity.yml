name: NCAA ESPN Athlete Identity Continuity
on:
  push:
    paths:
      - scripts/collect_ncaam_roster_evidence.py
      - scripts/recover_ncaam_2014_espn_ids.py
      - scripts/reconcile_ncaam_verified_espn_ids.py
      - scripts/test_reconcile_ncaam_verified_espn_ids.py
      - scripts/summarize_ncaam_verified_movements.py
      - scripts/audit_ncaam_verified_production_coverage.py
      - scripts/test_audit_ncaam_verified_production_coverage.py
      - scripts/audit_ncaam_identity_exposure.py
      - scripts/test_audit_ncaam_identity_exposure.py
      - scripts/audit_ncaam_identity_temporal_integrity.py
      - scripts/test_audit_ncaam_identity_temporal_integrity.py
      - scripts/diagnose_ncaam_roster_gaps.py
      - scripts/test_diagnose_ncaam_roster_gaps.py
      - .github/workflows/ncaam-espn-identity-continuity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_reconcile_ncaam_verified_espn_ids.py -v
      - run: python -m unittest discover -s scripts -p test_audit_ncaam_verified_production_coverage.py -v
      - run: python -m unittest discover -s scripts -p test_audit_ncaam_identity_exposure.py -v
      - run: python -m unittest discover -s scripts -p test_audit_ncaam_identity_temporal_integrity.py -v
      - run: python -m unittest discover -s scripts -p test_diagnose_ncaam_roster_gaps.py -v
      - run: python scripts/collect_ncaam_roster_evidence.py --season 2026 --min-players 1 --out staging/ncaam-2026-roster-evidence.json
      - run: python scripts/collect_ncaam_roster_evidence.py --season 2027 --out staging/ncaam-2027-roster-evidence.json
      - run: python scripts/recover_ncaam_2014_espn_ids.py
      - run: python scripts/diagnose_ncaam_roster_gaps.py
      - run: python scripts/reconcile_ncaam_verified_espn_ids.py
      - run: python scripts/summarize_ncaam_verified_movements.py
      - run: python scripts/audit_ncaam_verified_production_coverage.py
      - run: python scripts/build_ncaam_player_opponent_elo.py
      - run: python scripts/audit_ncaam_identity_exposure.py
      - run: python scripts/audit_ncaam_identity_temporal_integrity.py
      - uses: actions/upload-artifact@v4
        with:
          name: ncaam-espn-identity-continuity
          path: |
            staging/ncaam-unlinked-2014-espn-id-recovery.json
            data/ncaam-2026-27-espn-identity-continuity.json
            data/ncaam-2026-27-verified-movement-team-audit.json
            data/ncaam-2026-27-verified-production-coverage.json
            data/ncaam-2026-27-verified-movement-opponent-exposure.json
            data/ncaam-2026-27-identity-temporal-gate.json
            data/ncaam-2026-27-roster-gap-diagnostics.json
