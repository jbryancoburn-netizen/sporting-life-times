name: Verify 18-school ACC 1980s audit gallery (one-off)
on:
  push:
    branches:
      - feat/acc-1980s-18-school-logo-audit-20261114
    paths:
      - tests/cbb-acc-heritage-gallery.test.cjs
      - .github/workflows/one-off-acc-gallery-test.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify archived logos and no production replacements
        run: node --test tests/cbb-acc-heritage-gallery.test.cjs
      - name: Verify exactly 18 real local PNG assets
        run: |
          ls -l assets/cbb-acc-1980s/*.png
          python - <<'PY'
          from pathlib import Path
          assert len(list(Path('assets/cbb-acc-1980s').glob('*.png')))==18
          assert Path('cbb-acc-1980s-preview.html').stat().st_size>10000
          print('PASS: 18 production-independent preview files and intact 18-school audit')
          PY
