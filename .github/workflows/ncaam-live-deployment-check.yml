name: NCAA Elo live newspaper deployment verification
on:
  push:
    paths:
      - 'ncaam-elo.html'
      - 'ncaam-elo-page.js'
      - 'data/ncaam-2026-27-scoring-quality-shadow.json'
      - 'data/ncaam-2026-27-preseason-roster-informed.json'
      - 'scripts/verify_ncaam_publication.py'
      - '.github/workflows/ncaam-live-deployment-check.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * *'
permissions:
  contents: write
concurrency:
  group: ncaam-live-page-smoke
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check actual public NCAA Elo files until GitHub Pages matches
        run: python scripts/verify_ncaam_publication.py --tries 18 --pause 12
      - name: Preserve exact live website verification result
        if: always()
        run: |
          if [ ! -f data/ncaam-publication-status.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          Path('data/ncaam-publication-status.json').write_text(json.dumps({
            'status':'FAIL','last_error':'Public HTTP verifier did not produce a report',
            'attempts':0,'files':[]},indent=2)+'\n')
          PY
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ncaam-publication-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record public NCAA Elo research publication HTTP audit'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1
