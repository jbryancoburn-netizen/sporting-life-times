name: Indiana boys varsity basketball results
on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 0-5,20-23 * 11,12,1,2,3,4 *'
permissions:
  contents: write
concurrency:
  group: indiana-boys-results
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'lxml>=5,<7'
      - name: Collect confirmed results
        id: collect
        continue-on-error: true
        run: python scripts/refresh-indiana-boys-results.py
      - name: Commit updated score data
        run: |
          if git diff --quiet -- data/indiana-boys-results.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/indiana-boys-results.json
          git commit -m 'Refresh Indiana boys varsity basketball finals'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
          done
          exit 1
      - name: Flag source failures
        if: steps.collect.outcome == 'failure'
        run: exit 1
