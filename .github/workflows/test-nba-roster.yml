name: Validate NBA roster Elo
on:
  push:
    paths:
      - 'scripts/nba_roster_elo.py'
      - 'test_nba_roster_elo.py'
      - '.github/workflows/test-nba-roster.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test roster Elo coverage, injury adjustment and input validation
        run: python -m unittest -v test_nba_roster_elo
