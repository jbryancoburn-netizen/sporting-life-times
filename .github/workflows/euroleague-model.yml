name: EuroLeague independent Elo
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/euroleague_model.py'
      - 'scripts/euroleague_diagnose.py'
      - 'scripts/test_euroleague_model.py'
      - '.github/workflows/euroleague-model.yml'
  schedule:
    - cron: '18,48 * * * *'
permissions:
  contents: write
concurrency:
  group: euroleague-model
  cancel-in-progress: false
jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Elo ingestion and invariants
        run: python -m unittest discover -s scripts -p "test_euroleague_model.py" -v
      - name: Probe live EuroLeague source schema (advisory only)
        continue-on-error: true
        run: python scripts/euroleague_diagnose.py
      - name: Rebuild from EuroLeague completed games
        run: python scripts/euroleague_model.py
      - name: Validate generated publication schema
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          path=pathlib.Path("data/euroleague-model.json")
          data=json.loads(path.read_text())
          teams=data.get("rankings",[])
          standings=data.get("standings",[])
          finals=data.get("games_completed",0)
          assert data.get("season")=="2026-27"
          assert 18 <= len(teams) <= 24
          assert len(standings)==len(teams)
          assert len({t["code"] for t in teams})==len(teams)
          assert finals>0
          assert sum(t["wins"] for t in standings)==finals
          assert sum(t["losses"] for t in standings)==finals
          assert all(isinstance(t["elo"],(int,float)) for t in teams)
          print("Validated EuroLeague publication:",len(teams),"teams,",finals,"finals")
          PY
      - name: Preserve source diagnostics on failure
        if: failure()
        run: |
          mkdir -p diagnostics
          python scripts/euroleague_diagnose.py > diagnostics/euroleague-source.txt 2>&1 || true
          python -m unittest discover -s scripts -p "test_euroleague_model.py" -v > diagnostics/euroleague-tests.txt 2>&1 || true
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: euroleague-failure-diagnostics
          path: diagnostics/
          retention-days: 7
      - name: Publish only verified model data changes
        run: |
          if ! git diff --quiet -- data/euroleague-model.json || [ -n "$(git ls-files --others --exclude-standard data/euroleague-model.json)" ]; then
            git config user.name "sporting-life-times-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/euroleague-model.json
            git commit -m "Update EuroLeague Elo and projected games"
            git pull --rebase
            git push
          fi
