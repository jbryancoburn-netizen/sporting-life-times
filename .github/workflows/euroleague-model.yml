name: EuroLeague independent Elo
on:
  workflow_dispatch:
  schedule:
    - cron: '18,48 * * * *'
permissions:
  contents: write
concurrency:
  group: euroleague-model
  cancel-in-progress: false
jobs:
  ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Elo ingestion and invariants
        run: python -m unittest discover -s scripts -p "test_euroleague_model.py" -v
      - name: Rebuild from EuroLeague completed games
        run: python scripts/euroleague_model.py
      - name: Publish only verified model data changes
        run: |
          if ! git diff --quiet -- data/euroleague-model.json || [ -n "$(git ls-files --others --exclude-standard data/euroleague-model.json)" ]; then
            git config user.name "sporting-life-times-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/euroleague-model.json
            git commit -m "Update EuroLeague Elo and projected games"
            git push
          fi
