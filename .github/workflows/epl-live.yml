name: EPL verified results and independent Elo
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: epl-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild verified EPL snapshot
        run: python scripts/update_epl_live.py
      - name: Record scheduler heartbeat
        if: always()
        env:
          TRIGGER: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python -c 'import datetime,json,os,pathlib; p=pathlib.Path("data/epl-pipeline-status.json"); p.write_text(json.dumps({"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"trigger":os.environ["TRIGGER"],"run_id":os.environ["RUN_ID"],"job_status":os.environ["JOB_STATUS"]},indent=2)+chr(10))'
      - name: Commit matched Elo and forecast exports
        run: |
          git config user.name "sporting-life-times-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epl-ratings.json data/epl-match-center.json multi_scoreboards.json data/epl-pipeline-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update EPL verified finals, standings, Elo and forecasts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish heartbeat even when EPL rebuild fails
        if: failure()
        run: |
          git config user.name "sporting-life-times-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epl-pipeline-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record failed EPL update attempt"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
