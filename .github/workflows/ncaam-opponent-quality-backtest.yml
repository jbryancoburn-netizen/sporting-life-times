name: NCAA Opponent Quality Historical Backtest
on:
  push:
    paths:
      - scripts/backtest_ncaam_opponent_quality.py
      - scripts/test_ncaam_opponent_quality.py
      - scripts/test_ncaam_incremental_player_scoring.py
      - scripts/test_ncaam_opponent_quality_date_batch.py
      - scripts/test_ncaam_opponent_exposure_integrity.py
      - scripts/verify_ncaam_opponent_quality_promotion.py
      - scripts/test_ncaam_opponent_quality_promotion.py
      - .github/workflows/ncaam-opponent-quality-backtest.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_ncaam_opponent_quality.py -v
      - run: python -m unittest discover -s scripts -p test_ncaam_incremental_player_scoring.py -v
      - run: python -m unittest discover -s scripts -p test_ncaam_opponent_quality_date_batch.py -v
      - run: python -m unittest discover -s scripts -p 'test_ncaam_opponent_exposure_integrity.py' -v
      - run: python -m unittest discover -s scripts -p 'test_ncaam_opponent_quality_promotion.py' -v
      - name: Run historical opponent-quality train/holdout
        run: python scripts/backtest_ncaam_opponent_quality.py
      - name: Classify calibration evidence and enforce non-promotion
        run: python scripts/verify_ncaam_opponent_quality_promotion.py --require-report --report data/ncaam-opponent-quality-backtest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncaam-opponent-quality-holdout-backtest
          path: data/ncaam-opponent-quality-backtest.json
          if-no-files-found: warn
      - name: Commit historical holdout evidence to repository
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          test -s data/ncaam-opponent-quality-backtest.json
          python -m json.tool data/ncaam-opponent-quality-backtest.json > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaam-opponent-quality-backtest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record reproducible NCAA opponent-quality historical holdout [skip ci]"
            git push
          fi
