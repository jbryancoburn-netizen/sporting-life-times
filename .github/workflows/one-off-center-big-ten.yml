name: Normalize historical Big Ten artwork (one-off)
on:
  push:
    branches:
      - fix/big-ten-source-centering-20261113
    paths:
      - scripts/center_big_ten_originals.py
      - .github/workflows/one-off-center-big-ten.yml
permissions:
  contents: write
jobs:
  center:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for source PNG normalization
        run: python -m pip install 'pillow>=10,<12'
      - name: Center original logos inside the raster files
        run: python scripts/center_big_ten_originals.py
      - name: Verify no browser-based offsets or external URLs remain
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('cbb-big-ten-1980s-preview.html').read_text()
          assert len(re.findall(r'<img src="assets/cbb-big-ten-1980s/centered/',html))==14
          assert 'cbb-big-ten-optical-center' not in html
          assert '--slt-ink-' not in html
          assert len(list(Path('assets/cbb-big-ten-1980s/centered').glob('*.png')))==10
          print('PASS: all 14 uses and all 10 source assets')
          PY
      - name: Save corrected logo images to this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cbb-big-ten-1980s-preview.html assets/cbb-big-ten-1980s/centered/
          if ! git diff --cached --quiet; then
            git commit -m 'Replace offset scripts with 10 centered Big Ten source PNGs'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
