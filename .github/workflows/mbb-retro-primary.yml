name: Publish MBB RETRO Primary
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mbb-retro-primary.yml
      - scripts/publish-mbb-retro-primary.js
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculate RETRO baseline and preseason
        run: node scripts/publish-mbb-retro-primary.js
      - name: Publish verified RETRO primary ratings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaam-2026-27-retro-primary.json
          git diff --cached --quiet || (git commit -m "Publish MBB RETRO primary preseason ratings" && git push)
