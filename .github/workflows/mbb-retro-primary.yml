name: Publish MBB RETRO Primary
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mbb-retro-primary.yml'
      - 'scripts/publish-mbb-retro-primary.js'
      - 'scripts/collect-mbb-retro-finals.py'
      - 'mbb-retro.js'
  schedule:
    - cron: '6,26,46 0-7 * 11,12,1,2,3,4'
    - cron: '16 12 * * *'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate MBB replay sources
        run: node --check scripts/publish-mbb-retro-primary.js
      - name: Collect recent verified Division I final scores
        run: python3 scripts/collect-mbb-retro-finals.py
      - name: Rebuild 1500-start RETRO ratings
        run: node scripts/publish-mbb-retro-primary.js
      - name: Verify clean slate and publish
        run: |
          node -e "const d=require('./data/ncaam-2026-27-retro-primary.json');if(d.starting_elo!==1500||d.rankings.length!==365||d.events.length!==d.games_played||d.rankings.some(x=>x.base_elo!==1500))process.exit(1);"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaam-2026-27-retro-primary.json data/mbb-retro-live-finals.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh live NCAA Division I 1500-start RETRO"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep 2
          done
          exit 1
