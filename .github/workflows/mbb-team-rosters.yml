name: MBB all-school roster refresh
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh_mbb_team_rosters.py'
      - '.github/workflows/mbb-team-rosters.yml'
  schedule:
    - cron: "43 8 * * *"
permissions:
  contents: write
concurrency:
  group: mbb-roster-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh missing rosters without overwriting university athletics sources
        run: python scripts/refresh_mbb_team_rosters.py
      - name: Publish team roster data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-rosters-2026-27/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh current college basketball rosters"
            git push
          fi
