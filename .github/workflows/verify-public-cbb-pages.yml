name: Verify Public CBB Power Rankings and Forecast Receipts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-cbb-pages.yml'
      - 'ncaam-elo.html'
      - 'ncaam-rankings.html'
      - 'ncaaw-rankings.html'
      - 'mbb-logo-system.css'
  pull_request:
    paths:
      - '.github/workflows/verify-public-cbb-pages.yml'
  workflow_dispatch:
jobs:
  verify-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public GitHub Pages HTTP and deployed assets
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, sys, json
          base='https://jbryancoburn-netizen.github.io/sporting-life-times/'
          pages={
            'men-power':('ncaam-elo.html',['mbb-logo-system.css?v=power-art-20261114c','mbb-elo-primary.js?v=power-crests-20261114']),
            'men-power-polls':('ncaam-rankings.html?poll=retro',['mbb-logo-system.css?v=power-art-20261114c','--mbb-size:76px','--mbb-size:64px',"size:'power'"]),
            'women-power':('ncaaw-rankings.html?poll=retro',['wbb-rankings.js?v=power-crest-20261114','--mbb-size:82px']),
            'men-ledger':('ncaam-slate.html',['cbb-forecast-receipt.js?v=20261114','cbb-forecast-receipt.css?v=20261114']),
            'men-team':('ncaam-team.html',['cbb-forecast-receipt.js?v=20261114']),
            'women-team':('ncaaw-team.html',['cbb-forecast-receipt.js?v=20261114'])
          }
          assets=['mbb-logo-system.css?v=power-art-20261114c','mbb-elo-primary.js?v=power-crests-20261114',
             'wbb-rankings.js?v=power-crest-20261114','cbb-forecast-receipt.js?v=20261114',
             'data/ncaaw-retro-pregame-archive-2026-27.json',
             'assets/cbb-big-ten-1980s/centered/michigan-state-gruff.png',
             'assets/cbb-acc-1980s/pittsburgh.png',
             'assets/cbb-big-east-1980s/providence.png']
          failed=[]
          def fetch(path):
            req=urllib.request.Request(base+path,headers={'User-Agent':'SportingLifeTimes-Deployment-Audit/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=20) as res:
              return res.status,res.read(),res.headers.get('Content-Type','')
          try:
            _,live_css,_=fetch('mbb-logo-system.css?v=power-art-20261114c')
            css_text=live_css.decode('utf8')
            for expected in ['.cbb-elo-school .mbb-mark{--mbb-size:76px','.cbb-elo-power .mbb-mark{--mbb-size:92px','width:86%!important']:
              if expected not in css_text:failed.append(('rendered-css', [expected]))
            print('PUBLIC POWER LOGO CSS: men 76px full / 92px Power 10, artwork 86%:',not any(name=='rendered-css' for name,_ in failed),flush=True)
          except Exception as e:
            failed.append(('rendered-css',[str(e)]))
          # Prove deployed men's Power Index actually has the new size and the latest assets.
          try:
            _,men_html,_=fetch('ncaam-elo.html?liveLogoAudit=20261114m')
            men_source=men_html.decode('utf8')
            print('MEN HTML logo asset references:',[x for x in ['mbb-logo-system.css?v=power-art-20261114c','mbb-elo-primary.css?v=power-crests-20261114'] if x in men_source],flush=True)
          except Exception as e:
            failed.append(('men-cache-bypass',[str(e)]))
          try:
            _,css_live,_=fetch('mbb-logo-system.css?v=power-art-20261114c&liveLogoAudit=20261114m')
            css_new=css_live.decode('utf8')
            for needle in ['.cbb-elo-school .mbb-mark{--mbb-size:76px','.cbb-elo-power .mbb-mark{--mbb-size:92px','width:86%!important']:
              if needle not in css_new:failed.append(('men-fresh-css',[needle]))
            print('MEN LIVE CSS actual size markers:',{k:k in css_new for k in ['--mbb-size:76px','--mbb-size:92px','width:86%!important']},flush=True)
          except Exception as e:
            failed.append(('men-fresh-css',[str(e)]))
          for name,(url,required) in pages.items():
            try:
              status,data,ctype=fetch(url)
              body=data.decode('utf8')
              missing=[tag for tag in required if tag not in body]
              print(f'PUBLIC PAGE {name}: HTTP {status}, {len(data)} bytes, missing={missing}',flush=True)
              if status!=200 or missing:failed.append((name,missing or ['HTTP failure']))
            except Exception as e:
              print(f'PUBLIC PAGE {name}: ERROR {e}',flush=True);failed.append((name,[str(e)]))
          for path in assets:
            try:
              status,data,ctype=fetch(path)
              print(f'PUBLIC ASSET {path}: HTTP {status}, {len(data)} bytes, {ctype}',flush=True)
              if status!=200 or len(data)<100:failed.append((path,['missing or empty']))
              if path.endswith('.json') and 'pregame-archive' in path:
                j=json.loads(data);print('WBB ARCHIVE top-level:',list(j)[:8],flush=True)
            except Exception as e:
              print(f'PUBLIC ASSET {path}: ERROR {e}',flush=True);failed.append((path,[str(e)]))
          print('PUBLIC AUDIT RESULT:', 'PASS' if not failed else 'FAIL',failed,flush=True)
          if failed:sys.exit(1)
          PY
