name: MBB expand verified arenas and validate 365 school logos
on:
  push:
    paths:
      - '.github/workflows/mbb-expand-validate-registries.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/mbb_expand_validate_registries.py
      - name: Publish validated registries and summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-logo-registry.json data/mbb-arena-registry.json data/mbb-registry-validation-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Validate 365 MBB logo URLs and expand source-grounded arena coverage"
            git pull --rebase origin main
            git push
          fi
