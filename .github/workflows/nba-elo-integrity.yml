name: NBA Elo publication integrity
on:
  push:
    branches: [main]
    paths:
      - 'data/nba-2025-26-final.json'
      - 'data/nba-2026-27-preseason-provisional.json'
      - 'data/nba-2026-27-current-provisional.json'
      - 'scripts/audit-nba-elo.mjs'
      - 'scripts/update-nba-elo.mjs'
      - 'scripts/audit-nba-page.mjs'
      - 'nba-elo-model.js'
      - 'nba-elo-page.js'
      - 'nba.html'
      - 'nba-elo-movement.js'
      - 'nba-desk-loader.js'
      - 'nba-home.js'
      - 'scripts/test-nba-elo-movement.mjs'
      - 'scripts/test-nba-elo-render.mjs'
      - '.github/workflows/nba-elo-integrity.yml'
      - '.github/workflows/nba-elo-refresh.yml'
  pull_request:
    paths:
      - 'data/nba-2025-26-final.json'
      - 'data/nba-2026-27-preseason-provisional.json'
      - 'data/nba-2026-27-current-provisional.json'
      - 'scripts/audit-nba-elo.mjs'
      - 'scripts/update-nba-elo.mjs'
      - 'scripts/audit-nba-page.mjs'
      - 'nba-elo-model.js'
      - 'nba-elo-page.js'
      - 'nba.html'
      - 'nba-elo-movement.js'
      - 'nba-desk-loader.js'
      - 'nba-home.js'
      - 'scripts/test-nba-elo-movement.mjs'
      - 'scripts/test-nba-elo-render.mjs'
      - '.github/workflows/nba-elo-integrity.yml'
      - '.github/workflows/nba-elo-refresh.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nba-elo-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify NBA page and source ownership
        run: node scripts/audit-nba-page.mjs
      - name: Validate dated daily Elo changes and website arrows
        run: node scripts/test-nba-elo-movement.mjs
      - name: Render actual NBA power rankings and division standings from published movement snapshot
        run: node scripts/test-nba-elo-render.mjs
      - name: Verify archived and current NBA Elo consistency
        run: node scripts/audit-nba-elo.mjs
