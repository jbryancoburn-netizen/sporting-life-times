name: NBA Elo publication integrity
on:
  push:
    branches: [main]
    paths:
      - 'data/nba-2025-26-final.json'
      - 'data/nba-2026-27-preseason-provisional.json'
      - 'data/nba-2026-27-current-provisional.json'
      - 'scripts/audit-nba-elo.mjs'
      - '.github/workflows/nba-elo-integrity.yml'
  pull_request:
    paths:
      - 'data/nba-2025-26-final.json'
      - 'data/nba-2026-27-preseason-provisional.json'
      - 'data/nba-2026-27-current-provisional.json'
      - 'scripts/audit-nba-elo.mjs'
      - '.github/workflows/nba-elo-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nba-elo-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify archived and current NBA Elo consistency
        run: node scripts/audit-nba-elo.mjs
