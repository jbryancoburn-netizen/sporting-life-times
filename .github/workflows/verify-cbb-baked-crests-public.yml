name: Verify public baked CBB historic crests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-cbb-baked-crests-public.yml'
  workflow_run:
    workflows: ['Publish newspaper to GitHub Pages']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cbb-public-baked-crests
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compare all 365 published crest PNGs with approved local binaries
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from pathlib import Path
          import hashlib,json,time,urllib.request
          base='https://jbryancoburn-netizen.github.io/sporting-life-times/'
          proof=json.loads(Path('data/cbb-precomposed-crest-audit.json').read_text())
          assert proof['count']==365 and proof['vintage_count']==86 and proof['rings']==2
          def download(path):
              req=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','User-Agent':'SportingLife-CBB-Crest-Integrity'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  assert response.status==200,path
                  return response.read()
          def inspect(id):
              path='assets/cbb-precomposed-crests/'+id+'.png'
              local=Path(path).read_bytes()
              remote=download(path+'?hash='+hashlib.sha256(local).hexdigest()[:16])
              assert remote==local,'Public crest differs from approved asset: '+id
              assert remote[:8]==b'\x89PNG\r\n\x1a\n','Invalid public PNG '+id
              assert int.from_bytes(remote[16:20],'big')==512,'Wrong 512px width '+id
              return id
          for attempt in range(6):
              try:
                  with ThreadPoolExecutor(max_workers=12) as pool:
                      ids=set(f.result() for f in as_completed([pool.submit(inspect,id) for id in proof['crests']]))
                  assert len(ids)==365
                  break
              except Exception as exc:
                  if attempt==5:raise
                  print('Public asset refresh pending:',str(exc)[:250],flush=True)
                  time.sleep(12)
          required={
            'ncaam-rankings.html':['cbb-precomposed-crests/','mbb-logo-system.js?v=cbb-precomposed-20261115-v1'],
            'ncaaw-rankings.html':['ncaam-rankings.html'],
            'ncaam-slate.html':['mbb-logo-system.js?v=cbb-precomposed-20261115-v1'],
            'ncaam-team.html':['mbb-logo-system.js?v=cbb-precomposed-20261115-v1'],
            'ncaaw-team.html':['mbb-logo-system.js?v=cbb-precomposed-20261115-v1'],
            'mbb-logo-system.js':['assets/cbb-precomposed-crests/','mbb-mark--precomposed'],
            'mbb-logo-system.css':['.mbb-mark.mbb-mark--precomposed::before'],
            'wbb-rankings.js':['assets/cbb-precomposed-crests/']
          }
          for page,needles in required.items():
              text=download(page+'?crest-check='+str(int(time.time()))).decode('utf8')
              assert all(needle in text for needle in needles),'Stale public crest consumer '+page
          print('PASS PUBLIC: 365 byte-identical school crests; 86 historical originals; 363 women covered; shared two-ring renderer and published pages verified')
          PY
