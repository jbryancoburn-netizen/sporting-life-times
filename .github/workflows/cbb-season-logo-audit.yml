name: CBB season-long logo catalog audit
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/cbb-season-logo-audit.mjs
      - data/mbb-out-of-division-opponent-logos.json
      - .github/workflows/cbb-season-logo-audit.yml
  schedule:
    - cron: '25 12 * * *'
permissions:
  contents: write
concurrency:
  group: cbb-season-logo-audit
  cancel-in-progress: false
jobs:
  logo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit every published 2026-27 team calendar and repair verified logo identities
        run: node scripts/cbb-season-logo-audit.mjs
      - name: Publish catalog and audit report when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-out-of-division-opponent-logos.json data/cbb-season-logo-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh validated full-season CBB logo catalog"
            # Multiple data publishers may update main concurrently. Rebase against
            # the latest remote immediately before every bounded push attempt.
            published=0
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
              if git push origin HEAD:main; then
                published=1
                break
              fi
              sleep "$((attempt * 2))"
            done
            if [ "$published" -ne 1 ]; then
              echo "Logo catalog publication failed after 8 concurrent-writer retries" >&2
              exit 1
            fi
          fi
      - name: Require complete school-logo coverage before reporting success
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('data/cbb-season-logo-audit.json', 'utf8'));
          const unresolved = report.unresolved || [];
          const missing = Number(report.missing_after || 0);
          console.log('Calendars: ' + report.men_calendars + ' men, ' + report.women_calendars + ' women');
          console.log('Unresolved scheduled school logos: ' + missing);
          for (const row of unresolved) {
            console.log('MISSING LOGO | ' + row.id + ' | ' + row.name + ' | appearances=' + row.appearances);
          }
          if (missing || unresolved.length) {
            console.error('Full-season logo audit INCOMPLETE: unresolved team identities must be repaired and verified.');
            process.exitCode = 1;
          }
          NODE
