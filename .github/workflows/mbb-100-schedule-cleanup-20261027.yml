name: MBB one-time 100-school schedule cleanup
on:
  push:
    paths:
      - '.github/workflows/mbb-100-schedule-cleanup-20261027.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mbb-100-schedule-cleanup-20261027
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'jbryancoburn-netizen/sporting-life-times'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit and clean 100 school schedules
        run: python scripts/mbb_schedule_batch_100_20261027.py
      - name: Commit only when schedule files changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbb-schedules-2026-27/ data/mbb-100-schedule-audit-20261027.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit and update 100 MBB school schedules"
            git push
          fi
