name: MBB forecast diagnostics
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/audit_mbb_forecast.py
      - name: Save updated diagnostics
        run: |
          if ! git diff --quiet -- data/ncaam-forecast-diagnostics.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ncaam-forecast-diagnostics.json
            git commit -m "Refresh MBB forecast diagnostic report"
            git push
          fi
