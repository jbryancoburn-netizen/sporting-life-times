name: NCAA opponent-strength regression
on:
  push:
    paths:
      - 'scripts/build_ncaam_player_opponent_elo.py'
      - 'scripts/backtest_ncaam_opponent_quality.py'
      - 'scripts/test_ncaam_opponent_exposure_integrity.py'
      - '.github/workflows/ncaam-opponent-exposure-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_ncaam_opponent_exposure_integrity.py' -v
