<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBA Team Desk | The Sporting Life & Times</title><style>
:root{--paper:#faf9f6;--ink:#242421;--muted:#756f67;--rule:#d7d3cb}
