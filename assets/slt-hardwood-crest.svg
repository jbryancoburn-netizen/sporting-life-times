<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">The Sporting Life and Times Hardwood Crest</title>
<desc id="desc">An original navy and brass shield featuring a stitched basketball and the SLT newspaper insignia.</desc>
<defs>
 <linearGradient id="field" x1="0" y1="0" x2="0.85" y2="1"><stop stop-color="#244a56"/><stop offset=".62" stop-color="#0d2f3d"/><stop offset="1" stop-color="#092431"/></linearGradient>
 <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0d6a0"/><stop offset=".48" stop-color="#c79b52"/><stop offset="1" stop-color="#967141"/></linearGradient>
 <clipPath id="shield"><path d="M256 24 C360 24 439 61 453 94 L453 275 C453 370 369 451 256 490 C143 451 59 370 59 275 L59 94 C73 61 152 24 256 24Z"/></clipPath>
 <clipPath id="ball"><circle cx="256" cy="188" r="103"/></clipPath>
</defs>
<!-- Newspaper shield, not a ring placed around league artwork -->
<path d="M256 24 C360 24 439 61 453 94 L453 275 C453 370 369 451 256 490 C143 451 59 370 59 275 L59 94 C73 61 152 24 256 24Z" fill="url(#field)" stroke="url(#brass)" stroke-width="13" stroke-linejoin="round"/>
<path d="M256 43 C349 43 419 76 434 106 L434 268 C434 357 355 431 256 468 C157 431 78 357 78 268 L78 106 C93 76 163 43 256 43Z" fill="none" stroke="#e2cd9e" stroke-opacity=".7" stroke-width="2"/>
<g clip-path="url(#shield)">
 <!-- Hardwood court linework -->
 <path d="M80 307H432 M80 322H432" stroke="#c79b52" stroke-opacity=".65" stroke-width="2"/>
 <path d="M153 68H359" stroke="#e4c384" stroke-opacity=".45" stroke-width="2"/>
 <path d="M182 59V73 M330 59V73" stroke="#e4c384" stroke-opacity=".55" stroke-width="2"/>
 <!-- Ball -->
 <circle cx="256" cy="188" r="103" fill="url(#brass)" stroke="#f4e4bf" stroke-width="5"/>
 <g clip-path="url(#ball)" stroke="#0e3443" stroke-width="9" fill="none" stroke-linecap="round">
  <path d="M153 188H359 M256 85V291"/>
  <path d="M169 116C207 139 208 238 168 262"/>
  <path d="M343 116C305 139 304 238 344 262"/>
  <path d="M185 104C240 138 276 138 329 104"/>
  <path d="M184 272C240 238 276 238 328 272"/>
 </g>
 <path d="M180 128C210 98 233 96 246 95" fill="none" stroke="#fff4d8" stroke-opacity=".62" stroke-width="8" stroke-linecap="round"/>
 <!-- Letterpress divider and insignia -->
 <path d="M107 328H206 M306 328H405" stroke="#caa261" stroke-width="3"/>
 <path d="M256 318L265 328L256 338L247 328Z" fill="#d5ae71"/>
 <text x="256" y="411" text-anchor="middle" fill="#f8f2e4" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" letter-spacing="-6">SLT</text>
 <path d="M165 427H347" stroke="#c9a26c" stroke-width="2"/>
 <text x="256" y="453" text-anchor="middle" fill="#e3c995" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="5">THE HARDWOOD</text>
</g>
</svg>