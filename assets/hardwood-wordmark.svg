</g>
<text x="241" y="185" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="127" letter-spacing="-8.5" fill="#112f3d" textLength="846" lengthAdjust="spacingAndGlyphs">ARDWOOD</text>
