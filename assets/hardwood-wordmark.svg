<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 230" role="img" aria-labelledby="title desc">
<title id="title">The Hardwood — The Sporting Life and Times</title>
<desc id="desc">An original letterpress basketball newspaper wordmark. A custom garnet slab-serif H carries the midcourt circle and a fine garnet rule under the full Hardwood title.</desc>
<g fill="#8c2330">
 <path d="M40 51H127V68H105V104H171V68H149V51H236V68H214V184H236V201H149V184H171V127H105V184H127V201H40V184H62V68H40Z"/>
</g>
<!-- Midcourt target becomes the H crossbar: a unique typographic detail, not a ball or crest -->
