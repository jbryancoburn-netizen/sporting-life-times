<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>College Basketball Daily Ledger | Sporting Life &amp; Times</title>
</head>
<body>
  <main><p>Opening the <a id="ledger-link" href="ncaam-slate.html">Daily Ledger</a>…</p></main>
  <script>
    const previous = new URLSearchParams(location.search);
    const ledger = new URL('ncaam-slate.html', location.href);
    for (const key of ['gender', 'game']) {
      if (previous.has(key)) ledger.searchParams.set(key, previous.get(key));
    }
    const date = previous.get('date') || previous.get('day');
    if (date) ledger.searchParams.set('date', date);
    document.getElementById('ledger-link').href = ledger.href;
    location.replace(ledger.href);
  </script>
</body>
</html>
