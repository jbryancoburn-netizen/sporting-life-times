<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Women’s Basketball Team Desk | The Sporting Life &amp; Times</title>
<link rel="stylesheet" href="mbb-newspaper.css?v=wbb-team-editorial-20261030">
<style>
.wbb-desk{--accent:#7b2429;--accent2:#303f49;max-width:1160px;margin:auto;padding:22px 20px 55px}.wbb-desk a{color:inherit}.wbb-desk .eyebrow{letter-spacing:.13em;text-transform:uppercase;font-size:.72rem;font-weight:700;color:var(--accent)}.wbb-mast{border-top:5px solid var(--accent);background:#fffefa;padding:25px 29px;margin-bottom:15px;box-shadow:0 2px 11px #0000000a}.wbb-identity{display:flex;align-items:center;gap:22px}.wbb-identity img{height:110px;width:110px;object-fit:contain;border:3px solid var(--accent);border-radius:50%;padding:10px;background:#fff}.wbb-identity h1{font-family:'Libre Caslon Display',Georgia,serif;font-size:clamp(2rem,5vw,3.5rem);line-height:1.05;margin:5px 0}.wbb-identity p{margin:7px 0}.wbb-nav{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 0;border-top:1px solid #ddd;padding-top:14px}.wbb-nav a{padding:7px 12px;border:1px solid #d4d7d8;font-weight:700;font-size:.82rem}.wbb-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}.wbb-kpi,.wbb-panel{background:#fffefa;border:1px solid #d5d8d5;padding:18px}.wbb-kpi small{display:block;color:#5c666a;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.wbb-kpi strong{display:block;font-size:1.65rem;margin-top:4px}.wbb-layout{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(240px,1fr);gap:15px}.wbb-panel{margin-bottom:15px}.wbb-panel h2{font-family:'Libre Caslon Display',Georgia,serif;font-size:1.65rem;margin:0 0 11px;border-bottom:2px solid var(--accent);padding-bottom:9px}.wbb-note{background:#fff8e5;border-left:4px solid #af861f;padding:11px 13px;font-size:.84rem;margin:13px 0}.wbb-table-wrap{overflow-x:auto}.wbb-table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:510px}.wbb-table th{background:#eaece9;color:#37454b;text-align:left;font-size:.73rem;text-transform:uppercase;letter-spacing:.035em}.wbb-table td,.wbb-table th{padding:9px;border-bottom:1px solid #e0e2de}.wbb-table tbody tr:nth-child(even){background:#f7f8f5}.wbb-opponent{font-weight:700;text-decoration:underline;text-decoration-color:#b1b4b4;text-underline-offset:3px}.wbb-meta-list{margin:0;padding:0;list-style:none}.wbb-meta-list li{padding:10px 0;border-bottom:1px solid #e7e7e7}.wbb-muted{color:#5a6569}.wbb-error{padding:16px;background:#ffeded;border-left:4px solid #aa2525}@media(max-width:760px){.wbb-layout{grid-template-columns:1fr}.wbb-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.wbb-identity img{height:75px;width:75px}.wbb-mast{padding:16px}.wbb-desk{padding:12px}.wbb-kpi{padding:12px}}
</style></head><body><div class="wrap"><header><div class="topline"><a href="index.html">Independent sports journalism &amp; data</a><span>College basketball · 2026–27</span></div><div class="masthead"><a href="index.html">The Sporting Life &amp; Times</a></div><div class="edition-line">The Women’s College Basketball Edition</div><nav class="nav" aria-label="Women’s college basketball navigation"><a href="ncaam.html?gender=women">Front Page</a><a href="ncaam.html?gender=women#wbb-standings">Conferences</a><a href="ncaam.html?gender=women#wbb-rankings">USRS Rankings</a><a href="ncaam.html?gender=women#wbb-teams">Team Directory</a><a href="ncaam.html">Men's Edition</a></nav></header>
<main class="wbb-desk" id="desk"><section class="wbb-mast"><h1>Loading women’s team desk…</h1></section></main><footer class="footer">The Sporting Life &amp; Times · Independent women’s Division I basketball edition.</footer></div>
<script>
(async function(){
'use strict';
const id=new URLSearchParams(location.search).get('team')||new URLSearchParams(location.search).get('id');
const host=document.getElementById('desk');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p+' HTTP '+r.status);return r.json()};
if(!id||!/^[0-9]+$/.test(id)){host.innerHTML='<div class="wbb-panel"><h2>Choose a team</h2><a href="ncaam.html?gender=women#wbb-teams">Women’s team directory →</a></div>';return}
try{
const [registry,master,ratings]=await Promise.all([load('data/ncaaw-2026-27-teams.json'),load('data/ncaaw-schedules-2026-27.json'),load('data/ncaaw-2026-27-retro-primary.json').catch(()=>null)]);
const teams=registry.teams||[],lookup=new Map(teams.map(t=>[String(t.team_id),t]));
const t=lookup.get(id),entry=master.teams?.[id];
if(!t||!entry)throw Error('No published women’s schedule found for team '+id);
const games=entry.games||[],rating=ratings?.gender==='women'&&ratings?.season==='2026-27'?ratings.rankings?.find(x=>String(x.team_id)===id):null;
const sorted=games.slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
const site=g=>g.site==='home'?'HOME':g.site==='away'?'AWAY':g.site==='neutral'?'NEUTRAL':'TBA';
const count=s=>games.filter(g=>g.site===s).length;
const color=/^[0-9a-fA-F]{6}$/.test(t.color||'')?'#'+t.color:'#7b2429';
host.style.setProperty('--accent',color);
document.title=t.team+' · Women’s Basketball | The Sporting Life & Times';
const record=rating?String(rating.wins||0)+'–'+String(rating.losses||0):'—';
const logo=/^https:\/\//.test(t.logo||'')?'<img alt="" src="'+esc(t.logo)+'">':'';
const rows=sorted.map(g=>{
  const opp=lookup.get(String(g.opponent_id||''));
  const opponent=opp?'<a class="wbb-opponent" href="ncaaw-team.html?team='+encodeURIComponent(opp.team_id)+'">'+esc(g.opponent||opp.team)+'</a>':esc(g.opponent||'Opponent TBA');
  const d=new Date(g.date);
  const date=Number.isNaN(d.getTime())?esc(g.date||'TBA'):esc(d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'America/New_York'}));
  return '<tr><td>'+date+'</td><td>'+esc(site(g))+'</td><td>'+opponent+'</td><td>'+esc(g.venue||'TBA')+'</td></tr>';
}).join('');
host.innerHTML='<section class="wbb-mast"><div class="wbb-identity">'+logo+'<div><div class="eyebrow">The Women’s Team Desk · 2026–27</div><h1>'+esc(t.team)+'</h1><p>'+esc(t.conference||'Conference unverified')+' · NCAA Division I</p></div></div><div class="wbb-nav"><a href="#schedule">Full Schedule</a><a href="#team-notes">Team Notes</a><a href="#roster">Roster & Players</a><a href="ncaam.html?gender=women#wbb-rankings">Women’s Rankings</a><a href="ncaam.html?gender=women#wbb-teams">All 363 Teams</a></div></section>'+
'<section class="wbb-kpis"><div class="wbb-kpi"><small>Women’s Elo</small><strong>'+esc(rating&&Number.isFinite(Number(rating.elo))?Number(rating.elo).toFixed(0):'—')+'</strong></div><div class="wbb-kpi"><small>Overall Record</small><strong>'+esc(record)+'</strong></div><div class="wbb-kpi"><small>Scheduled Games</small><strong>'+games.length+'</strong></div><div class="wbb-kpi"><small>Home / Away / Neutral</small><strong>'+count('home')+' / '+count('away')+' / '+count('neutral')+'</strong></div></section>'+
'<div class="wbb-layout"><div><section class="wbb-panel" id="schedule"><div class="eyebrow">The season ahead</div><h2>2026–27 Full Team Schedule</h2><p class="wbb-note">Official-school Level 1 schedule certification remains in progress. Opponents, dates and sites not yet independently verified are provisional. Games retain their existing IDs.</p><div class="wbb-table-wrap"><table class="wbb-table"><thead><tr><th>Date</th><th>Site</th><th>Opponent</th><th>Venue</th></tr></thead><tbody>'+rows+'</tbody></table></div></section></div><aside><section class="wbb-panel" id="team-notes"><div class="eyebrow">At a glance</div><h2>Team Information</h2><ul class="wbb-meta-list"><li><strong>School</strong><br>'+esc(t.team)+'</li><li><strong>Conference</strong><br>'+esc(t.conference||'TBA')+'</li><li><strong>Women’s Elo methodology</strong><br>All programs begin 2026–27 at 1500. No men’s results are included.</li><li><strong>Schedule</strong><br>'+games.length+' currently listed games</li></ul></section><section class="wbb-panel" id="roster"><div class="eyebrow">Players</div><h2>Roster & Leaders</h2><p class="wbb-muted">A verified 2026–27 women’s roster and player-statistics feed is not yet published. No men’s roster data will be substituted.</p></section><section class="wbb-panel"><h2>Explore</h2><ul class="wbb-meta-list"><li><a href="ncaam.html?gender=women#wbb-standings">Conference standings →</a></li><li><a href="ncaam.html?gender=women#wbb-rankings">Women’s USRS rankings →</a></li><li><a href="ncaam.html?gender=women#wbb-teams">Find another team →</a></li></ul></section></aside></div>';
}catch(e){host.innerHTML='<section class="wbb-panel wbb-error"><h2>Women’s team desk unavailable</h2><p>'+esc(e.message)+'</p><p><a href="ncaam.html?gender=women#wbb-teams">Browse women’s teams</a></p></section>'}
})();
</script></body></html>
