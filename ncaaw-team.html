<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Women's Basketball Team Desk | The Sporting Life & Times</title>
<link rel="stylesheet" href="mbb-newspaper.css">
<style>body{font-family:Georgia,serif;max-width:1150px;margin:auto;padding:24px;color:#18212a;background:#fff}header{border-bottom:3px double #222;padding-bottom:14px;margin-bottom:24px}header a{color:inherit}h1{font-size:2.3rem;margin:8px 0}.team-header{display:flex;align-items:center;gap:16px}.team-header img{width:86px;height:86px;object-fit:contain}.meta{color:#555}table{border-collapse:collapse;width:100%;font-size:0.94rem}th,td{border-bottom:1px solid #d8d8d8;padding:9px 7px;text-align:left}th{background:#f3f3f3}tbody tr:nth-child(even){background:#fafafa}.status{border-left:4px solid #b27a16;padding:12px;background:#fff9e9}a{color:#164774}@media(max-width:700px){body{padding:12px}table{font-size:.78rem}th,td{padding:6px 3px}.team-header img{width:64px;height:64px}}</style>
</head><body><header><a href="ncaam.html?gender=women">← Women's College Basketball</a><p class="meta">THE SPORTING LIFE & TIMES · NCAA DIVISION I WOMEN</p></header>
<main><div id="team"><h1>Loading team schedule…</h1></div><div id="schedule"></div></main>
<script>
(async()=>{
const params=new URLSearchParams(location.search),id=params.get('id')||params.get('team');
const teamBox=document.getElementById('team'),scheduleBox=document.getElementById('schedule');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!id||!/^[0-9]+$/.test(id)){teamBox.innerHTML='<h1>Choose a team</h1><p><a href="ncaam.html?gender=women#wbb-teams">Browse women’s teams</a></p>';return}
try{
const [registry,cal]=await Promise.all(['data/ncaaw-2026-27-teams.json','data/ncaaw-schedules-2026-27.json'].map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(u+' HTTP '+r.status);return r.json()}));
const t=registry.teams?.find(t=>String(t.team_id)===id),d=cal.teams?.[id];
if(!t){teamBox.innerHTML='<h1>Team not found</h1>';return}
document.title=t.team+' | Women’s Basketball | The Sporting Life & Times';
teamBox.innerHTML='<div class="team-header"><img alt="" src="'+esc(t.logo)+'"><div><p class="meta">2026–27 WOMEN’S BASKETBALL</p><h1>'+esc(t.team)+'</h1><p>'+esc(t.conference||'NCAA Division I')+'</p></div></div>';
const games=d?.games||[];
scheduleBox.innerHTML='<h2>2026–27 Schedule · '+games.length+' games</h2><p class="status">Official university verification is ongoing. Games and site classifications not yet confirmed against university sources remain provisional; no unannounced details are invented.</p>'+(games.length?'<div style="overflow-x:auto"><table><thead><tr><th>Date (ET)</th><th>Site</th><th>Opponent</th><th>Arena</th></tr></thead><tbody>'+games.map(g=>{const date=new Date(g.date),stamp=Number.isNaN(+date)?(g.date||'TBA'):date.toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});return '<tr><td>'+esc(stamp)+'</td><td>'+esc(g.site||'TBA')+'</td><td>'+esc(g.opponent||'TBA')+'</td><td>'+esc(g.venue||'TBA')+'</td></tr>'}).join('')+'</tbody></table></div>':'<p>No schedule rows are available yet.</p>');
}catch(e){teamBox.innerHTML='<h1>Schedule temporarily unavailable</h1><p>'+esc(e.message)+'</p>'}
})();
</script></body></html>
