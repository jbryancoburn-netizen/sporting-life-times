</style></head><body><div class="wrap"><header><div class="topline"><a href="index.html">Independent sports journalism &amp; data</a><span>College basketball · 2026–27</span></div><div class="masthead"><a href="index.html">The Sporting Life &amp; Times</a></div><div class="edition-line">The Women’s College Basketball Edition</div><nav class="nav" aria-label="Women’s college basketball navigation"><a href="ncaam.html?gender=women">Front Page</a><a href="ncaam.html?gender=women#wbb-standings">Conferences</a><a href="ncaam.html?gender=women#wbb-rankings">USRS Rankings</a><a href="ncaam.html?gender=women#wbb-teams">Team Directory</a><a href="ncaam.html">Men's Edition</a></nav></header>
<main class="wbb-desk" id="desk"><section class="wbb-mast"><h1>Loading women’s team desk…</h1></section></main><footer class="footer">The Sporting Life &amp; Times · Independent women’s Division I basketball edition.</footer></div>
<script>
(async function(){
'use strict';
const id=new URLSearchParams(location.search).get('team')||new URLSearchParams(location.search).get('id');
const host=document.getElementById('desk');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p+' HTTP '+r.status);return r.json()};
if(!id||!/^[0-9]+$/.test(id)){host.innerHTML='<div class="wbb-panel"><h2>Choose a team</h2><a href="ncaam.html?gender=women#wbb-teams">Women’s team directory →</a></div>';return}
try{
await window.MBBLogos.ready;
const [registry,master,ratings,officialTV,scoreboardTV,palette,artwork]=await Promise.all([load('data/ncaaw-2026-27-teams.json'),load('data/ncaaw-schedules-2026-27.json'),load('data/ncaaw-2026-27-retro-primary.json').catch(()=>null),load('data/ncaaw-2026-27-official-broadcast-overrides.json').catch(()=>null),load('data/ncaaw-2026-27-scoreboard-broadcast-overlays.json').catch(()=>null),load('data/dual-ring-team-palette.json').catch(()=>null),load('data/mbb-logo-registry.json').catch(()=>null)]);
const teams=registry.teams||[],lookup=new Map(teams.map(t=>[String(t.team_id),t]));
const t=lookup.get(id),entry=master.teams?.[id];
if(!t||!entry)throw Error('No published women’s schedule found for team '+id);
const games=entry.games||[],rating=ratings?.gender==='women'&&ratings?.season==='2026-27'?ratings.rankings?.find(x=>String(x.team_id)===id):null;
const sorted=games.slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
const rmap=new Map((ratings?.gender==='women'?ratings.rankings||[]:[]).map(x=>[String(x.team_id),x]));
const tvmap=new Map();
for(const row of scoreboardTV?.gender==='women'&&scoreboardTV?.season==='2026-27'?(scoreboardTV.rows||[]):[]){if(row.game_id&&row.broadcast)tvmap.set(String(row.game_id),row);}
for(const row of officialTV?.gender==='women'&&officialTV?.season==='2026-27'?(officialTV.rows||[]):[]){if(row.game_id&&row.broadcast&&row.source_url)tvmap.set(String(row.game_id),row);}
const fmtElo=x=>x&&Number.isFinite(Number(x.elo))?Math.round(Number(x.elo)).toString():'—';
const scenarioK=20; // Illustration only; production women's Elo K is not published.
const homeEdge=Number(ratings?.parameters?.home_edge)||75;
const winChance=(ours,theirs,g)=>{if(!ours||!theirs||!Number.isFinite(Number(ours.elo))||!Number.isFinite(Number(theirs.elo)))return '—';const edge=g.site==='home'?homeEdge:g.site==='away'?-homeEdge:0;return (100/(1+Math.pow(10,-((Number(ours.elo)-Number(theirs.elo)+edge)/400)))).toFixed(0)+'%';};
const site=g=>g.site==='home'?'HOME':g.site==='away'?'AWAY':g.site==='neutral'?'NEUTRAL':'TBA';
const count=s=>games.filter(g=>g.site===s).length;
const color=/^[0-9a-fA-F]{6}$/.test(t.color||'')?'#'+t.color:'#7b2429';
host.style.setProperty('--accent',color);
document.title=t.team+' · Women’s Basketball | The Sporting Life & Times';
const record=rating?String(rating.wins||0)+'–'+String(rating.losses||0):'—';
const logo=window.MBBLogos.byESPN(id,'hero',t.team);
const rows=sorted.map(g=>{
  const opp=lookup.get(String(g.opponent_id||''));
  const badge=opp?window.MBBLogos.byESPN(String(opp.team_id),'schedule',opp.team):'';const opponent=opp?'<a class="wbb-opponent wbb-team-opp" href="ncaaw-team.html?team='+encodeURIComponent(opp.team_id)+'">'+badge+'<span class="wbb-opponent-label">'+esc(g.opponent||opp.team)+'</span></a>':esc(g.opponent||'Opponent TBA');
  const d=new Date(g.date);
  const date=Number.isNaN(d.getTime())?esc(g.date||'TBA'):esc(d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'America/New_York'}));
  const other=rmap.get(String(g.opponent_id||''));
  const tv=tvmap.get(String(g.id)),tvName=tv?.broadcast||g.broadcast||'Network TBA',tvUrl=tv?.source_url||g.broadcast_source_url||'';
  const television=tvUrl.startsWith('https://')?'<a href="'+esc(tvUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(tvName)+' ↗</a>':esc(tvName);const probability=winChance(rating,other,g);const p=probability==='—'?null:Number.parseFloat(probability)/100;const delta=p===null?'—':'W +'+(scenarioK*(1-p)).toFixed(1)+' / L −'+(scenarioK*p).toFixed(1);
  const city=String(g.city||g.city_state||'').trim();const location=esc(g.venue||'Arena TBA')+(city?'<span class="wbb-location-note">'+esc(city)+'</span>':'');
  const officialTip=g.official_school_time||g.official_time||g.verified_tipoff||'';
  const tip=officialTip&&!/TBA|TBD/i.test(officialTip)?esc(officialTip):'TBA';
  const outcome=g.completed&&g.home_score!=null&&g.away_score!=null?
    (Number(g.site==='away'?g.away_score:g.home_score)>Number(g.site==='away'?g.home_score:g.away_score)?'W ':'L ')+
    esc(g.site==='away'?g.away_score+'–'+g.home_score:g.home_score+'–'+g.away_score):'—';
  return '<tr><td>'+date+'</td><td><div class="sched-matchup">'+opponent+'<span class="wbb-site-label">'+esc(site(g))+'</span></div></td><td>'+location+'</td><td>'+tip+'</td><td class="wbb-broadcast">'+television+'</td><td>'+fmtElo(other)+'</td><td class="wbb-forecast">'+probability+'</td><td class="wbb-forecast">'+delta+'</td><td>'+outcome+'</td></tr>';
}).join('');
host.innerHTML='<section class="wbb-mast"><div class="wbb-identity">'+logo+'<div><div class="eyebrow">The Women’s Team Desk · 2026–27 · Build 1345</div><h1>'+esc(t.team)+'</h1><p>'+esc(t.conference||'Conference unverified')+' · NCAA Division I</p></div></div><div class="wbb-nav"><a href="#schedule">Full Schedule</a><a href="#team-notes">Team Notes</a><a href="#roster">Roster & Players</a><a href="ncaam.html?gender=women#wbb-rankings">Women’s Rankings</a><a href="ncaam.html?gender=women#wbb-teams">All 363 Teams</a></div></section>'+
'<section class="wbb-kpis"><div class="wbb-kpi"><small>Women’s Elo</small><strong>'+esc(rating&&Number.isFinite(Number(rating.elo))?Number(rating.elo).toFixed(0):'—')+'</strong></div><div class="wbb-kpi"><small>Overall Record</small><strong>'+esc(record)+'</strong></div><div class="wbb-kpi"><small>Scheduled Games</small><strong>'+games.length+'</strong></div><div class="wbb-kpi"><small>Home / Away / Neutral</small><strong>'+count('home')+' / '+count('away')+' / '+count('neutral')+'</strong></div></section>'+
'<div class="wbb-layout"><div><section class="wbb-panel" id="schedule"><div class="eyebrow">The season ahead</div><h2>2026–27 Full Team Schedule</h2><p class="wbb-note">Women’s Elo win percentages are model projections, not guarantees. *Elo change scenarios use an illustrative K=20 because the published women’s rating feed does not expose its update factor; these are not official projected rating changes. Official-school Level 1 schedule certification remains in progress. Opponents, dates and sites not yet independently verified are provisional. Games retain their existing IDs.</p><div class="table-wrap"><table class="mbb-schedule-table"><thead><tr><th>Date</th><th>Opponent</th><th>Arena / City</th><th>Tipoff (official)</th><th>TV / Stream</th><th>Opp. RETRO</th><th>Win %</th><th>Elo Δ W / L*</th><th>Result</th></tr></thead><tbody>'+rows+'</tbody></table></div></section></div><aside><section class="wbb-panel" id="team-notes"><div class="eyebrow">At a glance</div><h2>Team Information</h2><ul class="wbb-meta-list"><li><strong>School</strong><br>'+esc(t.team)+'</li><li><strong>Conference</strong><br>'+esc(t.conference||'TBA')+'</li><li><strong>Women’s Elo methodology</strong><br>All programs begin 2026–27 at 1500. No men’s results are included.</li><li><strong>Schedule</strong><br>'+games.length+' currently listed games</li></ul></section><section class="wbb-panel"><h2>Explore</h2><ul class="wbb-meta-list"><li><a href="ncaam.html?gender=women#wbb-standings">Conference standings →</a></li><li><a href="ncaam.html?gender=women#wbb-rankings">Women’s USRS rankings →</a></li><li><a href="ncaam.html?gender=women#wbb-teams">Find another team →</a></li></ul></section></aside></div><section class="wbb-panel wbb-roster-full" id="roster"><div class="eyebrow">2026–27 Women’s Basketball</div><h2>Team Roster &amp; Players</h2><div id="wbb-roster-host"><p class="wbb-muted">Loading women’s roster…</p></div></section>';
window.WBBRosterDesk?.render(id);
}catch(e){host.innerHTML='<section class="wbb-panel wbb-error"><h2>Women’s team desk unavailable</h2><p>'+esc(e.message)+'</p><p><a href="ncaam.html?gender=women#wbb-teams">Browse women’s teams</a></p></section>'}
})();
</script></body></html>
